<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Pedidos — Manel's Pizzaria</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{ --dark-green:#2d4a3a; --terracotta:#c0622f; --beige:#f5e6d3; }
  *{box-sizing:border-box;}
  body{ font-family:'Courier New', monospace; background:var(--dark-green); color:var(--beige); margin:0; padding:20px; min-height:100vh; }
  header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding-bottom:14px; border-bottom:2px solid var(--terracotta); flex-wrap:wrap; gap:10px; }
  h1{ margin:0; font-size:1.3rem; }
  #status{ font-size:.8rem; padding:6px 12px; border-radius:20px; background:rgba(255,255,255,.1); }
  #status.ok{ color:#8fd19e; } #status.erro{ color:#e88; }

  #resumo-dia{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .cartao-resumo{ background:rgba(255,255,255,.1); border-radius:8px; padding:10px 16px; min-width:120px; }
  .cartao-resumo .num{ font-size:1.3rem; font-weight:bold; color:var(--beige); }
  .cartao-resumo .lbl{ font-size:.7rem; opacity:.75; text-transform:uppercase; }

  .tabs{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .tab{ font-family:inherit; font-size:.85rem; padding:8px 16px; border:none; border-radius:20px; cursor:pointer; font-weight:bold; background:rgba(255,255,255,.12); color:var(--beige); }
  .tab.active{ background:var(--terracotta); color:#fff; }

  .barra-acoes{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  .barra-acoes input[type=text]{ font-family:inherit; padding:8px 12px; border-radius:6px; border:none; font-size:.85rem; min-width:200px; }
  .btn-topo{ font-family:inherit; font-size:.82rem; padding:8px 14px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; background:rgba(255,255,255,.15); color:var(--beige); }
  .btn-topo:hover{ background:rgba(255,255,255,.25); }

  .grade{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:14px; }
  .data-cabecalho{ grid-column:1/-1; font-size:.9rem; font-weight:bold; color:var(--beige); opacity:.85; margin:10px 0 -2px 4px; border-bottom:1px dashed rgba(255,255,255,.3); padding-bottom:4px; }

  .pedido{ background:#fff; color:#222; border-radius:10px; padding:14px; box-shadow:0 3px 10px rgba(0,0,0,.25); border-left:6px solid var(--terracotta); animation:novo .5s ease; display:flex; flex-direction:column; }
  .pedido.status-finalizado_pago{ border-left-color:#3a7d4a; }
  .pedido.status-em_andamento{ border-left-color:#3a72c0; }
  .pedido.status-pendencia{ border-left-color:#c03a3a; }
  .pedido.atrasado{ box-shadow:0 0 0 3px #e05a3a; }
  @keyframes novo{ 0%{ transform:scale(1.03); box-shadow:0 0 0 6px rgba(192,98,47,.4);} 100%{ transform:scale(1); box-shadow:0 3px 10px rgba(0,0,0,.25);} }
  .pedido-topo{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:6px; }
  .pedido-numero{ font-weight:bold; font-size:.85rem; color:#555; }
  .pedido-hora{ font-size:.75rem; color:#888; }
  .pedido-total{ font-weight:bold; color:var(--terracotta); font-size:1.05rem; }

  select.status-select{ font-family:inherit; font-size:.78rem; padding:5px 8px; border-radius:12px; font-weight:bold; border:none; margin-bottom:8px; }
  .status-select.novo{ background:#fdecdc; color:var(--terracotta); }
  .status-select.em_andamento{ background:#dde9fb; color:#3a72c0; }
  .status-select.finalizado_pago{ background:#e3f3e6; color:#3a7d4a; }
  .status-select.pendencia{ background:#fbdada; color:#c03a3a; }
  .status-select.impresso{ background:#eee; color:#666; }

  textarea{ width:100%; font-family:'Courier New', monospace; font-size:.8rem; padding:8px; border-radius:6px; border:1px dashed #ccc; background:#fafafa; color:#222; min-height:160px; resize:vertical; margin-bottom:8px; flex:1; }
  .campo-lbl{ display:block; font-size:.68rem; opacity:.65; margin-bottom:2px; font-weight:bold; text-transform:uppercase; letter-spacing:.02em; }
  .campo-grupo{ display:inline-flex; flex-direction:column; margin:0 8px 8px 0; }
  .acoes{ display:flex; gap:6px; flex-wrap:wrap; }
  button.acao{ font-family:inherit; font-size:.78rem; padding:7px 12px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; }
  .btn-imprimir{ background:var(--dark-green); color:#fff; }
  .btn-salvar{ background:#d9a441; color:#fff; }
  .btn-ok{ background:#e9e9e9; color:#555; }
  .btn-excluir{ background:#c03a3a; color:#fff; }

  #vazio{ text-align:center; padding:60px 20px; opacity:.6; }
  #tela-senha{ position:fixed; inset:0; background:var(--dark-green); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:999; }
  #tela-senha input{ font-family:inherit; font-size:1rem; padding:10px 14px; border-radius:6px; border:none; width:220px; text-align:center; }
  #tela-senha button{ font-family:inherit; font-size:.9rem; padding:10px 20px; border:none; border-radius:6px; background:var(--terracotta); color:#fff; font-weight:bold; cursor:pointer; }
  #tela-senha .erro-senha{ color:#f7b0a0; font-size:.85rem; min-height:1em; }
</style>

<body>

<div id="conteudo" style="display:none;">

    <h1>🍕 Painel de Pedidos — Manel's</h1>
    <div style="display:flex; align-items:center; gap:10px;">

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:2px solid #eee; padding-bottom:10px;">

        <div class="campo-grupo" style="flex:1; min-width:140px;"><label class="campo-lbl">Nome do cliente</label><input type="text" id="builder-nome" placeholder="Ex: Maria Silva" style="width:100%; padding:6px 8px;"></div>

      </div>

      <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; font-size:.85rem;">

      <input type="text" id="builder-obs" placeholder="Observação geral do pedido (opcional)" style="width:100%; margin-top:8px; padding:6px 8px;">
      <div style="margin-top:8px; font-size:.85rem;">
        <label><input type="checkbox" id="builder-ketchup"> Ketchup grátis</label>
        <label style="margin-left:14px;">Maionese temperada (unidades, a 1ª é grátis): <input type="number" id="builder-maionese" value="0" min="0" style="width:55px;" oninput="renderBuilderCart()"></label>
      </div>
    </div>

    <div style="margin-bottom:16px; border-top:1px dashed #ccc; padding-top:12px;">
      <h4 style="margin:0 0 8px;">🛒 Itens do pedido</h4>
      <div id="builder-cart-lista"></div>
      <p id="builder-cart-vazio" style="opacity:.6; font-size:.85rem;">Nenhum item ainda.</p>

    <div style="margin-bottom:16px; border-top:1px dashed #ccc; padding-top:12px;">

<script>
const SUPABASE_URL = "https://wzmiqubfzlmglimmtkoz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ockSNlwXiqu24_AaNX6tYQ_lQPQSv_7";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function conferirSenha(){
  const email = document.getElementById('input-email').value.trim();
  const senha = document.getElementById('input-senha').value;
  const erroEl = document.getElementById('erro-senha');
  erroEl.textContent = '';
  if(!email || !senha){ erroEl.textContent = 'Preencha e-mail e senha.'; return; }
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
  if(error){
    erroEl.textContent = error.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : error.message;
    return;
  }
  document.getElementById('tela-senha').style.display = 'none';
  document.getElementById('conteudo').style.display = 'block';
  iniciar();
}
async function sairPainel(){
  await supabaseClient.auth.signOut();
  document.getElementById('conteudo').style.display = 'none';
  document.getElementById('tela-senha').style.display = 'flex';
  document.getElementById('input-senha').value = '';
}
document.getElementById('input-senha').addEventListener('keydown', e => { if(e.key === 'Enter') conferirSenha(); });
document.getElementById('input-email').addEventListener('keydown', e => { if(e.key === 'Enter') conferirSenha(); });

// Se já existe uma sessão válida (ex: recarregou a página), pula a tela de login.
supabaseClient.auth.getSession().then(({ data: { session } }) => {
  if(session){
    document.getElementById('tela-senha').style.display = 'none';
    document.getElementById('conteudo').style.display = 'block';
    iniciar();
  }
});

const STATUS_LABELS = {
  novo: '🟠 Recebido',
  em_andamento: '🔵 Em andamento',
  finalizado_pago: '🟢 Finalizado e pago',
  pendencia: '🔴 Pendência',
  impresso: '⚪ Impresso',
  feito_sem_impressao: '⚪ Feito (sem impressão)'
};
const STATUS_ATIVOS = ['novo','em_andamento','pendencia','impresso'];
const MINUTOS_ATRASO = 15;

const statusEl = document.getElementById('status');
const listaEl = document.getElementById('lista');
const vazioEl = document.getElementById('vazio');

let modoAtual = 'novos';
let pedidosAtivos = [];
let pedidosHistorico = [];

// ===== SOM DE AVISO DE NOVO PEDIDO =====
// Gerado direto no navegador (Web Audio API) em vez de usar um arquivo de som externo:
// não depende de nenhum site de terceiro pra funcionar (não quebra se o link cair) e
// não tem restrição de licença nenhuma, já que não é um arquivo de áudio baixado — é só código.
let audioCtxAviso = null;
function getAudioCtxAviso(){
  if(!audioCtxAviso){
    audioCtxAviso = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtxAviso.state === 'suspended') audioCtxAviso.resume();
  return audioCtxAviso;
}
// Toca uma "badalada" de sino: soma a nota principal com dois harmônicos mais agudos
// em volume menor, o que dá o timbre metálico característico de campainha/sino — uma
// nota "pura" sozinha soa mais como apito do que como sino.
function tocarBadalada(ctx, freqBase, inicio, volume){
  const parciais = [
    { mult: 1.0, vol: 1.00, decaimento: 0.75 },
    { mult: 2.4, vol: 0.45, decaimento: 0.55 },
    { mult: 3.8, vol: 0.22, decaimento: 0.40 },
  ];
  parciais.forEach(p => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freqBase * p.mult;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const t0 = ctx.currentTime + inicio;
    const vol = volume * p.vol;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + p.decaimento);
    osc.start(t0);
    osc.stop(t0 + p.decaimento + 0.05);
  });
}
function tocarSomAviso(){
  try{
    const ctx = getAudioCtxAviso();
    const FREQ = 1046.50; // Dó6 — agudo e brilhante, tipo campainha de balcão/forno
    // 3 badaladas rápidas e firmes — bem chamativo, tipo alguém batendo na campainha com força
    tocarBadalada(ctx, FREQ, 0.00, 0.40);
    tocarBadalada(ctx, FREQ, 0.30, 0.40);
    tocarBadalada(ctx, FREQ, 0.60, 0.40);
  } catch(e){
    console.error('Não foi possível tocar o som de aviso:', e);
  }
}

function tocarAviso(){
  tocarSomAviso();
  if(document.title.indexOf('🔔') === -1) document.title = '🔔 NOVO PEDIDO! — Manel\'s';
}
function pararAviso(){ document.title = "Painel de Pedidos — Manel's Pizzaria"; }

function formatarHora(iso){ return new Date(iso).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); }
function formatarDataLonga(iso){
  const d = new Date(iso);
  const hoje = new Date(); const ontem = new Date(); ontem.setDate(hoje.getDate()-1);
  const mesmoDia = (a,b) => a.toDateString() === b.toDateString();
  if(mesmoDia(d, hoje)) return 'Hoje, ' + d.toLocaleDateString('pt-BR');
  if(mesmoDia(d, ontem)) return 'Ontem, ' + d.toLocaleDateString('pt-BR');
  return d.toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'2-digit'});
}
function chaveDia(iso){ return new Date(iso).toDateString(); }

function capturarEdicoes(){
  const edicoes = {};
  document.querySelectorAll('textarea[data-id]').forEach(t => { edicoes[t.dataset.id] = t.value; });
  return edicoes;
}

function mudarAba(aba){
  modoAtual = aba;
  document.getElementById('tab-novos').classList.toggle('active', aba === 'novos');
  document.getElementById('tab-historico').classList.toggle('active', aba === 'historico');
  document.getElementById('filtro-dia').style.display = aba === 'historico' ? 'flex' : 'none';
  if(aba === 'historico') carregarHistorico();
  renderizar();
}

function pedidoNumero(p, listaOrdenada){
  const idx = listaOrdenada.findIndex(x => x.id === p.id);
  return idx + 1;
}

function renderizarResumoDia(){
  const hojeStr = new Date().toDateString();
  const doDia = [...pedidosAtivos, ...pedidosHistorico].filter(p => chaveDia(p.created_at) === hojeStr);
  const unicos = Array.from(new Map(doDia.map(p => [p.id, p])).values());
  const qtd = unicos.length;
  document.getElementById('resumo-dia').innerHTML = `
    <div class="cartao-resumo"><div class="num">${qtd}</div><div class="lbl">Pedidos hoje</div></div>
  `;
}

// Extrai o nome do cliente de dentro do texto da comanda (não existe um campo
// separado no banco pra isso — o nome só existe na linha "Cliente:" do texto).
// Se essa linha for apagada ou alterada manualmente na comanda, o nome some daqui também.
// Extrai o valor total de dentro do texto da comanda (linha "TOTAL A COBRAR").
// Usado para manter o campo "total" do banco sincronizado quando alguém edita
// o texto da comanda manualmente no painel.
function extrairTotalComanda(texto){
  if(!texto) return null;
  const m = texto.match(/TOTAL A COBRAR:\s*R\$\s*([\d.,]+)/i);
  if(!m) return null;
  const num = parseFloat(m[1].replace(/\./g,'').replace(',', '.'));
  return isNaN(num) ? null : num;
}

function extrairNomeCliente(texto){
  if(!texto) return '';
  const m = texto.match(/Cliente:\s*([^\n]+)/i);
  return m ? m[1].trim() : '';
}

function filtrarBusca(lista){
  const termo = document.getElementById('busca').value.trim().toLowerCase();
  if(!termo) return lista;
  return lista.filter(p => (p.texto_comanda || '').toLowerCase().includes(termo));
}

function renderizar(){
  renderizarResumoDia();
  const edicoesAtuais = capturarEdicoes();
  let lista = modoAtual === 'novos' ? pedidosAtivos : pedidosHistorico;
  lista = filtrarBusca(lista);
  const listaOrdenadaAsc = [...lista].sort((a,b) => new Date(a.created_at) - new Date(b.created_at));

  vazioEl.style.display = lista.length ? 'none' : 'block';
  vazioEl.textContent = modoAtual === 'novos' ? 'Nenhum pedido ativo no momento.' : 'Nenhum pedido encontrado.';

  listaEl.innerHTML = '';
  let ultimoDia = null;
  const agora = new Date();

  lista.forEach(p => {
    const dia = chaveDia(p.created_at);
    if(dia !== ultimoDia){
      const cab = document.createElement('div');
      cab.className = 'data-cabecalho';
      cab.textContent = formatarDataLonga(p.created_at);
      listaEl.appendChild(cab);
      ultimoDia = dia;
    }

    const minutosParado = (agora - new Date(p.created_at)) / 60000;
    const atrasado = p.status === 'novo' && minutosParado > MINUTOS_ATRASO;
    const valorTextarea = edicoesAtuais[p.id] !== undefined ? edicoesAtuais[p.id] : p.texto_comanda;
    const numero = pedidoNumero(p, listaOrdenadaAsc);
    const nomeCliente = extrairNomeCliente(valorTextarea);

    const div = document.createElement('div');
    div.className = 'pedido status-' + p.status + (atrasado ? ' atrasado' : '');
    div.innerHTML = `
      <div class="pedido-topo">
        <span class="pedido-numero">Pedido #${numero}${nomeCliente ? ' — ' + nomeCliente : ''}${atrasado ? ' ⚠️ parado há ' + Math.round(minutosParado) + ' min' : ''}</span>
        <span class="pedido-hora">${formatarHora(p.created_at)}</span>
      </div>
      <div class="pedido-topo">
        <select class="status-select ${p.status}" onchange="mudarStatus(${p.id}, this.value)">
          ${Object.entries(STATUS_LABELS).map(([v,l]) => `<option value="${v}" ${p.status===v?'selected':''}>${l}</option>`).join('')}
        </select>
        <span class="pedido-total">R$ ${(p.total||0).toFixed(2).replace('.',',')}</span>
      </div>
      <textarea data-id="${p.id}">${valorTextarea}</textarea>

        <button class="acao btn-imprimir" onclick="imprimirPedido(${p.id})">🖨️ Imprimir</button>
        <button class="acao btn-salvar" onclick="salvarEdicao(${p.id})">💾 Salvar texto</button>
        <button class="acao btn-ok" onclick="abrirEditarPedido(${p.id})">✏️ Editar itens</button>
        ${p.status === 'finalizado_pago' ? `<button class="acao btn-ok" onclick="gerarLinkAvaliacao(${p.id})">⭐ Link de avaliação</button>` : ''}
        <button class="acao btn-excluir" onclick="excluirPedido(${p.id})">🗑️ Excluir</button>
      </div>
    `;
    listaEl.appendChild(div);
  });
}

async function carregarPedidosAtivos(){
  const { data, error } = await supabaseClient.from('pedidos').select('*').in('status', STATUS_ATIVOS).order('created_at', { ascending: true });
  if(error){ statusEl.textContent = 'erro ao carregar pedidos'; statusEl.className = 'erro'; console.error(error); return; }
  pedidosAtivos = data || [];
  if(modoAtual === 'novos') renderizar(); else renderizarResumoDia();
}

async function carregarHistorico(){
  const { data, error } = await supabaseClient.from('pedidos').select('*').order('created_at', { ascending: false }).limit(200);
  if(error){ console.error(error); return; }
  pedidosHistorico = data || [];
  document.getElementById('filtro-dia-status').textContent = '';
  document.getElementById('filtro-dia-input').value = '';
  if(modoAtual === 'historico') renderizar();
}

async function buscarHistoricoPorDia(){
  const valor = document.getElementById('filtro-dia-input').value; // formato YYYY-MM-DD
  const statusFiltroEl = document.getElementById('filtro-dia-status');
  if(!valor){ statusFiltroEl.textContent = 'Escolha uma data primeiro.'; return; }
  statusFiltroEl.textContent = 'Buscando...';
  // O dia local (Fortaleza, -03:00) começa e termina nesses instantes em UTC.
  const inicio = `${valor}T00:00:00-03:00`;
  const [ano, mes, dia] = valor.split('-').map(Number);
  const proximoDia = new Date(Date.UTC(ano, mes - 1, dia + 1));
  const fim = `${proximoDia.toISOString().slice(0,10)}T00:00:00-03:00`;
  const { data, error } = await supabaseClient
    .from('pedidos')
    .select('*')
    .gte('created_at', inicio)
    .lt('created_at', fim)
    .order('created_at', { ascending: false });
  if(error){ console.error(error); statusFiltroEl.textContent = 'Erro ao buscar — veja o console.'; return; }
  pedidosHistorico = data || [];
  const [y,m,d] = valor.split('-');
  statusFiltroEl.textContent = `${pedidosHistorico.length} pedido(s) em ${d}/${m}/${y}.`;
  if(modoAtual === 'historico') renderizar();
}

function resetarHistorico(){
  carregarHistorico();
}

function encontrarPedido(id){ return pedidosAtivos.find(p => p.id === id) || pedidosHistorico.find(p => p.id === id); }

async function mudarStatus(id, novoStatus){
  const item = encontrarPedido(id);
  const payload = { status: novoStatus };
  // Marca a hora exata em que o pedido foi impresso e em que foi finalizado —
  // usado no admin pra calcular o tempo médio de preparo. Só marca na primeira
  // vez (não sobrescreve se o status for alternado de um lado pro outro depois).
  if(novoStatus === 'impresso' && item && !item.impresso_em){
    payload.impresso_em = new Date().toISOString();
  }
  if(novoStatus === 'finalizado_pago' && item && !item.finalizado_em){
    payload.finalizado_em = new Date().toISOString();
  }
  const { data, error } = await supabaseClient.from('pedidos').update(payload).eq('id', id).select();
  if(error){
    alert('Não foi possível mudar o status.\n\nErro do Supabase: ' + (error.message || JSON.stringify(error)));
    console.error(error);
    return;
  }
  if(!data || data.length === 0){
    alert('O status NÃO foi alterado (0 linhas afetadas). Tente sair e entrar de novo no painel.');
    console.warn('Update de status retornou 0 linhas.', { id, payload });
    return;
  }
  if(item) Object.assign(item, payload);
  if(!STATUS_ATIVOS.includes(novoStatus)){
    pedidosAtivos = pedidosAtivos.filter(p => p.id !== id);
  }
  renderizar();
  if(pedidosAtivos.filter(p => p.status === 'novo').length === 0) pararAviso();
}

async function salvarEdicao(id){
  const textarea = document.querySelector(`textarea[data-id="${id}"]`);
  if(!textarea) return;

  const payload = { texto_comanda: textarea.value };
  const novoTotal = extrairTotalComanda(textarea.value);
  if(novoTotal !== null) payload.total = novoTotal;

  const { data, error } = await supabaseClient.from('pedidos').update(payload).eq('id', id).select();
  if(error){
    alert('Não foi possível salvar a edição.\n\nErro do Supabase: ' + (error.message || JSON.stringify(error)));
    console.error(error);
    return;
  }
  if(!data || data.length === 0){
    alert('A edição NÃO foi salva (0 linhas afetadas). Tente sair e entrar de novo no painel.');
    console.warn('Update de edição retornou 0 linhas.', { id, payload });
    return;
  }

  const item = encontrarPedido(id);
  if(item){
    item.texto_comanda = textarea.value;
    if(novoTotal !== null) item.total = novoTotal;
  }
  renderizar();
  renderizarResumoDia();
}

async function excluirPedido(id){
  if(!confirm('Excluir esta comanda definitivamente? Não dá pra desfazer.')) return;
  // Importante: pedimos .select() de volta para o Supabase. Sem isso, se a política
  // de RLS da tabela "pedidos" não liberar DELETE para o usuário anônimo, o Supabase
  // responde "sucesso" com 0 linhas afetadas (sem gerar "error"), e a comanda parece
  // sumir da tela mas continua no banco — reaparecendo ao recarregar a página.
  const { data, error } = await supabaseClient.from('pedidos').delete().eq('id', id).select();
  if(error){
    alert('Não foi possível excluir.\n\nErro do Supabase: ' + (error.message || JSON.stringify(error)));
    console.error(error);
    return;
  }
  if(!data || data.length === 0){
    alert('A comanda não foi excluída (0 linhas afetadas).\n\nIsso quase sempre significa que falta uma política de DELETE liberada para o usuário anônimo na tabela "pedidos" no Supabase.\n\nVá em Supabase > Authentication > Policies (ou Database > Policies), na tabela "pedidos", e crie/habilite uma política de DELETE para o role "anon" (ex: USING (true), se não houver necessidade de restringir).');
    console.warn('Delete retornou 0 linhas — provável bloqueio de RLS.', { id });
    return;
  }
  pedidosAtivos = pedidosAtivos.filter(p => p.id !== id);
  pedidosHistorico = pedidosHistorico.filter(p => p.id !== id);
  renderizar();
}

function imprimirTextoBruto(texto){
  const escapado = texto.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const janela = window.open('', '_blank', 'width=400,height=650');
  janela.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Comanda</title>
    <style>
      /* Papel físico da comanda: folha avulsa 8,5 x 21cm. Fixamos o tamanho real da
         página aqui — sem isso, o navegador imprime no tamanho padrão (A4) e o texto
         sai cortado ou desproporcional na impressora. */
      @media print{ @page{ size: 8.5cm 21cm; margin: 4mm; } }
      body{ margin:0; padding:8px; }
      pre{ font-family:'Courier New',monospace; font-size:14px; font-weight:700; line-height:1.42; color:#000; white-space:pre-wrap; word-break:break-word; margin:0 0 14px 0; border-bottom:1px dashed #000; padding-bottom:10px; }
    </style>
    </head><body><pre>${escapado}</pre>
    <script>window.onload=function(){window.focus();window.print();}; window.onafterprint=function(){window.close();};<\/script>
    </body></html>`);
  janela.document.close();
}

function imprimirPedido(id){
  const textarea = document.querySelector(`textarea[data-id="${id}"]`);
  const texto = textarea ? textarea.value : (encontrarPedido(id)||{}).texto_comanda || '';
  imprimirTextoBruto(texto);
  const item = encontrarPedido(id);
  if(item && item.status === 'novo'){ mudarStatus(id, 'impresso'); }
}

function imprimirTodosPendentes(){
  const pendentes = pedidosAtivos.filter(p => p.status === 'novo');
  if(pendentes.length === 0){ alert('Não há pedidos pendentes de impressão.'); return; }
  pendentes.forEach((p, i) => { setTimeout(() => imprimirPedido(p.id), i * 700); });
}

function exportarExcel(){
  const todos = [...pedidosHistorico];
  // garante que os ativos também entrem, mesmo que o histórico não tenha sido aberto ainda
  pedidosAtivos.forEach(p => { if(!todos.some(x => x.id === p.id)) todos.push(p); });
  todos.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

  const linhas = todos.map(p => ({
    'Data': new Date(p.created_at).toLocaleDateString('pt-BR'),
    'Hora': formatarHora(p.created_at),
    'Status': STATUS_LABELS[p.status] || p.status,
    'Total (R$)': p.total || 0,
    'Comanda': p.texto_comanda
  }));
  const ws = XLSX.utils.json_to_sheet(linhas);
  ws['!cols'] = [{wch:12},{wch:8},{wch:20},{wch:12},{wch:60}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Pedidos');
  const dataArquivo = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `pedidos_manels_${dataArquivo}.xlsx`);
}

function iniciar(){
  carregarPedidosAtivos();
  carregarHistorico();
  carregarMenuBuilder();

  setInterval(() => { if(modoAtual === 'novos') carregarPedidosAtivos(); renderizarResumoDia(); }, 20000);
  setInterval(() => { if(modoAtual === 'novos') renderizar(); }, 60000); // atualiza contador de atraso

  supabaseClient
    .channel('pedidos-realtime')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pedidos' }, payload => {
      if(!pedidosAtivos.some(p => p.id === payload.new.id)) pedidosAtivos.push(payload.new);
      if(modoAtual === 'novos') renderizar(); else renderizarResumoDia();
      tocarAviso();
    })
    .subscribe(status => {
      if(status === 'SUBSCRIBED'){ statusEl.textContent = '🟢 conectado — aguardando pedidos'; statusEl.className = 'ok'; }
      else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT'){ statusEl.textContent = '🔴 conexão perdida — recarregue a página'; statusEl.className = 'erro'; }
    });

  // "Libera" o som assim que a pessoa tocar em qualquer lugar da tela pela primeira vez —
  // navegadores bloqueiam áudio automático até haver uma interação do usuário.
  document.addEventListener('click', () => { try{ getAudioCtxAviso(); }catch(e){} }, { once:true });
}

let MENU = { pizzas:{}, calzones:{}, brotinho:{}, esfihas:{}, bebidas:{}, combos:{}, bordas:{} };
let PRODUCT_STOCK = { pizzas:{}, calzones:{}, brotinho:{}, esfihas:{}, bebidas:{}, combos:{}, bordas:{} };
const CATEGORY_DB_TO_MENU = { pizza:'pizzas', calzone:'calzones', brotinho:'brotinho', esfiha:'esfihas', bebida:'bebidas', combo:'combos', borda:'bordas' };
const DISQUETES_PRICE = 1.00;
const MAIONESE_PRICE = 1.00;
const DELIVERY_FEE = 3.00;
const FREE_DELIVERY_THRESHOLD = 15.00;
const ESFIHA_MIN_QTY = 5;
const TAMANHO_LABEL = { M:'Média', G:'Grande', GG:'Família' };

let builderCart = [];
let builderEditingId = null;      // null = pedido novo
let builderOriginalItens = [];    // itens estruturados do pedido antes da edição (pra devolver estoque certo)
let builderNumPedidoOriginal = null;
let builderCreatedAtOriginal = null;

function brlB(v){ return 'R$ ' + (v||0).toFixed(2).replace('.', ','); }

async function carregarMenuBuilder(){
  const { data, error } = await supabaseClient.from('products').select('*').eq('active', true);
  if(error){ console.error('Erro ao carregar produtos para montar pedido:', error); return; }
  const novoMenu = { pizzas:{}, calzones:{}, brotinho:{}, esfihas:{}, bebidas:{}, combos:{}, bordas:{} };
  const novoStock = { pizzas:{}, calzones:{}, brotinho:{}, esfihas:{}, bebidas:{}, combos:{}, bordas:{} };
  (data || []).forEach(p => {
    const key = CATEGORY_DB_TO_MENU[p.category];
    if(!key || !p.name || !p.prices) return;
    const hasPromo = p.promo_active === true && p.promo_prices && Object.keys(p.promo_prices).length > 0;
    const effective = hasPromo ? p.promo_prices : p.prices;
    novoMenu[key][p.name] = (key === 'pizzas') ? effective : (effective.unico ?? 0);
    const stockType = p.stock_type || 'infinito';
    const stockQty = p.stock_qty;
    const zeroBehavior = p.stock_zero_behavior || 'esgotado';
    const esgotado = stockType === 'limitado' && (stockQty === null || stockQty === undefined || stockQty <= 0);
    novoStock[key][p.name] = { id: p.id, infinito: stockType !== 'limitado', qty: stockType === 'limitado' ? (stockQty || 0) : null, esgotado };
  });
  MENU = novoMenu;
  PRODUCT_STOCK = novoStock;
}

function opcoesSelect(obj, stockKey){
  return Object.keys(obj).map(k => {
    const info = stockKey ? PRODUCT_STOCK[stockKey]?.[k] : null;
    const esgotado = info && !info.infinito && info.qty <= 0;
    return `<option value="${k.replace(/"/g,'&quot;')}">${k}${esgotado ? ' — ⚠️ ESGOTADO' : ''}</option>`;
  }).join('');
}

function extrairMetaPedidoComandas(p){
  const texto = p.texto_comanda || '';
  const mCliente = texto.match(/👤 Cliente: (.+)/);
  const mTelefone = texto.match(/📞 Telefone: (.+)/);
  const mEndereco = texto.match(/📍 Endereço: (.+)/);
  const mPagamento = texto.match(/💳 Pagamento: (.+)/);
  const entrega = /RETIRADA NO BALC[ÃA]O/i.test(texto) ? 'retirada' : (/📍 Endereço:/.test(texto) ? 'entrega' : null);
  return {
    cliente: mCliente ? mCliente[1].trim() : '',
    telefone: mTelefone ? mTelefone[1].trim() : '',
    endereco: mEndereco ? mEndereco[1].trim() : '',
    pagamento: mPagamento ? mPagamento[1].trim() : 'Pix',
    entrega
  };
}

function reconstruirCartDeItens(itens){
  return itens.map(item => {
    if(item.categoria === 'pizza'){
      const sabores = item.sabores || [];
      let unit = 0;
      sabores.forEach(f => unit += (MENU.pizzas[f]?.[item.tamanho] || 0));
      unit = sabores.length ? unit / sabores.length : 0;
      if(item.borda) unit += (MENU.bordas[item.borda] || 0);
      const tamanhoLabel = TAMANHO_LABEL[item.tamanho] || item.tamanho || '';
      return { type:'pizza', qty:item.quantidade, size:item.tamanho, flavors:sabores, crust:item.borda||null, unitPrice:unit, lineTotal:item.preco ?? unit*item.quantidade, label:`Pizza ${tamanhoLabel} (${sabores.length} sabor${sabores.length>1?'es':''})`, detail:'' };
    }
    if(item.categoria === 'esfiha'){
      const counts = item.sabores || {};
      return { type:'esfiha', qty:1, comboSize:item.quantidade, counts, unitPrice:item.preco, lineTotal:item.preco, label:`Combo ${item.quantidade} Esfihas`, detail:Object.keys(counts).map(f=>`${counts[f]}x ${f}`).join(', ') };
    }
    if(item.categoria === 'calzone'){
      return { type:'calzone', qty:item.quantidade, flavor:item.sabor, unitPrice:(item.preco||0)/(item.quantidade||1), lineTotal:item.preco, label:`Calzone ${item.sabor}`, detail:'' };
    }
    if(item.categoria === 'brotinho'){
      return { type:'brotinho', qty:item.quantidade, flavor:item.sabor, unitPrice:(item.preco||0)/(item.quantidade||1), lineTotal:item.preco, label:`Brotinho Doce - ${item.sabor}`, detail:'' };
    }
    if(item.categoria === 'bebida'){
      return { type:'bebida', qty:item.quantidade, item:item.nome, unitPrice:(item.preco||0)/(item.quantidade||1), lineTotal:item.preco, label:item.nome, detail:'' };
    }
    if(item.categoria === 'combo'){
      return { type:'combo', qty:item.quantidade, item:item.nome, unitPrice:(item.preco||0)/(item.quantidade||1), lineTotal:item.preco, label:item.nome, detail:'', note:item.observacao||undefined };
    }
    return { type:item.categoria||'outro', qty:item.quantidade||1, label:item.nome||'Item', unitPrice:item.preco||0, lineTotal:item.preco||0, detail:'' };
  });
}

function abrirEditarPedido(id){
  const p = encontrarPedido(id);
  if(!p) return;
  const temItensEstruturados = p.itens && Array.isArray(p.itens) && p.itens.length > 0;
  if(!temItensEstruturados){
    if(!confirm('Esse pedido é antigo e não tem os itens salvos de forma estruturada — não dá pra recarregar o carrinho dele automaticamente. Vai abrir vazio, e você precisa adicionar os itens de novo (o pedido atual só muda quando você clicar em "Salvar Pedido"). Quer continuar?')) return;
  }

  builderEditingId = id;
  builderOriginalItens = temItensEstruturados ? p.itens : [];
  builderCart = temItensEstruturados ? reconstruirCartDeItens(p.itens) : [];
  const numMatch = (p.texto_comanda || '').match(/Pedido #(\d+)/);

  builderCreatedAtOriginal = p.created_at;

  document.querySelector(`input[name="builder-fulfillment"][value="${meta.entrega === 'retirada' ? 'retirada' : 'entrega'}"]`).checked = true;
  document.getElementById('builder-obs').value = '';
  document.getElementById('builder-troco').value = '';
  document.getElementById('builder-ketchup').checked = /🔹 Ketchup/.test(p.texto_comanda || '');
  const mMaionese = (p.texto_comanda || '').match(/Maionese Temperada: (\d+)x/);
  document.getElementById('builder-maionese').value = mMaionese ? mMaionese[1] : 0;

  atualizarBuilderFulfillment();
  atualizarBuilderTroco();
  renderBuilderFormItem();
  renderBuilderCart();
  document.getElementById('builder-overlay').style.display = 'block';
}

        <div class="campo-grupo"><label class="campo-lbl">Quantidade</label><input type="number" id="bd-qtd" value="1" min="1" style="width:55px; padding:6px;"></div>

// ---------- estoque: checagem + confirmação manual do funcionário ----------
function checarEstoqueBuilder(key, nome, qtd){
  const info = PRODUCT_STOCK[key]?.[nome];
  if(!info || info.infinito) return true;
  const tipoMap = { pizzas:'pizza', calzones:'calzone', brotinho:'brotinho', bebidas:'bebida', combos:'combo' };
  let jaNoCarrinho = 0;
  builderCart.forEach(item => {
    if(key === 'pizzas' && item.type === 'pizza') (item.flavors||[]).forEach(f => { if(f===nome) jaNoCarrinho += item.qty; });
    else if(key === 'bordas' && item.type === 'pizza'){ if(item.crust===nome) jaNoCarrinho += item.qty; }
    else if(key === 'esfihas' && item.type === 'esfiha'){ jaNoCarrinho += (item.counts?.[nome]||0); }
    else if(item.type === tipoMap[key]){ if(item.flavor===nome || item.item===nome) jaNoCarrinho += item.qty; }
  });
  return (jaNoCarrinho + qtd) <= info.qty;
}
function confirmarApesarDoEstoque(nome){
  return confirm(`"${nome}" está esgotado ou sem estoque suficiente no cadastro. Adicionar mesmo assim? (o estoque pode ficar negativo)`);
}

// ---------- adicionar cada tipo de item ao carrinho do builder ----------
function adicionarBuilderPizza(){
  const tamanho = document.getElementById('bp-tamanho').value;
  const qtd = parseInt(document.getElementById('bp-qtd').value, 10) || 1;
  const bordaSel = document.getElementById('bp-borda').value;
  const saboresSel = Array.from(document.querySelectorAll('.bp-sabor')).map(s => s.value);
  for(const f of saboresSel){ if(!checarEstoqueBuilder('pizzas', f, qtd) && !confirmarApesarDoEstoque(f)) return; }
  if(bordaSel && !checarEstoqueBuilder('bordas', bordaSel, qtd) && !confirmarApesarDoEstoque(bordaSel)) return;

  let unit = 0;
  saboresSel.forEach(f => unit += (MENU.pizzas[f]?.[tamanho] || 0));
  unit = saboresSel.length ? unit / saboresSel.length : 0;
  if(bordaSel) unit += (MENU.bordas[bordaSel] || 0);

  builderCart.push({
    type:'pizza', qty:qtd, size:tamanho, flavors:saboresSel, crust:bordaSel||null,
    unitPrice:unit, lineTotal:unit*qtd,
    label:`Pizza ${TAMANHO_LABEL[tamanho]} (${saboresSel.length} sabor${saboresSel.length>1?'es':''})`, detail:''
  });
  renderBuilderCart();
}
function adicionarBuilderCalzone(){
  const sabor = document.getElementById('bc-sabor').value;
  const qtd = parseInt(document.getElementById('bc-qtd').value, 10) || 1;
  if(!checarEstoqueBuilder('calzones', sabor, qtd) && !confirmarApesarDoEstoque(sabor)) return;
  const preco = MENU.calzones[sabor] || 0;
  builderCart.push({ type:'calzone', qty:qtd, flavor:sabor, unitPrice:preco, lineTotal:preco*qtd, label:`Calzone ${sabor}`, detail:'' });
  renderBuilderCart();
}
function adicionarBuilderBrotinho(){
  const sabor = document.getElementById('bb-sabor').value;
  const qtd = parseInt(document.getElementById('bb-qtd').value, 10) || 1;
  const disquetes = document.getElementById('bb-disquetes').checked;
  if(!checarEstoqueBuilder('brotinho', sabor, qtd) && !confirmarApesarDoEstoque(sabor)) return;
  const preco = (MENU.brotinho[sabor] || 0) + (disquetes ? DISQUETES_PRICE : 0);
  builderCart.push({ type:'brotinho', qty:qtd, flavor:sabor, unitPrice:preco, lineTotal:preco*qtd, label:`Brotinho Doce - ${sabor}`, detail: disquetes ? 'Complemento: Disquetes' : '' });
  renderBuilderCart();
}
function adicionarBuilderEsfiha(){
  const counts = {};
  document.querySelectorAll('.be-qtd').forEach(inp => {
    const q = parseInt(inp.value, 10) || 0;
    if(q > 0) counts[inp.dataset.sabor] = q;
  });
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  if(total < ESFIHA_MIN_QTY){ alert(`Mínimo de ${ESFIHA_MIN_QTY} esfihas no combo.`); return; }
  for(const f of Object.keys(counts)){ if(!checarEstoqueBuilder('esfihas', f, counts[f]) && !confirmarApesarDoEstoque(f)) return; }
  let preco = 0;
  Object.keys(counts).forEach(f => preco += (MENU.esfihas[f] || 0) * counts[f]);
  const detail = Object.keys(counts).map(f => `${counts[f]}x ${f}`).join(', ');
  builderCart.push({ type:'esfiha', qty:1, comboSize:total, counts, unitPrice:preco, lineTotal:preco, label:`Combo ${total} Esfihas`, detail });
  renderBuilderCart();
}
function adicionarBuilderBebida(){
  const item = document.getElementById('bd-item').value;
  const qtd = parseInt(document.getElementById('bd-qtd').value, 10) || 1;
  if(!checarEstoqueBuilder('bebidas', item, qtd) && !confirmarApesarDoEstoque(item)) return;
  const preco = MENU.bebidas[item] || 0;
  builderCart.push({ type:'bebida', qty:qtd, item, unitPrice:preco, lineTotal:preco*qtd, label:item, detail:'' });
  renderBuilderCart();
}
function adicionarBuilderCombo(){
  const item = document.getElementById('bco-item').value;
  const qtd = parseInt(document.getElementById('bco-qtd').value, 10) || 1;
  const nota = document.getElementById('bco-nota').value.trim();
  if(!checarEstoqueBuilder('combos', item, qtd) && !confirmarApesarDoEstoque(item)) return;
  const preco = MENU.combos[item] || 0;
  builderCart.push({ type:'combo', qty:qtd, item, unitPrice:preco, lineTotal:preco*qtd, label:item, detail:'', note: nota || undefined });
  renderBuilderCart();
}
function removerBuilderItem(idx){
  builderCart.splice(idx, 1);
  renderBuilderCart();
}

// ---------- total e renderização do carrinho ----------
function builderSubtotal(){ return builderCart.reduce((s,i) => s + i.lineTotal, 0); }
function builderFee(){
  const tipo = document.querySelector('input[name="builder-fulfillment"]:checked')?.value;
  if(tipo !== 'entrega') return 0;
  const sub = builderSubtotal();
  return sub > 0 && sub < FREE_DELIVERY_THRESHOLD ? DELIVERY_FEE : 0;
}
function builderExtras(){
  const qtd = parseInt(document.getElementById('builder-maionese')?.value, 10) || 0;
  return Math.max(0, qtd - 1) * MAIONESE_PRICE;
}
function builderTotal(){ return builderSubtotal() + builderFee() + builderExtras(); }

function renderBuilderCart(){
  const lista = document.getElementById('builder-cart-lista');
  const vazio = document.getElementById('builder-cart-vazio');
  if(builderCart.length === 0){
    lista.innerHTML = '';
    vazio.style.display = 'block';
  } else {
    vazio.style.display = 'none';
    lista.innerHTML = builderCart.map((item, idx) => `
      <div style="display:flex; justify-content:space-between; align-items:center; background:#f5f5f5; padding:6px 10px; border-radius:6px; margin-bottom:4px; font-size:.85rem; gap:8px;">
        <span>${item.qty}x ${item.label}${item.detail ? ` — ${item.detail}` : ''}${item.crust ? ` + Borda ${item.crust}` : ''}</span>
        <span style="white-space:nowrap;">${brlB(item.lineTotal)} <button onclick="removerBuilderItem(${idx})" style="margin-left:8px; border:none; background:#c03a3a; color:#fff; border-radius:4px; padding:2px 8px; cursor:pointer;">✕</button></span>
      </div>
    `).join('');
  }
  const totalEl = document.getElementById('builder-total');
  if(totalEl) totalEl.textContent = brlB(builderTotal());
}

// ---------- texto da comanda + itens estruturados ----------
function quebrarTextoB(texto, largura, prefixo){
  const palavras = texto.split(' ');
  let linhas = []; let atual = prefixo;
  palavras.forEach(p => {
    if((atual + p).length > largura){ linhas.push(atual.trimEnd()); atual = prefixo; }
    atual += p + ' ';
  });
  linhas.push(atual.trimEnd());
  return linhas.join('\n');
}

function gerarComandaBuilder(){
  const nome = document.getElementById('builder-nome').value.trim();
  const telefone = document.getElementById('builder-telefone').value.trim();
  const endereco = document.getElementById('builder-endereco').value.trim();
  const obs = document.getElementById('builder-obs').value.trim();
  const troco = document.getElementById('builder-troco').value.trim();
  const pagamento = document.getElementById('builder-pagamento').value;
  const fulfillment = document.querySelector('input[name="builder-fulfillment"]:checked').value;
  const wantKetchup = document.getElementById('builder-ketchup').checked;
  const maioneseQty = parseInt(document.getElementById('builder-maionese').value, 10) || 0;

  const numPedido = builderNumPedidoOriginal || Math.floor(1000 + Math.random()*9000);
  const agora = builderCreatedAtOriginal ? new Date(builderCreatedAtOriginal) : new Date();
  const dataStr = agora.toLocaleDateString('pt-BR');
  const horaStr = agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});

  const subtotal = builderSubtotal();
  const fee = builderFee();
  const extras = builderExtras();
  const total = subtotal + fee + extras;

  const LARG = 32;
  const SEP = '='.repeat(LARG);
  const EMOJI_ITEM = { pizza:'🍕', calzone:'🥟', brotinho:'🍩', esfiha:'🥙', bebida:'🥤', combo:'🍽️' };

  let c = `${SEP}\n`;
  c += `     MANEL'S PIZZARIA\n`;
  c += `     📞 88 9 9218-2784\n`;
  c += `${SEP}\n`;
  c += `🧾 Pedido #${numPedido}\n`;
  c += `📅 ${dataStr}   🕒 ${horaStr}\n`;

  c += `${SEP}\n`;
  c += `*🍕 PARA O PIZZAIOLO*\n`;
  c += `${SEP}\n`;

  builderCart.slice().reverse().forEach(item => {
    const emoji = EMOJI_ITEM[item.type] || '•';
    c += `${emoji} ${item.qty}x ${item.label}\n`;
    if(item.type === 'pizza'){
      item.flavors.forEach((f,i) => { c += quebrarTextoB(`🔸[${i+1}/${item.flavors.length}] ${f}`, LARG, '  ') + '\n'; });
      if(item.crust) c += `🧀 Borda Recheada: ${item.crust}\n`;
    } else if(item.type === 'esfiha'){
      Object.keys(item.counts).filter(f => item.counts[f] > 0).forEach(f => { c += quebrarTextoB(`🔸${item.counts[f]}x ${f}`, LARG, '  ') + '\n'; });
    } else if(item.detail){
      c += quebrarTextoB(`🔸${item.detail}`, LARG, '  ') + '\n';
    }
    if(item.note) c += quebrarTextoB(`📝 Observação: ${item.note}`, LARG, '  ') + '\n';
  });

  if(wantKetchup || maioneseQty > 0){
    if(wantKetchup) c += `🔹 Ketchup\n`;
    if(maioneseQty > 0){
      const custoMaionese = Math.max(0, maioneseQty - 1) * MAIONESE_PRICE;
      c += `🔹 Maionese Temperada: ${maioneseQty}x (1ª grátis${custoMaionese>0?`, + ${brlB(custoMaionese)}`:''})\n`;
    }
  }
  if(obs) c += quebrarTextoB(`❗*OBS:* ${obs}`, LARG, '') + '\n';

  c += `${SEP}\n`;
  c += `*🛵 PARA O MOTOBOY*\n`;
  c += `${SEP}\n`;
  c += `👤 Cliente: ${nome}\n`;
  c += `📞 Telefone: ${telefone}\n`;

  if(fulfillment === 'entrega'){
    c += quebrarTextoB(`📍 Endereço: ${endereco}`, LARG, '') + '\n';
    if(fee > 0) c += `🛵 Taxa de entrega: ${brlB(fee)}\n`;
  } else {
    c += `🏠 *RETIRADA NO BALCÃO*\n`;
  }

  c += `💳 Pagamento: ${pagamento}\n`;
  if(pagamento === 'Dinheiro' && troco){
    const valorPago = parseFloat(troco.replace(/\./g,'').replace(',','.'));
    if(!isNaN(valorPago) && valorPago >= total){
      c += `💵 Pagará com: R$ ${valorPago.toFixed(2).replace('.',',')} → Troco: R$ ${(valorPago-total).toFixed(2).replace('.',',')}\n`;
    }
  }

  c += `${SEP}\n`;
  c += `💰 *TOTAL A COBRAR: ${brlB(total)}*\n`;
  c += `${SEP}\n`;
  c += `   Bom apetite! 🍕🔥\n`;
  c += SEP;

  return { texto: c, total };
}

function construirItensEstruturadosBuilder(){
  return builderCart.map(item => {
    if(item.type === 'pizza') return { categoria:'pizza', nome:'Pizza', sabores:item.flavors, tamanho:item.size||null, borda:item.crust||null, quantidade:item.qty, preco:item.lineTotal };
    if(item.type === 'esfiha') return { categoria:'esfiha', nome:'Combo de Esfihas', sabores:item.counts, quantidade:item.comboSize, preco:item.lineTotal };
    if(item.type === 'calzone') return { categoria:'calzone', nome:'Calzone', sabor:item.flavor, quantidade:item.qty, preco:item.lineTotal };
    if(item.type === 'brotinho') return { categoria:'brotinho', nome:'Brotinho Doce', sabor:item.flavor, quantidade:item.qty, preco:item.lineTotal };
    if(item.type === 'bebida') return { categoria:'bebida', nome:item.item, quantidade:item.qty, preco:item.lineTotal };
    if(item.type === 'combo') return { categoria:'combo', nome:item.item, quantidade:item.qty, preco:item.lineTotal, observacao:item.note||'' };
    return { categoria:item.type||'outro', nome:item.label||'Item', quantidade:item.qty||1, preco:item.lineTotal||0 };
  });
}

// ---------- estoque: aplica desconto/devolução de verdade no Supabase ----------
function extrairBaixasDeItens(itens){
  const baixas = [];
  const add = (key, nome, qty) => { const info = PRODUCT_STOCK[key]?.[nome]; if(info && !info.infinito && info.id) baixas.push({ id: info.id, qty }); };
  (itens || []).forEach(item => {
    if(item.categoria === 'pizza'){
      (item.sabores||[]).forEach(f => add('pizzas', f, item.quantidade));
      if(item.borda) add('bordas', item.borda, item.quantidade);
    } else if(item.categoria === 'esfiha'){
      Object.keys(item.sabores||{}).forEach(f => { if(item.sabores[f]>0) add('esfihas', f, item.sabores[f]); });
    } else if(item.categoria === 'calzone'){
      add('calzones', item.sabor, item.quantidade);
    } else if(item.categoria === 'brotinho'){
      add('brotinho', item.sabor, item.quantidade);
    } else if(item.categoria === 'bebida'){
      add('bebidas', item.nome, item.quantidade);
    } else if(item.categoria === 'combo'){
      add('combos', item.nome, item.quantidade);
    }
  });
  return baixas;
}
async function aplicarDeltaEstoque(idsQtds, sinal){
  for(const { id, qty } of idsQtds){
    try{
      const { data } = await supabaseClient.from('products').select('stock_qty').eq('id', id).single();
      if(!data) continue;
      const novoValor = Math.max(0, (data.stock_qty || 0) + sinal*qty);
      await supabaseClient.from('products').update({ stock_qty: novoValor }).eq('id', id);
    } catch(e){ console.error('Falha ao ajustar estoque:', e); }
  }
}

// ---------- salvar (criar ou editar) ----------
async function salvarBuilder(){
  if(builderCart.length === 0){ alert('Adicione pelo menos um item ao pedido.'); return; }
  if(!document.getElementById('builder-nome').value.trim()){ alert('Informe o nome do cliente.'); return; }
  const fulfillment = document.querySelector('input[name="builder-fulfillment"]:checked').value;
  if(fulfillment === 'entrega' && !document.getElementById('builder-endereco').value.trim()){ alert('Informe o endereço para entrega.'); return; }

  const botao = document.querySelector('#builder-modal .btn-salvar');
  if(botao){ botao.disabled = true; botao.textContent = 'Salvando...'; }

  const novosItens = construirItensEstruturadosBuilder();
  const { texto, total } = gerarComandaBuilder();
  const baixasNovas = extrairBaixasDeItens(novosItens);
  const baixasAntigas = extrairBaixasDeItens(builderOriginalItens);

  try{
    if(builderEditingId){
      const { data, error } = await supabaseClient.from('pedidos').update({ itens: novosItens, texto_comanda: texto, total }).eq('id', builderEditingId).select();
      if(error) throw error;
      if(!data || data.length === 0) throw new Error('0 linhas afetadas — provável perda de sessão ou permissão insuficiente. Tente sair e entrar de novo no painel.');
      // Atualiza a caixa de texto na tela ANTES de recarregar — se não fizer isso, o
      // sistema que preserva digitação em andamento acaba recapturando o texto
      // antigo que ainda estava ali e sobrescrevendo o texto novo que acabamos de salvar.
      const textareaAtual = document.querySelector(`textarea[data-id="${builderEditingId}"]`);
      if(textareaAtual) textareaAtual.value = texto;
      // Devolve tudo que o pedido tinha antes e desconta tudo que ele tem agora —
      // mais simples e seguro que calcular só a diferença, e dá no mesmo resultado.
      await aplicarDeltaEstoque(baixasAntigas, +1);
      await aplicarDeltaEstoque(baixasNovas, -1);
    } else {
      const { error } = await supabaseClient.from('pedidos').insert({ status:'novo', total, texto_comanda: texto, itens: novosItens });
      if(error) throw error;
      await aplicarDeltaEstoque(baixasNovas, -1);
    }
  } catch(e){
    alert('Não foi possível salvar o pedido.\n\nErro: ' + (e.message || JSON.stringify(e)));
    if(botao){ botao.disabled = false; botao.textContent = '💾 Salvar Pedido'; }
    return;
  }

  fecharBuilder();
  await carregarMenuBuilder();
  await carregarPedidosAtivos();
  await carregarHistorico();
  if(botao){ botao.disabled = false; botao.textContent = '💾 Salvar Pedido'; }
}

/* ==================== LINK DE AVALIAÇÃO (com pontos) ==================== */
function gerarTokenAvaliacao(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, '');
  return Array.from({length:32}, () => Math.floor(Math.random()*16).toString(16)).join('');
}

async function gerarLinkAvaliacao(pedidoId){
  const token = gerarTokenAvaliacao();
  const expiraEm = new Date(Date.now() + 3*60*60*1000); // 3 horas de validade
  const { error } = await supabaseClient.from('links_avaliacao').insert({
    pedido_id: pedidoId, token, expira_em: expiraEm.toISOString(), usado: false
  });
  if(error){
    alert('Não foi possível gerar o link de avaliação.\n\nErro: ' + (error.message || JSON.stringify(error)) +
      '\n\nVerifique se a tabela "links_avaliacao" existe no Supabase — veja as instruções que te passei.');
    console.error(error);
    return;
  }
  const url = `https://manelspizzaria.com.br/avaliar.html?token=${token}`;
  try{
    await navigator.clipboard.writeText(url);
    alert('✅ Link copiado!\n\nCole no WhatsApp do cliente. Ele vale por 3 horas:\n\n' + url);
  } catch(e){
    prompt('Copie o link abaixo e cole no WhatsApp do cliente (vale por 3 horas):', url);
  }
}
