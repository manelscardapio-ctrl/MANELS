<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Produtos — Manel's Pizzaria</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --dark-green:#2d4a3a; --terracotta:#c0622f; --beige:#f5e6d3; --red:#c0392b; --green-ok:#3a7d4a; }
  *{box-sizing:border-box;}
  body{ font-family:'Courier New', monospace; background:var(--dark-green); color:var(--beige); margin:0; padding:20px; min-height:100vh; }

  #tela-senha{ position:fixed; inset:0; background:var(--dark-green); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:999; }
  #tela-senha input{ font-family:inherit; font-size:1rem; padding:10px 14px; border-radius:6px; border:none; width:220px; text-align:center; }
  #tela-senha button{ font-family:inherit; font-size:.9rem; padding:10px 20px; border:none; border-radius:6px; background:var(--terracotta); color:#fff; font-weight:bold; cursor:pointer; }
  #tela-senha .erro-senha{ color:#f7b0a0; font-size:.85rem; min-height:1em; }

  header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding-bottom:14px; border-bottom:2px solid var(--terracotta); flex-wrap:wrap; gap:10px; }
  h1{ margin:0; font-size:1.3rem; }
  #status{ font-size:.8rem; padding:6px 12px; border-radius:20px; background:rgba(255,255,255,.1); }
  #status.ok{ color:#8fd19e; } #status.erro{ color:#e88; }

  .aviso-config{ background:rgba(224,90,58,.18); border:1px solid #e05a3a; border-radius:8px; padding:12px 14px; margin-bottom:16px; font-size:.82rem; line-height:1.5; display:none; }
  .aviso-config.show{ display:block; }

  .tabs{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tab{ font-family:inherit; font-size:.85rem; padding:8px 16px; border:none; border-radius:20px; cursor:pointer; font-weight:bold; background:rgba(255,255,255,.12); color:var(--beige); }
  .tab.active{ background:var(--terracotta); color:#fff; }

  .categoria{ display:none; }
  .categoria.active{ display:block; }

  .grade{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px; margin-bottom:18px; }

  .produto{ background:#fff; color:#222; border-radius:10px; padding:14px; box-shadow:0 3px 10px rgba(0,0,0,.25); display:flex; flex-direction:column; gap:8px; }
  .produto.inativo{ opacity:.55; }
  .produto .foto-wrap{ position:relative; width:100%; height:140px; border-radius:8px; overflow:hidden; background:#eee; cursor:pointer; }
  .produto .foto-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .produto .foto-wrap .foto-vazia{ display:flex; align-items:center; justify-content:center; height:100%; color:#999; font-size:.75rem; text-align:center; padding:8px; }
  .produto .foto-wrap .foto-overlay{ position:absolute; inset:0; background:rgba(0,0,0,.45); color:#fff; display:flex; align-items:center; justify-content:center; font-size:.75rem; opacity:0; transition:opacity .15s; }
  .produto .foto-wrap:hover .foto-overlay{ opacity:1; }
  .produto input[type=file]{ display:none; }

  .campo{ display:flex; flex-direction:column; gap:3px; }
  .campo label{ font-size:.68rem; text-transform:uppercase; opacity:.7; font-weight:bold; }
  .campo input[type=text], .campo input[type=number], .campo textarea{ font-family:inherit; font-size:.85rem; padding:7px 9px; border-radius:6px; border:1px solid #ccc; width:100%; }
  .campo textarea{ resize:vertical; min-height:50px; }

  .linha-precos{ display:flex; gap:6px; }
  .linha-precos .campo{ flex:1; }

  .campo-toggle{ display:flex; align-items:center; gap:8px; font-size:.82rem; }
  .campo-toggle input{ width:16px; height:16px; }

  details.promo{ border:1px dashed #ccc; border-radius:6px; padding:8px; }
  details.promo summary{ font-size:.78rem; font-weight:bold; cursor:pointer; color:var(--terracotta); }
  details.promo .conteudo-promo{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }

  .acoes-produto{ display:flex; gap:6px; margin-top:4px; }
  .acoes-produto button{ flex:1; font-family:inherit; font-size:.78rem; padding:8px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; }
  .btn-salvar{ background:var(--green-ok); color:#fff; }
  .btn-excluir{ background:var(--red); color:#fff; }
  .salvo-ok{ font-size:.72rem; color:var(--green-ok); text-align:center; min-height:1em; }

  .stat-filtro-btn{ font-family:inherit; font-size:.8rem; padding:7px 12px; border:1px solid rgba(255,255,255,.3); border-radius:999px; background:transparent; color:#fff; cursor:pointer; }
  .stat-filtro-btn.active{ background:var(--terracotta); border-color:var(--terracotta); font-weight:bold; }
  .stat-card{ background:rgba(255,255,255,.08); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:4px; }
  .stat-card .stat-label{ font-size:.72rem; opacity:.8; }
  .stat-card .stat-value{ font-size:1.3rem; font-weight:bold; }

  .card-novo{ background:rgba(255,255,255,.08); border:2px dashed rgba(255,255,255,.35); border-radius:10px; padding:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; min-height:120px; font-size:.9rem; font-weight:bold; text-align:center; }
  .card-novo:hover{ background:rgba(255,255,255,.14); }
</style>
</head>
<body>

<div id="tela-senha">
  <h1>🍕 Gestão de Produtos</h1>
  <input type="password" id="input-senha" placeholder="Senha do painel" autofocus>
  <button onclick="conferirSenha()">Entrar</button>
  <div class="erro-senha" id="erro-senha"></div>
</div>

<div id="conteudo" style="display:none;">
  <header>
    <h1>🍕 Gestão de Produtos — Manel's</h1>
    <div id="status">conectando…</div>
  </header>

  <div class="aviso-config" id="aviso-config"></div>

  <div class="tabs" id="tabs"></div>

  <div id="categorias"></div>
</div>

<script>
const SENHA_PAINEL = "manel2026";

function conferirSenha(){
  const valor = document.getElementById('input-senha').value;
  if(valor === SENHA_PAINEL){
    document.getElementById('tela-senha').style.display = 'none';
    document.getElementById('conteudo').style.display = 'block';
    iniciar();
  } else {
    document.getElementById('erro-senha').textContent = 'Senha incorreta.';
  }
}
document.getElementById('input-senha').addEventListener('keydown', e => { if(e.key === 'Enter') conferirSenha(); });

// Mesmo projeto Supabase que o cardápio (index.html) usa para carregar os produtos.
// Mesmo projeto Supabase que o pedidos (comandas.html) usa — o projeto antigo
// de produtos (qhdxiojewiveazfozpix) não está mais acessível, então unificamos tudo aqui.
const SUPABASE_URL = "https://wzmiqubfzlmglimmtkoz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ockSNlwXiqu24_AaNX6tYQ_lQPQSv_7";
const STORAGE_BUCKET = "produtos"; // precisa existir como bucket PÚBLICO no Supabase

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATEGORIAS = [
  { key:'combo',    label:'Promoções' },
  { key:'pizza',    label:'Pizzas' },
  { key:'calzone',  label:'Calzones' },
  { key:'brotinho', label:'Brotinho' },
  { key:'esfiha',   label:'Esfihas' },
  { key:'bebida',   label:'Bebidas' },
  { key:'borda',    label:'Bordas Recheadas' },
  { key:'config',   label:'⚙️ Configurações' },
  { key:'stats',    label:'📊 Estatísticas' },
];

let produtos = []; // todos os produtos, de todas as categorias
let categoriaAtiva = 'combo';
let horarios = []; // linhas da tabela horario_funcionamento
let configGeral = { tempo_espera_ativo:false, tempo_espera_texto:'' };
const DIAS_SEMANA = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

function setStatus(texto, tipo){
  const el = document.getElementById('status');
  el.textContent = texto;
  el.className = tipo || '';
}

function mostrarAvisoConfig(msg){
  const el = document.getElementById('aviso-config');
  el.innerHTML = msg;
  el.classList.add('show');
}

async function iniciar(){
  renderTabs();
  await Promise.all([carregarProdutos(), carregarConfiguracoes()]);
}

async function carregarConfiguracoes(){
  try{
    const [{ data: h, error: eh }, { data: c, error: ec }] = await Promise.all([
      supabaseClient.from('horario_funcionamento').select('*').order('dia_semana'),
      supabaseClient.from('config_geral').select('*').eq('id', 1).maybeSingle()
    ]);
    if(eh) throw eh;
    horarios = h || [];
    if(!ec && c) configGeral = c;
  } catch(err){
    console.error('Erro ao carregar configurações:', err);
  }
  renderConfiguracoes();
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = CATEGORIAS.map(c =>
    `<button class="tab ${c.key===categoriaAtiva?'active':''}" onclick="mudarCategoria('${c.key}')">${c.label}</button>`
  ).join('');
}

function mudarCategoria(key){
  categoriaAtiva = key;
  renderTabs();
  document.querySelectorAll('.categoria').forEach(el => el.classList.toggle('active', el.dataset.categoria === key));
}

async function carregarProdutos(){
  setStatus('carregando…');
  try{
    const { data, error } = await supabaseClient.from('products').select('*').order('category').order('sort_order');
    if(error) throw error;
    produtos = data || [];
    setStatus(`${produtos.length} produtos · conectado`, 'ok');
    renderCategorias();
  } catch(err){
    console.error(err);
    setStatus('erro de conexão', 'erro');
    mostrarAvisoConfig(`
      <b>⚠️ Não consegui carregar os produtos.</b><br>
      Isso normalmente acontece por falta de permissão no Supabase. Verifique:<br>
      1. A tabela <b>products</b> existe no projeto <code>wzmiqubfzlmglimmtkoz</code>?<br>
      2. Em <b>Authentication → Policies</b>, a tabela <b>products</b> tem uma política de <b>SELECT</b> liberada pro role <b>anon</b>?<br><br>
      Erro técnico: <code>${(err && err.message) ? err.message : JSON.stringify(err)}</code>
    `);
  }
}

function renderCategorias(){
  const box = document.getElementById('categorias');
  box.innerHTML = CATEGORIAS.map(c => `
    <div class="categoria ${c.key===categoriaAtiva?'active':''}" data-categoria="${c.key}">
      ${c.key === 'config' ? '<div id="config-config"></div>' : c.key === 'stats' ? '<div id="config-stats"></div>' : `<div class="grade" id="grade-${c.key}"></div>`}
    </div>
  `).join('');

  CATEGORIAS.forEach(c => { if(c.key !== 'config' && c.key !== 'stats') renderGrade(c.key); });
  renderConfiguracoes();
  renderEstatisticas();
}

function renderGrade(catKey){
  const grade = document.getElementById(`grade-${catKey}`);
  const itens = produtos.filter(p => p.category === catKey);
  const isPizza = catKey === 'pizza';
  const isCombo = catKey === 'combo';

  grade.innerHTML = itens.map(p => cardProdutoHTML(p, isPizza, isCombo)).join('')
    + `<div class="card-novo" onclick="adicionarProduto('${catKey}')">➕<br>Adicionar ${CATEGORIAS.find(c=>c.key===catKey).label.replace(/s$/,'')}</div>`;
}

function precoUnico(p){
  return (p.prices && p.prices.unico !== undefined) ? p.prices.unico : '';
}
function precoPizza(p, tam){
  return (p.prices && p.prices[tam] !== undefined) ? p.prices[tam] : '';
}
function promoUnico(p){
  return (p.promo_prices && p.promo_prices.unico !== undefined) ? p.promo_prices.unico : '';
}
function promoPizza(p, tam){
  return (p.promo_prices && p.promo_prices[tam] !== undefined) ? p.promo_prices[tam] : '';
}

function cardProdutoHTML(p, isPizza, isCombo){
  const precosHTML = isPizza ? `
    <div class="linha-precos">
      <div class="campo"><label>M</label><input type="number" step="0.01" id="preco-M-${p.id}" value="${precoPizza(p,'M')}"></div>
      <div class="campo"><label>G</label><input type="number" step="0.01" id="preco-G-${p.id}" value="${precoPizza(p,'G')}"></div>
      <div class="campo"><label>GG</label><input type="number" step="0.01" id="preco-GG-${p.id}" value="${precoPizza(p,'GG')}"></div>
    </div>
  ` : `
    <div class="campo"><label>Preço (R$)</label><input type="number" step="0.01" id="preco-unico-${p.id}" value="${precoUnico(p)}"></div>
  `;

  const promoPrecosHTML = isPizza ? `
    <div class="linha-precos">
      <div class="campo"><label>M</label><input type="number" step="0.01" id="promo-M-${p.id}" value="${promoPizza(p,'M')}"></div>
      <div class="campo"><label>G</label><input type="number" step="0.01" id="promo-G-${p.id}" value="${promoPizza(p,'G')}"></div>
      <div class="campo"><label>GG</label><input type="number" step="0.01" id="promo-GG-${p.id}" value="${promoPizza(p,'GG')}"></div>
    </div>
  ` : `
    <div class="campo"><label>Preço promocional (R$)</label><input type="number" step="0.01" id="promo-unico-${p.id}" value="${promoUnico(p)}"></div>
  `;

  const observacaoHTML = isCombo ? `
    <div class="campo-toggle">
      <input type="checkbox" id="precisa-nota-${p.id}" ${p.needs_note?'checked':''}>
      <label for="precisa-nota-${p.id}" style="text-transform:none; font-weight:normal;">Pedir observação do cliente (ex: sabor da pizza, sabor do refrigerante)</label>
    </div>
    <div class="campo"><label>Dica mostrada pro cliente</label><input type="text" id="nota-dica-${p.id}" value="${(p.note_hint||'').replace(/"/g,'&quot;')}" placeholder="Ex: Escolha 2 sabores de brotinho"></div>
  ` : '';

  return `
    <div class="produto ${p.active===false?'inativo':''}" id="card-${p.id}">
      <input type="file" id="arquivo-foto-${p.id}" accept="image/*" onchange="uploadFoto(${p.id}, this)">
      <div class="foto-wrap" onclick="document.getElementById('arquivo-foto-${p.id}').click()">
        ${p.image_url ? `<img src="${p.image_url}" id="img-${p.id}">` : `<div class="foto-vazia" id="img-${p.id}">Sem foto —<br>toque pra enviar</div>`}
        <div class="foto-overlay">📷 Trocar foto</div>
      </div>

      <div class="campo"><label>Nome</label><input type="text" id="nome-${p.id}" value="${(p.name||'').replace(/"/g,'&quot;')}"></div>

      ${precosHTML}

      <div class="campo"><label>Descrição / Características</label><textarea id="desc-${p.id}">${p.description||''}</textarea></div>

      ${observacaoHTML}

      <div class="campo-toggle">
        <input type="checkbox" id="ativo-${p.id}" ${p.active!==false?'checked':''}>
        <label for="ativo-${p.id}" style="text-transform:none; font-weight:normal;">Em estoque / visível pro cliente</label>
      </div>

      <div class="campo" style="border:1px dashed #ccc; border-radius:6px; padding:8px;">
        <label>Controle de quantidade</label>
        <select id="estoque-tipo-${p.id}" onchange="alternarCampoEstoque(${p.id})">
          <option value="infinito" ${(p.stock_type||'infinito')==='infinito'?'selected':''}>Estoque infinito</option>
          <option value="limitado" ${p.stock_type==='limitado'?'selected':''}>Estoque limitado</option>
        </select>
        <div id="estoque-detalhe-${p.id}" style="display:${p.stock_type==='limitado'?'flex':'none'}; flex-direction:column; gap:6px; margin-top:6px;">
          <div class="campo"><label>Quantidade em estoque</label><input type="number" min="0" id="estoque-qtd-${p.id}" value="${p.stock_qty!==null && p.stock_qty!==undefined ? p.stock_qty : 0}"></div>
          <div class="campo">
            <label>Quando chegar a zero</label>
            <select id="estoque-zero-${p.id}">
              <option value="esgotado" ${(p.stock_zero_behavior||'esgotado')==='esgotado'?'selected':''}>Mostrar como Esgotado no cardápio</option>
              <option value="esconder" ${p.stock_zero_behavior==='esconder'?'selected':''}>Esconder do cardápio</option>
            </select>
          </div>
        </div>
      </div>

      <div class="campo"><label>Ordem no cardápio</label><input type="number" id="ordem-${p.id}" value="${p.sort_order!==null && p.sort_order!==undefined ? p.sort_order : ''}" style="max-width:90px;"></div>

      <details class="promo">
        <summary>🏷️ Preço promocional (opcional)</summary>
        <div class="conteudo-promo">
          <div class="campo-toggle">
            <input type="checkbox" id="promo-ativa-${p.id}" ${p.promo_active?'checked':''}>
            <label for="promo-ativa-${p.id}" style="text-transform:none; font-weight:normal;">Preço promocional ativo</label>
          </div>
          ${promoPrecosHTML}
          <div class="campo"><label>Selo da promoção</label><input type="text" id="promo-label-${p.id}" value="${(p.promo_label||'').replace(/"/g,'&quot;')}" placeholder="Ex: PROMOÇÃO"></div>
        </div>
      </details>

      <div class="acoes-produto">
        <button class="btn-salvar" onclick="salvarProduto(${p.id})">💾 Salvar</button>
        <button class="btn-excluir" onclick="excluirProduto(${p.id})">🗑️ Excluir</button>
      </div>
      <div class="salvo-ok" id="salvo-${p.id}"></div>
    </div>
  `;
}

function alternarCampoEstoque(id){
  const tipo = document.getElementById(`estoque-tipo-${id}`).value;
  document.getElementById(`estoque-detalhe-${id}`).style.display = tipo === 'limitado' ? 'flex' : 'none';
}

function montarPrecos(id, isPizza){
  if(isPizza){
    const m = parseFloat(document.getElementById(`preco-M-${id}`).value);
    const g = parseFloat(document.getElementById(`preco-G-${id}`).value);
    const gg = parseFloat(document.getElementById(`preco-GG-${id}`).value);
    const obj = {};
    if(!isNaN(m)) obj.M = m;
    if(!isNaN(g)) obj.G = g;
    if(!isNaN(gg)) obj.GG = gg;
    return obj;
  } else {
    const v = parseFloat(document.getElementById(`preco-unico-${id}`).value);
    return isNaN(v) ? {} : { unico: v };
  }
}

function montarPromoPrecos(id, isPizza){
  if(isPizza){
    const m = parseFloat(document.getElementById(`promo-M-${id}`).value);
    const g = parseFloat(document.getElementById(`promo-G-${id}`).value);
    const gg = parseFloat(document.getElementById(`promo-GG-${id}`).value);
    const obj = {};
    if(!isNaN(m)) obj.M = m;
    if(!isNaN(g)) obj.G = g;
    if(!isNaN(gg)) obj.GG = gg;
    return obj;
  } else {
    const v = parseFloat(document.getElementById(`promo-unico-${id}`).value);
    return isNaN(v) ? {} : { unico: v };
  }
}

async function salvarProduto(id){
  const p = produtos.find(x => x.id === id);
  if(!p) return;
  const isPizza = p.category === 'pizza';
  const isCombo = p.category === 'combo';

  const ordemVal = document.getElementById(`ordem-${id}`).value;
  const payload = {
    name: document.getElementById(`nome-${id}`).value.trim(),
    prices: montarPrecos(id, isPizza),
    description: document.getElementById(`desc-${id}`).value.trim(),
    active: document.getElementById(`ativo-${id}`).checked,
    sort_order: ordemVal === '' ? null : parseInt(ordemVal, 10),
    promo_active: document.getElementById(`promo-ativa-${id}`).checked,
    promo_prices: montarPromoPrecos(id, isPizza),
    promo_label: document.getElementById(`promo-label-${id}`).value.trim(),
    stock_type: document.getElementById(`estoque-tipo-${id}`).value,
    stock_qty: document.getElementById(`estoque-tipo-${id}`).value === 'limitado'
      ? (parseInt(document.getElementById(`estoque-qtd-${id}`).value, 10) || 0)
      : null,
    stock_zero_behavior: document.getElementById(`estoque-zero-${id}`) ? document.getElementById(`estoque-zero-${id}`).value : 'esgotado',
  };
  if(isCombo){
    payload.needs_note = document.getElementById(`precisa-nota-${id}`).checked;
    payload.note_hint = document.getElementById(`nota-dica-${id}`).value.trim();
  }

  const { error } = await supabaseClient.from('products').update(payload).eq('id', id);
  const aviso = document.getElementById(`salvo-${id}`);
  if(error){
    alert('Não foi possível salvar.\n\nErro do Supabase: ' + (error.message || JSON.stringify(error)) +
      '\n\nVerifique se a tabela "products" tem uma política de UPDATE liberada pro role anon no Supabase.' +
      (error.message && error.message.includes('needs_note') ? '\n\nParece que faltam as colunas "needs_note" e "note_hint" na tabela products — veja as instruções que te passei.' : '') +
      (error.message && error.message.includes('stock_') ? '\n\nParece que faltam as colunas de estoque (stock_type, stock_qty, stock_zero_behavior) na tabela products — rode o SQL de estoque que te passei.' : ''));
    console.error(error);
    return;
  }
  Object.assign(p, payload);
  aviso.textContent = '✅ Salvo!';
  document.getElementById(`card-${id}`).classList.toggle('inativo', !payload.active);
  setTimeout(() => { aviso.textContent = ''; }, 2000);
}

async function excluirProduto(id){
  const p = produtos.find(x => x.id === id);
  if(!p) return;
  if(!confirm(`Excluir "${p.name}" definitivamente? Não dá pra desfazer.`)) return;

  const { data, error } = await supabaseClient.from('products').delete().eq('id', id).select();
  if(error){
    alert('Não foi possível excluir.\n\nErro do Supabase: ' + (error.message || JSON.stringify(error)));
    console.error(error);
    return;
  }
  if(!data || data.length === 0){
    alert('A exclusão não teve efeito (0 linhas afetadas).\n\nIsso normalmente indica que falta uma política de DELETE liberada pro role anon na tabela "products" no Supabase.');
    return;
  }
  produtos = produtos.filter(x => x.id !== id);
  renderGrade(p.category);
}

async function adicionarProduto(catKey){
  const nome = prompt('Nome do novo item:');
  if(!nome || !nome.trim()) return;

  const payload = {
    category: catKey,
    name: nome.trim(),
    prices: catKey === 'pizza' ? { M:0, G:0, GG:0 } : { unico:0 },
    description: '',
    active: true,
    sort_order: 999,
    promo_active: false,
    promo_prices: {},
    promo_label: '',
  };
  if(catKey === 'combo'){
    payload.needs_note = false;
    payload.note_hint = '';
  }

  const { data, error } = await supabaseClient.from('products').insert(payload).select();
  if(error){
    alert('Não foi possível criar o produto.\n\nErro do Supabase: ' + (error.message || JSON.stringify(error)) +
      '\n\nVerifique se a tabela "products" tem uma política de INSERT liberada pro role anon no Supabase.' +
      (error.message && error.message.includes('needs_note') ? '\n\nParece que faltam as colunas "needs_note" e "note_hint" na tabela products — veja as instruções que te passei.' : ''));
    console.error(error);
    return;
  }
  produtos.push(data[0]);
  renderGrade(catKey);
}

async function uploadFoto(id, inputEl){
  const arquivo = inputEl.files[0];
  if(!arquivo) return;
  const p = produtos.find(x => x.id === id);
  if(!p) return;

  const imgEl = document.getElementById(`img-${id}`);
  const textoOriginal = imgEl.outerHTML;
  imgEl.outerHTML = `<div class="foto-vazia" id="img-${id}">Enviando…</div>`;

  const caminho = `${p.category}/${Date.now()}-${arquivo.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  const { error: erroUpload } = await supabaseClient.storage.from(STORAGE_BUCKET).upload(caminho, arquivo, { upsert:true });
  if(erroUpload){
    alert('Não foi possível enviar a foto.\n\nErro do Supabase: ' + (erroUpload.message || JSON.stringify(erroUpload)) +
      `\n\nVerifique se existe um bucket PÚBLICO chamado "${STORAGE_BUCKET}" no Storage do Supabase.`);
    console.error(erroUpload);
    document.getElementById(`img-${id}`).outerHTML = textoOriginal;
    return;
  }

  const { data: publicData } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(caminho);
  const url = publicData.publicUrl;

  const { error: erroUpdate } = await supabaseClient.from('products').update({ image_url: url }).eq('id', id);
  if(erroUpdate){
    alert('A foto foi enviada, mas não consegui salvar o link no produto.\n\nErro: ' + (erroUpdate.message || JSON.stringify(erroUpdate)));
    console.error(erroUpdate);
    return;
  }

  p.image_url = url;
  document.getElementById(`img-${id}`).outerHTML = `<img src="${url}" id="img-${id}">`;
}

/* ==================== CONFIGURAÇÕES (horário + aviso de espera) ==================== */

  return horarios.find(h => h.dia_semana === dia) || { dia_semana: dia, hora_abertura:null, hora_fechamento:null, fechado:true };
}

    const fechamento = (h.hora_fechamento || '').slice(0,5);

      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:rgba(255,255,255,.06); padding:8px 10px; border-radius:6px; margin-bottom:6px; font-size:.85rem;">
        <span style="min-width:110px;">${nome}</span>
        <label style="display:flex; align-items:center; gap:5px; font-weight:normal; text-transform:none;">
          <input type="checkbox" id="hor-fechado-${dia}" ${h.fechado?'checked':''} onchange="alternarDiaFechado(${dia})">
          Fechado o dia todo
        </label>
        <input type="time" id="hor-abre-${dia}" value="${abertura}" ${h.fechado?'disabled':''} style="width:110px;">
        <span>até</span>
        <input type="time" id="hor-fecha-${dia}" value="${fechamento}" ${h.fechado?'disabled':''} style="width:110px;">
      </div>
    `;
  }).join('');

  el.innerHTML = `
    <div style="max-width:640px;">
      <h3 style="margin-top:0;">🕒 Horário de Funcionamento</h3>
      <p style="font-size:.8rem; opacity:.8;">Fora desse horário, o cardápio continua acessível pro cliente, mas o pedido é marcado como "encomenda antecipada" (aviso de pagamento adiantado/sinal de 50%).</p>
      ${linhasHorario}
      <button class="btn-salvar" style="margin-top:8px; max-width:220px;" onclick="salvarHorarios()">💾 Salvar Horários</button>
      <div class="salvo-ok" id="salvo-horarios"></div>

      <h3 style="margin-top:28px;">⏱️ Aviso de Tempo de Espera</h3>
      <div class="campo-toggle">
        <input type="checkbox" id="espera-ativo" ${configGeral.tempo_espera_ativo?'checked':''}>
        <label for="espera-ativo" style="text-transform:none; font-weight:normal;">Mostrar aviso no topo do cardápio</label>
      </div>
      <div class="campo" style="margin-top:6px;"><label>Texto do aviso</label><input type="text" id="espera-texto" value="${(configGeral.tempo_espera_texto||'').replace(/"/g,'&quot;')}" placeholder="Ex: Tempo estimado hoje: 40-60 min"></div>
      <button class="btn-salvar" style="margin-top:8px; max-width:220px;" onclick="salvarAvisoEspera()">💾 Salvar Aviso</button>

  `;

function alternarDiaFechado(dia){
  const fechado = document.getElementById(`hor-fechado-${dia}`).checked;
  document.getElementById(`hor-abre-${dia}`).disabled = fechado;
  document.getElementById(`hor-fecha-${dia}`).disabled = fechado;
}

async function salvarHorarios(){
  const linhas = DIAS_SEMANA.map((_, dia) => {
    const fechado = document.getElementById(`hor-fechado-${dia}`).checked;
    const abre = document.getElementById(`hor-abre-${dia}`).value;
    const fecha = document.getElementById(`hor-fecha-${dia}`).value;
    return {
      dia_semana: dia,
      fechado,
      hora_abertura: fechado ? null : (abre || null),
      hora_fechamento: fechado ? null : (fecha || null),
    };
  });
  const { error } = await supabaseClient.from('horario_funcionamento').upsert(linhas, { onConflict: 'dia_semana' });
  const aviso = document.getElementById('salvo-horarios');
  if(error){
    alert('Não foi possível salvar os horários.\n\nErro: ' + (error.message || JSON.stringify(error)) +
      '\n\nVerifique se a tabela "horario_funcionamento" existe e tem política de INSERT/UPDATE liberada pro role anon no Supabase — veja as instruções que te passei.');
    console.error(error);
    return;
  }
  horarios = linhas;
  aviso.textContent = '✅ Salvo!';
  setTimeout(() => { aviso.textContent = ''; }, 2000);
}

async function salvarAvisoEspera(){
  const payload = {
    id: 1,
    tempo_espera_ativo: document.getElementById('espera-ativo').checked,
    tempo_espera_texto: document.getElementById('espera-texto').value.trim(),
  };
  const { error } = await supabaseClient.from('config_geral').upsert(payload, { onConflict: 'id' });
  const aviso = document.getElementById('salvo-espera');
  if(error){
    alert('Não foi possível salvar o aviso.\n\nErro: ' + (error.message || JSON.stringify(error)) +
      '\n\nVerifique se a tabela "config_geral" existe e tem política de INSERT/UPDATE liberada pro role anon no Supabase — veja as instruções que te passei.');
    console.error(error);
    return;
  }
  configGeral = payload;
  aviso.textContent = '✅ Salvo!';
  setTimeout(() => { aviso.textContent = ''; }, 2000);
}

/* ==================== ESTATÍSTICAS ==================== */
let statsPedidosCache = null; // guarda os pedidos já buscados, pra não reconsultar toda hora que troca o filtro
let statsPeriodo = 'hoje';    // hoje | semana | mes | tudo | custom
let statsDataIni = null;
let statsDataFim = null;

function brlAdmin(v){ return 'R$ ' + (v || 0).toFixed(2).replace('.', ','); }

async function carregarPedidosParaStats(forcar){
  if(statsPedidosCache && !forcar) return statsPedidosCache;
  const { data, error } = await supabaseClient
    .from('pedidos')
    .select('id, created_at, total, texto_comanda, itens')
    .order('created_at', { ascending: true })
    .limit(5000);
  if(error){
    console.error('Erro ao carregar pedidos para estatísticas:', error);
    statsPedidosCache = [];
    return statsPedidosCache;
  }
  statsPedidosCache = data || [];
  return statsPedidosCache;
}

function parseMoneyBRAdmin(s){
  if(!s) return null;
  const limpo = String(s).trim().replace(/\./g,'').replace(',', '.');
  const v = parseFloat(limpo);
  return isNaN(v) ? null : v;
}

// A regra de faturamento é sempre extrair "💰 TOTAL A COBRAR: R$ X" do texto da
// comanda — tem prioridade sobre a coluna "total", que pode ficar desatualizada
// em pedidos editados manualmente.
function extrairTotalCobrar(texto){
  if(!texto) return null;
  const m = texto.match(/TOTAL A COBRAR:\s*R\$\s*([\d.,]+)/i);
  if(!m) return null;
  return parseMoneyBRAdmin(m[1]);
}

// Usa o campo estruturado "itens" quando existir (pedidos novos, salvos a partir
// da Etapa 2). Pedidos antigos não têm esse campo — nesse caso, interpreta o
// texto da comanda (aproximado, mas cobre a maioria dos casos).
function extrairItensPedido(pedido){
  if(pedido.itens && Array.isArray(pedido.itens) && pedido.itens.length > 0) return pedido.itens;
  return interpretarTextoComanda(pedido.texto_comanda || '');
}

function interpretarTextoComanda(texto){
  const linhas = texto.split('\n');
  const itens = [];
  for(let i=0; i<linhas.length; i++){
    const linha = linhas[i].trim();
    let m;
    if((m = linha.match(/^🍕\s*(\d+)x\s*Pizza\s*(\w+)/))){
      const qty = parseInt(m[1],10);
      const sabores = [];
      let borda = null;
      let j = i+1;
      while(j < linhas.length && /^🔸/.test(linhas[j].trim())){
        const fm = linhas[j].trim().match(/^🔸(?:\[\d+\/\d+\]\s*)?(.+)/);
        if(fm) sabores.push(fm[1].trim());
        j++;
      }
      if(j < linhas.length && /^🧀 Borda Recheada:/.test(linhas[j].trim())){
        borda = linhas[j].trim().replace(/^🧀 Borda Recheada:\s*/,'').trim();
      }
      itens.push({ categoria:'pizza', nome:'Pizza', sabores, tamanho:m[2], borda, quantidade:qty });
      i = j - 1;
      continue;
    }
    if((m = linha.match(/^🥙\s*(\d+)x/))){
      const sabores = {};
      let j = i+1;
      while(j < linhas.length && /^🔸/.test(linhas[j].trim())){
        const fm = linhas[j].trim().match(/^🔸(\d+)x\s*(.+)/);
        if(fm) sabores[fm[2].trim()] = (sabores[fm[2].trim()] || 0) + parseInt(fm[1],10);
        j++;
      }
      const totalUnidades = Object.values(sabores).reduce((a,b)=>a+b,0);
      itens.push({ categoria:'esfiha', nome:'Combo de Esfihas', sabores, quantidade: totalUnidades || parseInt(m[1],10) });
      i = j - 1;
      continue;
    }
    if((m = linha.match(/^🥟\s*(\d+)x\s*Calzone\s*(.+)/))){
      itens.push({ categoria:'calzone', nome:'Calzone', sabor:m[2].trim(), quantidade:parseInt(m[1],10) });
      continue;
    }
    if((m = linha.match(/^🍩\s*(\d+)x\s*Brotinho Doce\s*-\s*(.+)/))){
      itens.push({ categoria:'brotinho', nome:'Brotinho Doce', sabor:m[2].trim(), quantidade:parseInt(m[1],10) });
      continue;
    }
    if((m = linha.match(/^🥤\s*(\d+)x\s*(.+)/))){
      itens.push({ categoria:'bebida', nome:m[2].trim(), quantidade:parseInt(m[1],10) });
      continue;
    }
    if((m = linha.match(/^🍽️\s*(\d+)x\s*(.+)/))){
      itens.push({ categoria:'combo', nome:m[2].trim(), quantidade:parseInt(m[1],10) });
      continue;
    }
  }
  return itens;
}

function dataDoPedidoNoPeriodo(createdAt, periodo){
  const d = new Date(createdAt);
  const agora = new Date();
  if(periodo === 'hoje') return d.toDateString() === agora.toDateString();
  if(periodo === 'semana'){
    const inicioSemana = new Date(agora);
    inicioSemana.setDate(agora.getDate() - agora.getDay());
    inicioSemana.setHours(0,0,0,0);
    return d >= inicioSemana;
  }
  if(periodo === 'mes') return d.getFullYear() === agora.getFullYear() && d.getMonth() === agora.getMonth();
  if(periodo === 'custom'){
    if(!statsDataIni || !statsDataFim) return true;
    const ini = new Date(statsDataIni + 'T00:00:00');
    const fim = new Date(statsDataFim + 'T23:59:59');
    return d >= ini && d <= fim;
  }
  return true; // 'tudo'
}

function calcularEstatisticas(pedidosFiltrados){
  let faturamento = 0;
  let unidadesVendidas = 0;
  const produtosRanking = {};
  const pizzaSabores = {};
  const pizzaTamanhos = {};
  const esfihaSabores = {};
  const bebidaRanking = {};
  const calzoneRanking = {};

  pedidosFiltrados.forEach(p => {
    const totalExtraido = extrairTotalCobrar(p.texto_comanda);
    faturamento += (totalExtraido !== null ? totalExtraido : (p.total || 0));

    extrairItensPedido(p).forEach(item => {
      const qty = item.quantidade || 1;
      if(item.categoria === 'pizza'){
        unidadesVendidas += qty;
        (item.sabores || []).forEach(s => {
          pizzaSabores[s] = (pizzaSabores[s]||0) + qty;
          produtosRanking[s] = (produtosRanking[s]||0) + qty;
        });
        if(item.tamanho) pizzaTamanhos[item.tamanho] = (pizzaTamanhos[item.tamanho]||0) + qty;
      } else if(item.categoria === 'esfiha'){
        const sabores = item.sabores || {};
        Object.keys(sabores).forEach(s => {
          const q = sabores[s];
          esfihaSabores[s] = (esfihaSabores[s]||0) + q;
          produtosRanking[s] = (produtosRanking[s]||0) + q;
          unidadesVendidas += q;
        });
      } else if(item.categoria === 'bebida'){
        bebidaRanking[item.nome] = (bebidaRanking[item.nome]||0) + qty;
        produtosRanking[item.nome] = (produtosRanking[item.nome]||0) + qty;
        unidadesVendidas += qty;
      } else if(item.categoria === 'calzone'){
        calzoneRanking[item.sabor] = (calzoneRanking[item.sabor]||0) + qty;
        produtosRanking[`Calzone ${item.sabor}`] = (produtosRanking[`Calzone ${item.sabor}`]||0) + qty;
        unidadesVendidas += qty;
      } else {
        const nome = item.nome || 'Item';
        produtosRanking[nome] = (produtosRanking[nome]||0) + qty;
        unidadesVendidas += qty;
      }
    });
  });

  return {
    faturamento,
    numPedidos: pedidosFiltrados.length,
    ticketMedio: pedidosFiltrados.length ? faturamento / pedidosFiltrados.length : 0,
    unidadesVendidas,
    produtosRanking, pizzaSabores, pizzaTamanhos, esfihaSabores, bebidaRanking, calzoneRanking
  };
}

function rankingHTML(obj, limite){
  limite = limite || 8;
  const entradas = Object.entries(obj).sort((a,b) => b[1]-a[1]).slice(0, limite);
  if(entradas.length === 0) return '<p style="opacity:.7; font-size:.85rem;">Sem dados nesse período.</p>';
  return '<ol style="padding-left:1.2rem; font-size:.9rem;">' + entradas.map(([nome,qty]) => `<li>${nome} — <b>${qty}</b> un.</li>`).join('') + '</ol>';
}

async function renderEstatisticas(){
  const el = document.getElementById('config-stats');
  if(!el) return;
  el.innerHTML = '<p style="opacity:.7;">Carregando pedidos...</p>';

  const pedidos = await carregarPedidosParaStats();
  const filtrados = pedidos.filter(p => dataDoPedidoNoPeriodo(p.created_at, statsPeriodo));
  const s = calcularEstatisticas(filtrados);

  const opcoesFiltro = [
    ['hoje','Hoje'], ['semana','Esta semana'], ['mes','Este mês'], ['tudo','Todo o período'], ['custom','Personalizado']
  ];
  const botoes = opcoesFiltro.map(([key,label]) =>
    `<button class="stat-filtro-btn${statsPeriodo===key?' active':''}" onclick="mudarPeriodoStats('${key}')">${label}</button>`
  ).join('');

  const customRow = statsPeriodo === 'custom' ? `
    <div style="display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap;">
      <input type="date" id="stats-data-ini" value="${statsDataIni||''}">
      <span>até</span>
      <input type="date" id="stats-data-fim" value="${statsDataFim||''}">
      <button class="btn-salvar" style="max-width:140px;" onclick="aplicarPeriodoCustom()">Aplicar</button>
    </div>` : '';

  el.innerHTML = `
    <div style="max-width:900px;">
      <h3 style="margin-top:0;">📊 Estatísticas de Vendas</h3>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">${botoes}</div>
      ${customRow}

      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:16px;">
        <div class="stat-card"><span class="stat-label">💰 Faturamento</span><span class="stat-value">${brlAdmin(s.faturamento)}</span></div>
        <div class="stat-card"><span class="stat-label">📦 Pedidos</span><span class="stat-value">${s.numPedidos}</span></div>
        <div class="stat-card"><span class="stat-label">🎯 Ticket médio</span><span class="stat-value">${brlAdmin(s.ticketMedio)}</span></div>
        <div class="stat-card"><span class="stat-label">🛒 Unidades vendidas</span><span class="stat-value">${s.unidadesVendidas}</span></div>
      </div>

      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:24px;">
        <div><h4>🏆 Produtos mais vendidos</h4>${rankingHTML(s.produtosRanking)}</div>
        <div><h4>🍕 Sabores de pizza</h4>${rankingHTML(s.pizzaSabores)}</div>
        <div><h4>📏 Pizzas por tamanho</h4>${rankingHTML(s.pizzaTamanhos)}</div>
        <div><h4>🥙 Esfihas mais vendidas</h4>${rankingHTML(s.esfihaSabores)}</div>
        <div><h4>🥤 Bebidas mais vendidas</h4>${rankingHTML(s.bebidaRanking)}</div>
        <div><h4>🥟 Calzones mais vendidos</h4>${rankingHTML(s.calzoneRanking)}</div>
      </div>

      <button class="btn-salvar" style="margin-top:20px; max-width:200px;" onclick="atualizarStats()">🔄 Atualizar dados</button>
    </div>
  `;
}

function mudarPeriodoStats(periodo){
  statsPeriodo = periodo;
  renderEstatisticas();
}
function aplicarPeriodoCustom(){
  statsDataIni = document.getElementById('stats-data-ini').value;
  statsDataFim = document.getElementById('stats-data-fim').value;
  renderEstatisticas();
}
async function atualizarStats(){
  await carregarPedidosParaStats(true);
  renderEstatisticas();
}
</script>
