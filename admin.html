<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Manel's Pizzaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --pine:#1F3327; --pine-soft:#28402F; --terracotta:#C0622F; --terracotta-dark:#9C4C22;
  --paper:#FBF7F1; --card:#FFFFFF; --ink:#241C14; --ink-soft:#6B5D4E;
  --line:rgba(36,28,20,.10); --line-strong:rgba(36,28,20,.18);
  --gold:#C99A4A; --ok:#3A7D4A; --danger:#C0392B;
  --sidebar-w:236px; --radius:14px; --radius-sm:9px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{ font-family:'Work Sans',sans-serif; background:var(--paper); color:var(--ink); margin:0; -webkit-font-smoothing:antialiased; }
h1,h2,h3,h4{ font-family:'Fraunces',serif; color:var(--ink); font-weight:700; margin:0; }
button, input, select, textarea{ font-family:inherit; }

/* ===== LOGIN ===== */
#tela-senha{ position:fixed; inset:0; background:radial-gradient(circle at 20% 20%, var(--pine-soft), var(--pine) 70%); display:flex; align-items:center; justify-content:center; z-index:999; padding:20px; }
.login-card{ background:var(--card); border-radius:20px; padding:38px 34px 30px; width:100%; max-width:320px; box-shadow:0 20px 60px rgba(0,0,0,.35); display:flex; flex-direction:column; gap:12px; text-align:center; }
.login-card .login-emoji{ font-size:34px; }
.login-card h1{ font-size:1.25rem; margin-bottom:2px; }
.login-card p{ font-size:.8rem; color:var(--ink-soft); margin-top:-6px; margin-bottom:8px; }
#tela-senha input{ font-size:.92rem; padding:11px 13px; border-radius:10px; border:1.5px solid var(--line-strong); width:100%; background:var(--paper); color:var(--ink); }
#tela-senha input:focus{ outline:none; border-color:var(--terracotta); }
#tela-senha button{ font-size:.9rem; padding:11px 20px; border:none; border-radius:10px; background:var(--terracotta); color:#fff; font-weight:700; cursor:pointer; margin-top:4px; }
#tela-senha button:hover{ background:var(--terracotta-dark); }
#tela-senha .erro-senha{ color:var(--danger); font-size:.8rem; min-height:1em; }

/* ===== SHELL ===== */
.admin-shell{ display:flex; min-height:100vh; }

/* ===== SIDEBAR ===== */
.sidebar{ width:var(--sidebar-w); flex:0 0 auto; background:var(--pine); color:#EFE8DC; display:flex; flex-direction:column; position:fixed; top:0; bottom:0; left:0; z-index:80; transition:transform .2s ease; }
.sidebar-brand{ display:flex; align-items:center; gap:10px; padding:20px 18px 16px; border-bottom:1px solid rgba(255,255,255,.1); }
.sidebar-brand .emoji{ font-size:22px; }
.sidebar-brand .txt{ line-height:1.15; }
.sidebar-brand .txt b{ font-family:'Fraunces',serif; font-size:.98rem; display:block; }
.sidebar-brand .txt span{ font-size:.68rem; opacity:.6; }
.sidebar-close{ display:none; margin-left:auto; background:none; border:none; color:#EFE8DC; font-size:1.2rem; cursor:pointer; opacity:.7; }

.sidebar-nav{ flex:1; overflow-y:auto; padding:14px 10px 10px; }
.nav-group{ margin-bottom:16px; }
.nav-group-label{ font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; opacity:.45; padding:0 10px; margin-bottom:6px; }
.nav-item{ width:100%; display:flex; align-items:center; gap:10px; text-align:left; font-size:.85rem; font-weight:600; padding:9px 10px; border:none; border-radius:9px; background:transparent; color:#EFE8DC; opacity:.82; cursor:pointer; position:relative; margin-bottom:2px; }
.nav-item .ico{ font-size:1rem; width:18px; text-align:center; flex:0 0 auto; }
.nav-item:hover{ background:rgba(255,255,255,.07); opacity:1; }
.nav-item.active{ background:rgba(192,98,47,.22); color:#fff; opacity:1; }
.nav-item.active::before{ content:''; position:absolute; left:-10px; top:8px; bottom:8px; width:3px; border-radius:3px; background:var(--terracotta); }

.sidebar-foot{ padding:12px 16px 16px; border-top:1px solid rgba(255,255,255,.1); display:flex; align-items:center; gap:10px; }
.sidebar-foot #status{ font-size:.7rem; padding:5px 10px; border-radius:20px; background:rgba(255,255,255,.08); flex:1; }
.sidebar-foot #status.ok{ color:#8fd19e; } .sidebar-foot #status.erro{ color:#e88; }
.sidebar-foot button{ font-size:.72rem; padding:6px 11px; border:none; border-radius:20px; background:rgba(255,255,255,.12); color:#EFE8DC; cursor:pointer; }
.sidebar-foot button:hover{ background:rgba(255,255,255,.2); }

.sidebar-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:70; }

/* ===== MAIN ===== */
.main{ flex:1; margin-left:var(--sidebar-w); min-width:0; display:flex; flex-direction:column; }
.topbar{ position:sticky; top:0; z-index:40; background:rgba(251,247,241,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:16px 26px; display:flex; align-items:center; gap:12px; }
.topbar h2{ font-size:1.15rem; flex:1; }
.hamburger{ display:none; background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--ink); padding:2px 4px; }
.content-wrap{ padding:22px 26px 60px; max-width:1180px; width:100%; }

.aviso-config{ background:rgba(192,57,43,.08); border:1px solid rgba(192,57,43,.35); color:var(--ink); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:18px; font-size:.82rem; line-height:1.5; display:none; }
.aviso-config.show{ display:block; }

.categoria{ display:none; }
.categoria.active{ display:block; }

.grade{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px; margin-bottom:18px; }

.produto{ background:var(--card); color:var(--ink); border-radius:var(--radius); padding:14px; border:1px solid var(--line); box-shadow:0 1px 3px rgba(36,28,20,.05); display:flex; flex-direction:column; gap:9px; }
.produto.inativo{ opacity:.5; }
.produto .foto-wrap{ position:relative; width:100%; height:140px; border-radius:10px; overflow:hidden; background:var(--paper); cursor:pointer; border:1px solid var(--line); }
.produto .foto-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
.produto .foto-wrap .foto-vazia{ display:flex; align-items:center; justify-content:center; height:100%; color:var(--ink-soft); font-size:.75rem; text-align:center; padding:8px; }
.produto .foto-wrap .foto-overlay{ position:absolute; inset:0; background:rgba(36,28,20,.5); color:#fff; display:flex; align-items:center; justify-content:center; font-size:.75rem; opacity:0; transition:opacity .15s; }
.produto .foto-wrap:hover .foto-overlay{ opacity:1; }
.produto input[type=file]{ display:none; }

.campo{ display:flex; flex-direction:column; gap:4px; }
.campo label{ font-size:.66rem; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); font-weight:700; }
.campo input[type=text], .campo input[type=number], .campo input[type=time], .campo textarea{ font-size:.86rem; padding:8px 10px; border-radius:8px; border:1.5px solid var(--line-strong); width:100%; background:var(--card); color:var(--ink); }
.campo input:focus, .campo textarea:focus{ outline:none; border-color:var(--terracotta); }
.campo textarea{ resize:vertical; min-height:50px; }

.linha-precos{ display:flex; gap:6px; }
.linha-precos .campo{ flex:1; }

.campo-toggle{ display:flex; align-items:center; gap:8px; font-size:.82rem; }
.campo-toggle input{ width:16px; height:16px; accent-color:var(--terracotta); }

details.promo{ border:1px dashed var(--line-strong); border-radius:9px; padding:9px 10px; }
details.promo summary{ font-size:.78rem; font-weight:700; cursor:pointer; color:var(--terracotta-dark); }
details.promo .conteudo-promo{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }

.acoes-produto{ display:flex; gap:6px; margin-top:4px; }
.acoes-produto button{ flex:1; font-size:.78rem; padding:9px; border:none; border-radius:8px; cursor:pointer; font-weight:700; }
.btn-salvar{ background:var(--ok); color:#fff; }
.btn-salvar:hover{ filter:brightness(1.08); }
.btn-excluir{ background:var(--danger); color:#fff; }
.btn-excluir:hover{ filter:brightness(1.08); }
.salvo-ok{ font-size:.72rem; color:var(--ok); text-align:center; min-height:1em; font-weight:600; }

.painel-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:18px; }

.stat-filtro-btn{ font-size:.8rem; padding:7px 14px; border:1.5px solid var(--line-strong); border-radius:999px; background:var(--card); color:var(--ink); cursor:pointer; }
.stat-filtro-btn.active{ background:var(--terracotta); border-color:var(--terracotta); color:#fff; font-weight:700; }
.stat-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px; display:flex; flex-direction:column; gap:3px; }
.stat-card .stat-label{ font-size:.72rem; color:var(--ink-soft); }
.stat-card .stat-value{ font-size:1.35rem; font-weight:800; font-family:'Fraunces',serif; }
.stat-card .stat-sub{ font-size:.68rem; color:var(--ink-soft); }
.stat-comparativo{ font-size:.7rem; font-weight:700; margin-top:2px; }
.stat-comparativo.up{ color:var(--ok); }
.stat-comparativo.down{ color:var(--danger); }
.stat-secao{ margin-top:26px; padding-top:20px; border-top:1px solid var(--line); }
.stat-secao h4{ margin:0 0 10px; font-size:1rem; }
.stat-secao h5{ margin:0 0 4px; font-size:.8rem; color:var(--ink-soft); font-family:inherit; font-weight:700; }
.stat-empty{ color:var(--ink-soft); font-size:.85rem; }
.stat-ranking-list{ list-style:none; padding:0; margin:0; font-size:.88rem; display:flex; flex-direction:column; gap:4px; }
.stat-ranking-list li{ display:flex; justify-content:space-between; background:var(--paper); padding:7px 10px; border-radius:8px; border:1px solid var(--line); }
.stat-legenda{ font-size:.75rem; color:var(--ink-soft); background:var(--paper); padding:9px 11px; border-radius:9px; line-height:1.7; border:1px solid var(--line); }
.stat-badge{ font-size:.7rem; font-weight:700; padding:2px 7px; border-radius:999px; white-space:nowrap; }
.stat-badge.exato{ background:rgba(58,125,74,.14); color:var(--ok); }
.stat-badge.aproximado{ background:rgba(201,154,74,.2); color:#8a6a1f; }
.stat-bar-chart{ display:flex; align-items:flex-end; gap:6px; height:140px; overflow-x:auto; padding-bottom:4px; }
.stat-bar-col{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:28px; }
.stat-bar{ width:18px; background:var(--terracotta); border-radius:4px 4px 0 0; min-height:4px; }
.stat-bar-label{ font-size:.6rem; color:var(--ink-soft); margin-top:4px; writing-mode:vertical-rl; transform:rotate(180deg); }
.stat-tabela{ width:100%; border-collapse:collapse; font-size:.8rem; }
.stat-tabela th{ text-align:left; padding:7px 9px; border-bottom:1.5px solid var(--line-strong); color:var(--ink-soft); font-size:.72rem; text-transform:uppercase; letter-spacing:.03em; }
.stat-tabela td{ padding:7px 9px; border-bottom:1px solid var(--line); }

.card-novo{ background:var(--card); border:2px dashed var(--line-strong); border-radius:var(--radius); padding:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; min-height:120px; font-size:.9rem; font-weight:700; text-align:center; color:var(--ink-soft); }
.card-novo:hover{ background:var(--paper); border-color:var(--terracotta); color:var(--terracotta-dark); }

@media (max-width: 880px){
  .sidebar{ transform:translateX(-100%); box-shadow:0 0 40px rgba(0,0,0,.3); }
  .sidebar.open{ transform:translateX(0); }
  .sidebar-close{ display:block; }
  .sidebar-overlay.show{ display:block; }
  .main{ margin-left:0; }
  .hamburger{ display:block; }
  .content-wrap{ padding:18px 16px 50px; }
  .topbar{ padding:14px 16px; }
}
/* ===== COMANDAS (aba nova, escopada em #config-comandas) ===== */
:root{ --dark-green:#2d4a3a; --beige:#f5e6d3; }
#config-comandas { font-family:'Courier New', monospace; background:var(--dark-green); color:var(--beige); margin:0; padding:20px; min-height:100vh; }
#config-comandas header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding-bottom:14px; border-bottom:2px solid var(--terracotta); flex-wrap:wrap; gap:10px; }
#config-comandas h1 { margin:0; font-size:1.3rem; }
#config-comandas #status { font-size:.8rem; padding:6px 12px; border-radius:20px; background:rgba(255,255,255,.1); }
#config-comandas #status.ok { color:#8fd19e; }
#config-comandas #status.erro { color:#e88; }
#config-comandas #resumo-dia { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
#config-comandas .cartao-resumo { background:rgba(255,255,255,.1); border-radius:8px; padding:10px 16px; min-width:120px; }
#config-comandas .cartao-resumo .num { font-size:1.3rem; font-weight:bold; color:var(--beige); }
#config-comandas .cartao-resumo .lbl { font-size:.7rem; opacity:.75; text-transform:uppercase; }
#config-comandas .tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
#config-comandas .tab { font-family:inherit; font-size:.85rem; padding:8px 16px; border:none; border-radius:20px; cursor:pointer; font-weight:bold; background:rgba(255,255,255,.12); color:var(--beige); }
#config-comandas .tab.active { background:var(--terracotta); color:#fff; }
#config-comandas .barra-acoes { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
#config-comandas .barra-acoes input[type=text] { font-family:inherit; padding:8px 12px; border-radius:6px; border:none; font-size:.85rem; min-width:200px; }
#config-comandas .btn-topo { font-family:inherit; font-size:.82rem; padding:8px 14px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; background:rgba(255,255,255,.15); color:var(--beige); }
#config-comandas .btn-topo:hover { background:rgba(255,255,255,.25); }
#config-comandas .grade { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:14px; }
#config-comandas .data-cabecalho { grid-column:1/-1; font-size:.9rem; font-weight:bold; color:var(--beige); opacity:.85; margin:10px 0 -2px 4px; border-bottom:1px dashed rgba(255,255,255,.3); padding-bottom:4px; }
#config-comandas .pedido { background:#fff; color:#222; border-radius:10px; padding:14px; box-shadow:0 3px 10px rgba(0,0,0,.25); border-left:6px solid var(--terracotta); animation:novo .5s ease; display:flex; flex-direction:column; }
#config-comandas .pedido.status-finalizado_pago { border-left-color:#3a7d4a; }
#config-comandas .pedido.status-em_andamento { border-left-color:#3a72c0; }
#config-comandas .pedido.status-rota_entrega { border-left-color:#6a3ac0; }
#config-comandas .pedido.status-pendencia { border-left-color:#a9860a; }
#config-comandas .pedido.status-cancelado { border-left-color:#888; }
#config-comandas .pedido.atrasado { box-shadow:0 0 0 3px #e05a3a; }
@keyframes novo{ 0%{ transform:scale(1.03); box-shadow:0 0 0 6px rgba(192,98,47,.4);} 100%{ transform:scale(1); box-shadow:0 3px 10px rgba(0,0,0,.25);} }
#config-comandas .pedido-topo { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:6px; }
#config-comandas .pedido-numero { font-weight:bold; font-size:.85rem; color:#555; }
#config-comandas .pedido-hora { font-size:.75rem; color:#888; }
#config-comandas .pedido-total { font-weight:bold; color:var(--terracotta); font-size:1.05rem; }
#config-comandas select.status-select { font-family:inherit; font-size:.78rem; padding:5px 8px; border-radius:12px; font-weight:bold; border:none; margin-bottom:8px; }
#config-comandas .status-select.novo { background:#fdecdc; color:var(--terracotta); }
#config-comandas .status-select.em_andamento { background:#dde9fb; color:#3a72c0; }
#config-comandas .status-select.rota_entrega { background:#e0d6f5; color:#6a3ac0; }
#config-comandas .status-select.finalizado_pago { background:#e3f3e6; color:#3a7d4a; }
#config-comandas .status-select.pendencia { background:#fdf3d0; color:#a9860a; }
#config-comandas .status-select.cancelado { background:#e6e6e6; color:#555; }
#config-comandas textarea { width:100%; font-family:'Courier New', monospace; font-size:.8rem; padding:8px; border-radius:6px; border:1px dashed #ccc; background:#fafafa; color:#222; min-height:160px; resize:vertical; margin-bottom:8px; flex:1; }
#config-comandas .acoes { display:flex; gap:6px; flex-wrap:wrap; }
#config-comandas button.acao { font-family:inherit; font-size:.78rem; padding:7px 12px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; }
#config-comandas .btn-imprimir { background:var(--dark-green); color:#fff; }
#config-comandas .btn-salvar { background:#d9a441; color:#fff; }
#config-comandas .btn-ok { background:#e9e9e9; color:#555; }
#config-comandas .btn-excluir { background:#c03a3a; color:#fff; }
#config-comandas #vazio { text-align:center; padding:60px 20px; opacity:.6; }
#config-comandas #builder-overlay {
    --b-pine:#1F3327; --b-terracotta:#C0622F; --b-terracotta-dark:#9C4C22;
    --b-paper:#FBF7F1; --b-card:#FFFFFF; --b-ink:#241C14; --b-ink-soft:#6B5D4E;
    --b-line:rgba(36,28,20,.12); --b-line-strong:rgba(36,28,20,.20);
    --b-gold:#C99A4A; --b-ok:#3A7D4A; --b-danger:#C0392B;
    font-family:'Work Sans',sans-serif;
  }
#config-comandas #builder-modal {
    background:var(--b-paper) !important; color:var(--b-ink) !important;
    max-width:760px !important; border-radius:20px !important; padding:0 !important;
    font-family:'Work Sans',sans-serif !important; overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,.4);
  }
#config-comandas .b-topo {
    display:flex; justify-content:space-between; align-items:center;
    background:var(--b-pine); color:#fff; padding:18px 24px;
  }
#config-comandas .b-topo h2 { margin:0; font-family:'Fraunces',serif; font-weight:700; font-size:1.25rem; }
#config-comandas .b-topo button { border:none; background:rgba(255,255,255,.12); color:#fff; width:32px; height:32px; border-radius:50%; font-size:1.1rem; cursor:pointer; line-height:1; }
#config-comandas .b-topo button:hover { background:rgba(255,255,255,.22); }
#config-comandas .b-corpo { padding:22px 24px; max-height:70vh; overflow-y:auto; }
#config-comandas .b-secao { background:var(--b-card); border:1px solid var(--b-line); border-radius:14px; padding:16px 18px; margin-bottom:16px; }
#config-comandas .b-secao h4 { margin:0 0 12px; font-family:'Fraunces',serif; font-weight:700; font-size:1rem; color:var(--b-pine); display:flex; align-items:center; gap:8px; }
#config-comandas .b-linha { display:flex; gap:12px; flex-wrap:wrap; }
#config-comandas .b-campo { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; flex:1; min-width:150px; }
#config-comandas .b-campo.full { flex-basis:100%; }
#config-comandas .b-campo label { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--b-ink-soft); }
#config-comandas .b-campo input[type=text], #config-comandas .b-campo input[type=number], #config-comandas .b-campo input[type=tel], #config-comandas .b-campo select, #config-comandas .b-campo textarea {
    font-family:inherit; font-size:.92rem; padding:9px 11px; border-radius:9px;
    border:1.5px solid var(--b-line-strong); background:var(--b-paper); color:var(--b-ink); width:100%;
  }
#config-comandas .b-campo input:focus, #config-comandas .b-campo select:focus, #config-comandas .b-campo textarea:focus { outline:none; border-color:var(--b-terracotta); background:#fff; }
#config-comandas .b-fulfillment { display:flex; gap:16px; margin:2px 0 12px; }
#config-comandas .b-fulfillment label { display:flex; align-items:center; gap:6px; font-size:.88rem; font-weight:600; cursor:pointer; }
#config-comandas .b-checkrow { display:flex; gap:18px; flex-wrap:wrap; align-items:center; font-size:.88rem; margin-top:4px; }
#config-comandas .b-checkrow label { display:flex; align-items:center; gap:6px; cursor:pointer; }
#config-comandas .b-cart-linha {
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--b-paper); border:1px solid var(--b-line); border-radius:10px;
    padding:9px 12px; margin-bottom:6px; font-size:.88rem;
  }
#config-comandas .b-cart-linha b { color:var(--b-terracotta-dark); white-space:nowrap; margin-left:10px; }
#config-comandas .b-cart-linha button {
    border:none; background:var(--b-danger); color:#fff; border-radius:6px;
    width:24px; height:24px; cursor:pointer; font-size:.85rem; line-height:1; margin-left:8px; flex:0 0 auto;
  }
#config-comandas #builder-cart-vazio { color:var(--b-ink-soft); font-size:.88rem; font-style:italic; margin:4px 0 0; }
#config-comandas .b-add-item select#builder-tipo-item {

<body>

<div id="tela-senha">
  <div class="login-card">
    <div class="login-emoji">🍕</div>
    <h1>Painel Manel's</h1>
    <p>Entre com sua conta de equipe</p>
    <input type="email" id="input-email" placeholder="E-mail" autocomplete="username" autofocus>
    <input type="password" id="input-senha" placeholder="Senha" autocomplete="current-password">
    <button onclick="conferirSenha()">Entrar</button>
    <div class="erro-senha" id="erro-senha"></div>
  </div>
</div>

<div id="conteudo" style="display:none;">
  <div class="admin-shell">
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar(false)"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="emoji">🍕</span>
        <div class="txt"><b>Manel's</b><span>Painel de gestão</span></div>
        <button class="sidebar-close" onclick="toggleSidebar(false)">✕</button>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-foot">
        <div id="status">conectando…</div>
        <button onclick="sairPainel()">Sair</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="hamburger" onclick="toggleSidebar(true)">☰</button>
        <h2 id="topbar-titulo">Painel</h2>
      </header>
      <div class="content-wrap">
        <div class="aviso-config" id="aviso-config"></div>
        <div id="categorias"></div>
      </div>
    </div>
  </div>
</div>


<script>
async function conferirSenha(){
  const email = document.getElementById('input-email').value.trim();
  const senha = document.getElementById('input-senha').value;
  const erroEl = document.getElementById('erro-senha');
  erroEl.textContent = '';
  if(!email || !senha){ erroEl.textContent = 'Preencha e-mail e senha.'; return; }
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
  if(error){
    erroEl.textContent = error.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : error.message;
    return;
  }
  document.getElementById('tela-senha').style.display = 'none';
  document.getElementById('conteudo').style.display = 'block';
  iniciar();
}
async function sairPainel(){
  await supabaseClient.auth.signOut();
  document.getElementById('conteudo').style.display = 'none';
  document.getElementById('tela-senha').style.display = 'flex';
  document.getElementById('input-senha').value = '';
}
document.getElementById('input-senha').addEventListener('keydown', e => { if(e.key === 'Enter') conferirSenha(); });
document.getElementById('input-email').addEventListener('keydown', e => { if(e.key === 'Enter') conferirSenha(); });

// Mesmo projeto Supabase que o cardápio (index.html) usa para carregar os produtos.
// Mesmo projeto Supabase que o pedidos (comandas.html) usa — o projeto antigo
// de produtos (qhdxiojewiveazfozpix) não está mais acessível, então unificamos tudo aqui.
const SUPABASE_URL = "https://wzmiqubfzlmglimmtkoz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ockSNlwXiqu24_AaNX6tYQ_lQPQSv_7";
const STORAGE_BUCKET = "produtos"; // precisa existir como bucket PÚBLICO no Supabase

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Se já existe uma sessão válida (ex: recarregou a página), pula a tela de login.
supabaseClient.auth.getSession().then(({ data: { session } }) => {
  if(session){
    document.getElementById('tela-senha').style.display = 'none';
    document.getElementById('conteudo').style.display = 'block';
    iniciar();
  }
});

const CATEGORIAS = [
  { key:'comandas', label:'Comandas',        icon:'🧾', group:'Operação' },
  { key:'combo',    label:'Promoções',        icon:'🎉', group:'Cardápio' },
  { key:'pizza',    label:'Pizzas',           icon:'🍕', group:'Cardápio' },
  { key:'calzone',  label:'Calzones',         icon:'🥟', group:'Cardápio' },
  { key:'brotinho', label:'Brotinho',         icon:'🍫', group:'Cardápio' },
  { key:'esfiha',   label:'Esfihas',          icon:'🔺', group:'Cardápio' },
  { key:'bebida',   label:'Bebidas',          icon:'🥤', group:'Cardápio' },
  { key:'borda',    label:'Bordas Recheadas', icon:'🧀', group:'Cardápio' },
  { key:'capas',    label:'Capas do Site',    icon:'🖼️', group:'Site' },
  { key:'carrossel',label:'Carrossel',        icon:'🎠', group:'Site' },
  { key:'stats',    label:'Estatísticas',     icon:'📊', group:'Gestão' },
  { key:'avaliacoes',label:'Avaliações',      icon:'⭐', group:'Gestão' },
  { key:'motoboy',  label:'Motoboy ao vivo',  icon:'📍', group:'Gestão' },
  { key:'config',   label:'Configurações',    icon:'⚙️', group:'Sistema' },
];
const GRUPOS_ORDEM = ['Cardápio', 'Site', 'Gestão', 'Sistema'];


let produtos = []; // todos os produtos, de todas as categorias
let categoriaAtiva = 'combo';
let horarios = []; // linhas da tabela horario_funcionamento
let configGeral = {
  tempo_espera_ativo:false, tempo_espera_texto:'',
  hero_entrega_texto:'🛵 Entrega em 35–50 min', hero_local_texto:'📍 Centro',
  fechado_titulo:'🕒 Estamos fechados no momento', fechado_texto_extra:'',
  whatsapp_numero:''
};
let TAMANHOS_PIZZA = []; // [{chave, rotulo, medida, max_sabores, ordem, ativo}]
const DIAS_SEMANA = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

function setStatus(texto, tipo){
  const el = document.getElementById('status');
  el.textContent = texto;
  el.className = tipo || '';
}

function mostrarAvisoConfig(msg){
  const el = document.getElementById('aviso-config');
  el.innerHTML = msg;
  el.classList.add('show');
}

async function carregarTamanhosPizza(){
  const { data, error } = await supabaseClient.from('tamanhos_pizza').select('*').order('ordem', { ascending:true });
  if(error){
    console.error('Erro ao carregar tamanhos de pizza:', error);
    TAMANHOS_PIZZA = [];
    return;
  }
  TAMANHOS_PIZZA = data || [];
}

async function iniciar(){
  renderTabs();
  const inicial = CATEGORIAS.find(c => c.key === categoriaAtiva);
  const titulo = document.getElementById('topbar-titulo');
  if(titulo && inicial) titulo.textContent = `${inicial.icon} ${inicial.label}`;
  await carregarTamanhosPizza();
  await Promise.all([carregarProdutos(), carregarConfiguracoes()]);
}

async function carregarConfiguracoes(){
  try{
    const [{ data: h, error: eh }, { data: c, error: ec }] = await Promise.all([
      supabaseClient.from('horario_funcionamento').select('*').order('dia_semana'),
      supabaseClient.from('config_geral').select('*').eq('id', 1).maybeSingle()
    ]);
    if(eh) throw eh;
    horarios = h || [];
    if(!ec && c) configGeral = c;
  } catch(err){
    console.error('Erro ao carregar configurações:', err);
  }
  renderConfiguracoes();
}

function renderTabs(){
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = GRUPOS_ORDEM.map(grupo => {
    const itens = CATEGORIAS.filter(c => c.group === grupo);
    if(itens.length === 0) return '';
    return `
      <div class="nav-group">
        <div class="nav-group-label">${grupo}</div>
        ${itens.map(c => `
          <button class="nav-item ${c.key===categoriaAtiva?'active':''}" onclick="mudarCategoria('${c.key}')">
            <span class="ico">${c.icon}</span><span>${c.label}</span>
          </button>
        `).join('')}
      </div>
    `;
  }).join('');
}

function mudarCategoria(key){
  categoriaAtiva = key;
  renderTabs();
  document.querySelectorAll('.categoria').forEach(el => el.classList.toggle('active', el.dataset.categoria === key));
  const atual = CATEGORIAS.find(c => c.key === key);
  const titulo = document.getElementById('topbar-titulo');
  if(titulo && atual) titulo.textContent = `${atual.icon} ${atual.label}`;
  toggleSidebar(false); // no celular, escolher um item fecha o menu lateral
  carregarAbaSobDemanda(key);
}

function toggleSidebar(abrir){
  document.getElementById('sidebar').classList.toggle('open', abrir);
  document.getElementById('sidebar-overlay').classList.toggle('show', abrir);
}

async function carregarProdutos(){
  setStatus('carregando…');
  try{
    const { data, error } = await supabaseClient.from('products').select('*').order('category').order('sort_order');
    if(error) throw error;
    produtos = data || [];
    setStatus(`${produtos.length} produtos · conectado`, 'ok');
    renderCategorias();
  } catch(err){
    console.error(err);
    setStatus('erro de conexão', 'erro');
    mostrarAvisoConfig(`
      <b>⚠️ Não consegui carregar os produtos.</b><br>
      Isso normalmente acontece por falta de permissão no Supabase. Verifique:<br>
      1. A tabela <b>products</b> existe no projeto <code>wzmiqubfzlmglimmtkoz</code>?<br>
      2. Em <b>Authentication → Policies</b>, a tabela <b>products</b> tem uma política de <b>SELECT</b> liberada pro role <b>anon</b>?<br><br>
      Erro técnico: <code>${(err && err.message) ? err.message : JSON.stringify(err)}</code>
    `);
  }
}

function renderCategorias(){
  const box = document.getElementById('categorias');
  box.innerHTML = CATEGORIAS.map(c => `
    <div class="categoria ${c.key===categoriaAtiva?'active':''}" data-categoria="${c.key}">
      ${c.key === 'config' ? '<div id="config-config"></div>' : c.key === 'stats' ? '<div id="config-stats"></div>' : c.key === 'avaliacoes' ? '<div id="config-avaliacoes"></div>' : c.key === 'motoboy' ? '<div id="config-motoboy"></div>' : c.key === 'comandas' ? '<div id="config-comandas"></div>' : c.key === 'carrossel' ? '<div id="config-carrossel"></div>' : c.key === 'capas' ? '<div class="grade" id="grade-capas"></div>' : c.key === 'pizza' ? `<div id="tamanhos-pizza-painel"></div><div class="grade" id="grade-${c.key}"></div>` : `<div class="grade" id="grade-${c.key}"></div>`}
    </div>
  `).join('');

  const CHAVES_SEM_GRADE_PRODUTO = ['config', 'stats', 'avaliacoes', 'motoboy', 'comandas', 'carrossel', 'capas'];
  CATEGORIAS.forEach(c => { if(!CHAVES_SEM_GRADE_PRODUTO.includes(c.key)) renderGrade(c.key); });
  renderConfiguracoes();
  renderTamanhosPizzaPainel();
  carregarAbaSobDemanda(categoriaAtiva); // só busca dados da aba que já está aberta agora
}

// Estatísticas, Avaliações, Carrossel e Capas fazem consultas pesadas no banco
// (a de Estatísticas sozinha pode puxar até 5.000 pedidos inteiros). Antes,
// TODAS elas rodavam de novo a cada vez que a tela era redesenhada — mesmo
// que você estivesse só editando um produto em outra aba. Agora só carregam
// na primeira vez que você realmente abre aquela aba específica.
const ABAS_CARREGADAS = {};
function carregarAbaSobDemanda(key){
  if(ABAS_CARREGADAS[key]) return; // já carregou antes nesta sessão — não busca de novo
  if(key === 'stats'){ ABAS_CARREGADAS.stats = true; renderEstatisticas(); }
  else if(key === 'avaliacoes'){ ABAS_CARREGADAS.avaliacoes = true; renderAvaliacoes(); }
  else if(key === 'motoboy'){ ABAS_CARREGADAS.motoboy = true; iniciarMotoboyAoVivo(); }
  else if(key === 'comandas'){ ABAS_CARREGADAS.comandas = true; renderComandasShell(); iniciarComandas(); }
  else if(key === 'carrossel'){ ABAS_CARREGADAS.carrossel = true; renderCarrosselAdmin(); }
  else if(key === 'capas'){ ABAS_CARREGADAS.capas = true; renderCapasGrid(); }
}

function renderGrade(catKey){
  const grade = document.getElementById(`grade-${catKey}`);
  const itens = produtos.filter(p => p.category === catKey);
  const isPizza = catKey === 'pizza';
  const isCombo = catKey === 'combo';

  grade.innerHTML = itens.map(p => cardProdutoHTML(p, isPizza, isCombo)).join('')
    + `<div class="card-novo" onclick="adicionarProduto('${catKey}')">➕<br>Adicionar ${CATEGORIAS.find(c=>c.key===catKey).label.replace(/s$/,'')}</div>`;
}

function precoUnico(p){
  return (p.prices && p.prices.unico !== undefined) ? p.prices.unico : '';
}
function precoPizza(p, tam){
  return (p.prices && p.prices[tam] !== undefined) ? p.prices[tam] : '';
}
function promoUnico(p){
  return (p.promo_prices && p.promo_prices.unico !== undefined) ? p.promo_prices.unico : '';
}
function promoPizza(p, tam){
  return (p.promo_prices && p.promo_prices[tam] !== undefined) ? p.promo_prices[tam] : '';
}

function renderTamanhosPizzaPainel(){
  const el = document.getElementById('tamanhos-pizza-painel');
  if(!el) return;

  const linhas = TAMANHOS_PIZZA.map((t, i) => `
    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:rgba(255,255,255,.05); border-radius:8px; padding:10px; margin-bottom:8px;">
      <input type="text" value="${(t.rotulo||'').replace(/"/g,'&quot;')}" placeholder="Rótulo (ex: Média)" id="tam-rotulo-${t.chave}" style="width:110px; padding:6px 8px; border-radius:6px; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.2); color:inherit;">
      <input type="text" value="${(t.medida||'').replace(/"/g,'&quot;')}" placeholder="Medida (ex: 30 cm)" id="tam-medida-${t.chave}" style="width:100px; padding:6px 8px; border-radius:6px; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.2); color:inherit;">
      <label style="font-size:12px; display:flex; align-items:center; gap:4px;">Até
        <input type="number" min="1" max="4" value="${t.max_sabores}" id="tam-maxsab-${t.chave}" style="width:48px; padding:6px; border-radius:6px; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.2); color:inherit;">
        sabor(es)
      </label>
      <label style="font-size:12px; display:flex; align-items:center; gap:4px;">
        <input type="checkbox" id="tam-ativo-${t.chave}" ${t.ativo?'checked':''}> Ativo
      </label>
      <code style="font-size:11px; opacity:.6;">chave: ${t.chave}</code>
      <button class="btn-salvar" style="max-width:90px; padding:6px 10px;" onclick="salvarTamanhoPizza('${t.chave}')">💾</button>
      <button class="btn-salvar" style="max-width:40px; padding:6px 10px; background:var(--gold);" onclick="moverTamanhoPizza('${t.chave}', -1)" ${i===0?'disabled':''}>↑</button>
      <button class="btn-salvar" style="max-width:40px; padding:6px 10px; background:var(--gold);" onclick="moverTamanhoPizza('${t.chave}', 1)" ${i===TAMANHOS_PIZZA.length-1?'disabled':''}>↓</button>
      <button class="btn-salvar" style="max-width:40px; padding:6px 10px; background:#7C3B1D;" onclick="excluirTamanhoPizza('${t.chave}')">🗑️</button>
    </div>
  `).join('');

  el.innerHTML = `
    <div style="background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:14px; margin-bottom:18px;">
      <h3 style="margin:0 0 4px;">📏 Tamanhos de Pizza</h3>
      <p style="font-size:.8rem; opacity:.8; margin-top:0;">
        Crie, renomeie ou desative tamanhos livremente. Desativar um tamanho não apaga os preços já
        cadastrados nele — só some da tela até você reativar.
      </p>
      ${linhas}
      <div style="display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap;">
        <input type="text" id="novo-tam-chave" placeholder="Chave (ex: P)" style="width:80px; padding:6px 8px; border-radius:6px; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.2); color:inherit;">
        <input type="text" id="novo-tam-rotulo" placeholder="Rótulo (ex: Pequena)" style="width:130px; padding:6px 8px; border-radius:6px; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.2); color:inherit;">
        <button class="btn-salvar" style="max-width:160px;" onclick="criarTamanhoPizza()">➕ Criar tamanho</button>
      </div>
    </div>
  `;
}

async function criarTamanhoPizza(){
  const chave = document.getElementById('novo-tam-chave').value.trim().toUpperCase();
  const rotulo = document.getElementById('novo-tam-rotulo').value.trim();
  if(!chave || !rotulo){ alert('Preencha a chave e o rótulo do novo tamanho.'); return; }
  if(!/^[A-Z0-9_]+$/.test(chave)){ alert('A chave só pode ter letras, números e underline (sem espaços ou acentos). Ex: P, GG2, FAMILIA'); return; }
  if(TAMANHOS_PIZZA.some(t => t.chave === chave)){ alert('Já existe um tamanho com essa chave.'); return; }

  const maiorOrdem = TAMANHOS_PIZZA.reduce((m,t) => Math.max(m, t.ordem||0), 0);
  const { data, error } = await supabaseClient.from('tamanhos_pizza').insert({
    chave, rotulo, medida: '', max_sabores: 2, ordem: maiorOrdem + 1, ativo: true
  }).select();
  if(error){
    alert('Não foi possível criar o tamanho.\n\nErro: ' + (error.message || JSON.stringify(error)));
    console.error(error);
    return;
  }
  TAMANHOS_PIZZA.push(data[0]);
  document.getElementById('novo-tam-chave').value = '';
  document.getElementById('novo-tam-rotulo').value = '';
  renderTamanhosPizzaPainel();
  renderGrade('pizza'); // os cards de pizza precisam mostrar o campo de preço do novo tamanho
}

async function salvarTamanhoPizza(chave){
  const payload = {
    rotulo: document.getElementById(`tam-rotulo-${chave}`).value.trim(),
    medida: document.getElementById(`tam-medida-${chave}`).value.trim(),
    max_sabores: parseInt(document.getElementById(`tam-maxsab-${chave}`).value, 10) || 1,
    ativo: document.getElementById(`tam-ativo-${chave}`).checked,
  };
  const { data, error } = await supabaseClient.from('tamanhos_pizza').update(payload).eq('chave', chave).select();
  if(error){
    alert('Não foi possível salvar o tamanho.\n\nErro: ' + (error.message || JSON.stringify(error)));
    console.error(error);
    return;
  }
  if(!data || data.length === 0){ alert('0 linhas afetadas — verifique sua sessão/permissão.'); return; }
  const idx = TAMANHOS_PIZZA.findIndex(t => t.chave === chave);
  if(idx >= 0) TAMANHOS_PIZZA[idx] = data[0];
  alert('Tamanho salvo! ✅');
  renderGrade('pizza');
}

async function excluirTamanhoPizza(chave){
  if(!confirm(`Excluir o tamanho "${chave}"? Os preços já cadastrados nele ficam guardados no produto, mas o tamanho some das opções.`)) return;
  const { error } = await supabaseClient.from('tamanhos_pizza').delete().eq('chave', chave);
  if(error){
    alert('Não foi possível excluir.\n\nErro: ' + (error.message || JSON.stringify(error)));
    console.error(error);
    return;
  }
  TAMANHOS_PIZZA = TAMANHOS_PIZZA.filter(t => t.chave !== chave);
  renderTamanhosPizzaPainel();
  renderGrade('pizza');
}

async function moverTamanhoPizza(chave, direcao){
  const idx = TAMANHOS_PIZZA.findIndex(t => t.chave === chave);
  const vizinho = TAMANHOS_PIZZA[idx + direcao];
  if(!vizinho) return;
  const atual = TAMANHOS_PIZZA[idx];
  const ordemAtual = atual.ordem, ordemVizinho = vizinho.ordem;
  const [{ error: e1 }, { error: e2 }] = await Promise.all([
    supabaseClient.from('tamanhos_pizza').update({ ordem: ordemVizinho }).eq('chave', atual.chave),
    supabaseClient.from('tamanhos_pizza').update({ ordem: ordemAtual }).eq('chave', vizinho.chave),
  ]);
  if(e1 || e2){ alert('Não foi possível reordenar.'); console.error(e1, e2); return; }
  atual.ordem = ordemVizinho; vizinho.ordem = ordemAtual;
  TAMANHOS_PIZZA.sort((a,b) => a.ordem - b.ordem);
  renderTamanhosPizzaPainel();
  renderGrade('pizza');
}

function alternarCampoEstoque(id){
  const tipo = document.getElementById(`estoque-tipo-${id}`).value;
  document.getElementById(`estoque-detalhe-${id}`).style.display = tipo === 'limitado' ? 'flex' : 'none';
}

function montarPrecos(id, isPizza){
  if(isPizza){
    const p = produtos.find(x => x.id === id);
    const obj = { ...(p && p.prices ? p.prices : {}) }; // preserva preços de tamanhos desativados/ocultos
    TAMANHOS_PIZZA.filter(t => t.ativo).forEach(t => {
      const campo = document.getElementById(`preco-${t.chave}-${id}`);
      if(!campo) return;
      const v = parseFloat(campo.value);
      if(!isNaN(v)) obj[t.chave] = v; else delete obj[t.chave];
    });
    return obj;
  } else {
    const v = parseFloat(document.getElementById(`preco-unico-${id}`).value);
    return isNaN(v) ? {} : { unico: v };
  }
}

function montarPromoPrecos(id, isPizza){
  if(isPizza){
    const p = produtos.find(x => x.id === id);
    const obj = { ...(p && p.promo_prices ? p.promo_prices : {}) };
    TAMANHOS_PIZZA.filter(t => t.ativo).forEach(t => {
      const campo = document.getElementById(`promo-${t.chave}-${id}`);
      if(!campo) return;
      const v = parseFloat(campo.value);
      if(!isNaN(v)) obj[t.chave] = v; else delete obj[t.chave];
    });
    return obj;
  } else {
    const v = parseFloat(document.getElementById(`promo-unico-${id}`).value);
    return isNaN(v) ? {} : { unico: v };
  }
}

async function moverProdutoOrdem(id, direcao){
  const p = produtos.find(x => x.id === id);
  if(!p) return;
  const itensCategoria = produtos.filter(x => x.category === p.category);
  const idx = itensCategoria.findIndex(x => x.id === id);
  const vizinho = itensCategoria[idx + direcao];
  if(!vizinho) return;

  // Normaliza: se algum produto da categoria nunca teve "ordem" definida (null),
  // preenche com a posição atual antes de trocar — assim funciona mesmo em
  // categorias onde ninguém nunca mexeu nesse campo.
  const semOrdem = itensCategoria.filter(item => item.sort_order === null || item.sort_order === undefined);
  if(semOrdem.length){
    await Promise.all(itensCategoria.map((item, i) => {
      if(item.sort_order === null || item.sort_order === undefined){
        item.sort_order = i;
        return supabaseClient.from('products').update({ sort_order: i }).eq('id', item.id);
      }
      return Promise.resolve();
    }));
  }

  const ordemAtual = p.sort_order, ordemVizinho = vizinho.sort_order;
  const [{ error: e1 }, { error: e2 }] = await Promise.all([
    supabaseClient.from('products').update({ sort_order: ordemVizinho }).eq('id', p.id),
    supabaseClient.from('products').update({ sort_order: ordemAtual }).eq('id', vizinho.id),
  ]);
  if(e1 || e2){
    alert('Não foi possível reordenar.\n\nErro: ' + ((e1||e2).message || JSON.stringify(e1||e2)));
    console.error(e1, e2);
    return;
  }
  p.sort_order = ordemVizinho;
  vizinho.sort_order = ordemAtual;
  produtos.sort((a,b) => {
    if(a.category !== b.category) return a.category < b.category ? -1 : 1;
    return (a.sort_order||0) - (b.sort_order||0);
  });
  renderGrade(p.category);
}

async function salvarProduto(id){
  const p = produtos.find(x => x.id === id);
  if(!p) return;
  const isPizza = p.category === 'pizza';
  const isCombo = p.category === 'combo';

  const ordemVal = document.getElementById(`ordem-${id}`).value;
  const payload = {
    name: document.getElementById(`nome-${id}`).value.trim(),
    prices: montarPrecos(id, isPizza),
    description: document.getElementById(`desc-${id}`).value.trim(),
    active: document.getElementById(`ativo-${id}`).checked,
    sort_order: ordemVal === '' ? null : parseInt(ordemVal, 10),
    promo_active: document.getElementById(`promo-ativa-${id}`).checked,
    promo_prices: montarPromoPrecos(id, isPizza),
    promo_label: document.getElementById(`promo-label-${id}`).value.trim(),
    stock_type: document.getElementById(`estoque-tipo-${id}`).value,
    stock_qty: document.getElementById(`estoque-tipo-${id}`).value === 'limitado'
      ? (parseInt(document.getElementById(`estoque-qtd-${id}`).value, 10) || 0)
      : null,
    stock_zero_behavior: document.getElementById(`estoque-zero-${id}`) ? document.getElementById(`estoque-zero-${id}`).value : 'esgotado',
  };
  if(isCombo){
    payload.needs_note = document.getElementById(`precisa-nota-${id}`).checked;
    payload.note_hint = document.getElementById(`nota-dica-${id}`).value.trim();
  }

  const { data, error } = await supabaseClient.from('products').update(payload).eq('id', id).select();
  const aviso = document.getElementById(`salvo-${id}`);
  if(error){
    alert('Não foi possível salvar.\n\nErro do Supabase: ' + (error.message || JSON.stringify(error)) +
      '\n\nVerifique se a tabela "products" tem uma política de UPDATE liberada pro role anon no Supabase.' +
      (error.message && error.message.includes('needs_note') ? '\n\nParece que faltam as colunas "needs_note" e "note_hint" na tabela products — veja as instruções que te passei.' : '') +
      (error.message && error.message.includes('stock_') ? '\n\nParece que faltam as colunas de estoque (stock_type, stock_qty, stock_zero_behavior) na tabela products — rode o SQL de estoque que te passei.' : ''));
    console.error(error);
    return;
  }
  if(!data || data.length === 0){
    alert('As alterações NÃO foram salvas (0 linhas afetadas).\n\nIsso geralmente significa que a sua sessão expirou ou que falta permissão de UPDATE para o seu usuário na tabela "products". Tente sair e entrar de novo no painel.');
    console.warn('Update de produto retornou 0 linhas.', { id, payload });
    return;
  }
  Object.assign(p, payload);
  aviso.textContent = '✅ Salvo!';
  document.getElementById(`card-${id}`).classList.toggle('inativo', !payload.active);
  setTimeout(() => { aviso.textContent = ''; }, 2000);
}

async function excluirProduto(id){
  const p = produtos.find(x => x.id === id);
  if(!p) return;
  if(!confirm(`Excluir "${p.name}" definitivamente? Não dá pra desfazer.`)) return;

  const { data, error } = await supabaseClient.from('products').delete().eq('id', id).select();
  if(error){
    alert('Não foi possível excluir.\n\nErro do Supabase: ' + (error.message || JSON.stringify(error)));
    console.error(error);
    return;
  }
  if(!data || data.length === 0){
    alert('A exclusão não teve efeito (0 linhas afetadas).\n\nIsso normalmente indica que falta uma política de DELETE liberada pro role anon na tabela "products" no Supabase.');
    return;
  }
  produtos = produtos.filter(x => x.id !== id);
  renderGrade(p.category);
}

async function adicionarProduto(catKey){
  const nome = prompt('Nome do novo item:');
  if(!nome || !nome.trim()) return;

  const payload = {
    category: catKey,
    name: nome.trim(),
    prices: catKey === 'pizza' ? { M:0, G:0, GG:0 } : { unico:0 },
    description: '',
    active: true,
    sort_order: 999,
    promo_active: false,
    promo_prices: {},
    promo_label: '',
  };
  if(catKey === 'combo'){
    payload.needs_note = false;
    payload.note_hint = '';
  }

  const { data, error } = await supabaseClient.from('products').insert(payload).select();
  if(error){
    alert('Não foi possível criar o produto.\n\nErro do Supabase: ' + (error.message || JSON.stringify(error)) +
      '\n\nVerifique se a tabela "products" tem uma política de INSERT liberada pro role anon no Supabase.' +
      (error.message && error.message.includes('needs_note') ? '\n\nParece que faltam as colunas "needs_note" e "note_hint" na tabela products — veja as instruções que te passei.' : ''));
    console.error(error);
    return;
  }
  produtos.push(data[0]);
  renderGrade(catKey);
}

/* ==================== COMPRESSÃO DE IMAGEM (economiza cota do Supabase) ====================
   Toda foto enviada pelo admin passa por aqui antes de subir: redimensiona pro tamanho
   máximo necessário na tela e recomprime em JPEG. Isso reduz o peso de cada imagem em até
   90%, o que corta muito o consumo de "saída em cache" do Supabase — cada visita ao
   cardápio baixa essas fotos, então o tamanho delas é multiplicado pelo número de visitas. */
function comprimirImagem(arquivo, larguraMax = 1280, qualidade = 0.82){
  return new Promise((resolve, reject) => {
    if(!arquivo.type || !arquivo.type.startsWith('image/')){ resolve(arquivo); return; }
    const leitor = new FileReader();
    leitor.onerror = () => resolve(arquivo); // se der qualquer problema, manda a original em vez de travar o upload
    leitor.onload = () => {
      const img = new Image();
      img.onerror = () => resolve(arquivo);
      img.onload = () => {
        let { width, height } = img;
        if(width > larguraMax){
          height = Math.round(height * (larguraMax / width));
          width = larguraMax;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => {
          if(!blob){ resolve(arquivo); return; }
          const novoNome = arquivo.name.replace(/\.[a-zA-Z0-9]+$/, '') + '.jpg';
          resolve(new File([blob], novoNome, { type:'image/jpeg' }));
        }, 'image/jpeg', qualidade);
      };
      img.src = leitor.result;
    };
    leitor.readAsDataURL(arquivo);
  });
}

async function uploadFoto(id, inputEl){
  const arquivoOriginal = inputEl.files[0];
  if(!arquivoOriginal) return;
  const p = produtos.find(x => x.id === id);
  if(!p) return;

  const imgEl = document.getElementById(`img-${id}`);
  const textoOriginal = imgEl.outerHTML;
  imgEl.outerHTML = `<div class="foto-vazia" id="img-${id}">Otimizando foto…</div>`;

  const arquivo = await comprimirImagem(arquivoOriginal);
  const imgEl2 = document.getElementById(`img-${id}`);
  if(imgEl2) imgEl2.textContent = 'Enviando…';

  const caminho = `${p.category}/${Date.now()}-${arquivo.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  const { error: erroUpload } = await supabaseClient.storage.from(STORAGE_BUCKET).upload(caminho, arquivo, { upsert:true, cacheControl:'31536000' });
  if(erroUpload){
    alert('Não foi possível enviar a foto.\n\nErro do Supabase: ' + (erroUpload.message || JSON.stringify(erroUpload)) +
      `\n\nVerifique se existe um bucket PÚBLICO chamado "${STORAGE_BUCKET}" no Storage do Supabase.`);
    console.error(erroUpload);
    document.getElementById(`img-${id}`).outerHTML = textoOriginal;
    return;
  }

  const { data: publicData } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(caminho);
  const url = publicData.publicUrl;

  const { data: dataUpdate, error: erroUpdate } = await supabaseClient.from('products').update({ image_url: url }).eq('id', id).select();
  if(erroUpdate){
    alert('A foto foi enviada, mas não consegui salvar o link no produto.\n\nErro: ' + (erroUpdate.message || JSON.stringify(erroUpdate)));
    console.error(erroUpdate);
    return;
  }
  if(!dataUpdate || dataUpdate.length === 0){
    alert('A foto foi enviada, mas o link NÃO foi salvo no produto (0 linhas afetadas). Tente sair e entrar de novo no painel.');
    console.warn('Update de image_url retornou 0 linhas.', { id });
    return;
  }

  p.image_url = url;
  document.getElementById(`img-${id}`).outerHTML = `<img src="${url}" id="img-${id}">`;
}

async function otimizarFotosExistentes(){
  if(!confirm('Isso vai baixar e recomprimir as fotos que já estão no site (produtos, capas e carrossel), sem mudar nenhum link. Pode levar alguns minutos dependendo de quantas fotos você tem. Continuar?')) return;

  const botao = document.getElementById('btn-otimizar-fotos');
  const status = document.getElementById('status-otimizar-fotos');
  const prefixoPublico = `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/`;

  // Busca direto do banco (não das variáveis capasSecoes/slidesCarrossel, que só
  // são preenchidas quando você abre aquelas abas — buscando aqui de novo, a
  // otimização pega tudo mesmo que você nunca tenha aberto Capas/Carrossel
  // nesta sessão).
  const [{ data: capasData }, { data: slidesData }] = await Promise.all([
    supabaseClient.from('secoes_capas').select('imagem_url'),
    supabaseClient.from('carrossel_slides').select('imagem_url')
  ]);

  const urls = [];
  produtos.forEach(p => { if(p.image_url) urls.push(p.image_url); });
  (capasData || []).forEach(c => { if(c.imagem_url) urls.push(c.imagem_url); });
  (slidesData || []).forEach(s => { if(s.imagem_url) urls.push(s.imagem_url); });

  const alvos = [...new Set(urls)].filter(u => u.startsWith(prefixoPublico));
  if(alvos.length === 0){
    status.textContent = 'Não encontrei fotos suas nesse bucket pra otimizar.';
    return;
  }

  botao.disabled = true;
  let ok = 0, falha = 0;
  for(let i = 0; i < alvos.length; i++){
    const url = alvos[i];
    status.textContent = `Otimizando foto ${i+1} de ${alvos.length}…`;
    try{
      const caminho = decodeURIComponent(url.slice(prefixoPublico.length).split('?')[0]);
      const resp = await fetch(url);
      if(!resp.ok) throw new Error('não consegui baixar a foto original');
      const blob = await resp.blob();
      const nomeArquivo = caminho.split('/').pop() || 'foto.jpg';
      const arquivoOriginal = new File([blob], nomeArquivo, { type: blob.type || 'image/jpeg' });
      const larguraMax = (caminho.startsWith('capas/') || caminho.startsWith('carrossel/')) ? 1600 : 1280;
      const comprimido = await comprimirImagem(arquivoOriginal, larguraMax);
      const { error } = await supabaseClient.storage.from(STORAGE_BUCKET)
        .upload(caminho, comprimido, { upsert:true, cacheControl:'31536000', contentType:'image/jpeg' });
      if(error) throw error;
      ok++;
    } catch(e){
      console.error('Falha ao otimizar', url, e);
      falha++;
    }
  }
  botao.disabled = false;
  status.textContent = `Concluído: ${ok} foto(s) otimizada(s)${falha ? `, ${falha} com erro (veja o console)` : ''}. Como o nome do arquivo não mudou, pode levar um tempinho pro cache do navegador/CDN atualizar a versão nova.`;
}

async function uploadCapaSecao(categoria, inputEl){
  const arquivoOriginal = inputEl.files[0];
  if(!arquivoOriginal) return;

  const imgEl = document.getElementById(`img-capa-${categoria}`);
  const textoOriginal = imgEl.outerHTML;
  imgEl.outerHTML = `<div class="foto-vazia" id="img-capa-${categoria}">Otimizando foto…</div>`;

  const arquivo = await comprimirImagem(arquivoOriginal, 1600);
  const imgEl2 = document.getElementById(`img-capa-${categoria}`);
  if(imgEl2) imgEl2.textContent = 'Enviando…';

  const caminho = `capas/${categoria}-${Date.now()}-${arquivo.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  const { error: erroUpload } = await supabaseClient.storage.from(STORAGE_BUCKET).upload(caminho, arquivo, { upsert:true, cacheControl:'31536000' });
  if(erroUpload){
    alert('Não foi possível enviar a foto.\n\nErro do Supabase: ' + (erroUpload.message || JSON.stringify(erroUpload)) +
      `\n\nVerifique se existe um bucket PÚBLICO chamado "${STORAGE_BUCKET}" no Storage do Supabase.`);
    console.error(erroUpload);
    document.getElementById(`img-capa-${categoria}`).outerHTML = textoOriginal;
    return;
  }

  const { data: publicData } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(caminho);
  const url = publicData.publicUrl;

  const { data, error } = await supabaseClient.from('secoes_capas')
    .upsert({ categoria, imagem_url: url, atualizado_em: new Date().toISOString() }, { onConflict: 'categoria' })
    .select();
  if(error){
    alert('A foto foi enviada, mas não consegui salvar.\n\nErro do Supabase: ' + (error.message || JSON.stringify(error)) +
      '\n\nVerifique se a tabela "secoes_capas" tem política de INSERT/UPDATE liberada pro seu usuário no Supabase.');
    console.error(error);
    document.getElementById(`img-capa-${categoria}`).outerHTML = textoOriginal;
    return;
  }
  if(!data || data.length === 0){
    alert('A foto foi enviada, mas NÃO foi salva no banco (0 linhas afetadas). Verifique sua sessão/permissão — tente sair e entrar de novo no painel.');
    document.getElementById(`img-capa-${categoria}`).outerHTML = textoOriginal;
    return;
  }

  capasSecoes[categoria] = data[0];
  document.getElementById(`img-capa-${categoria}`).outerHTML = `<img src="${url}" id="img-capa-${categoria}">`;
}

function parseMoneyBRAdmin(s){
  if(!s) return null;
  const limpo = String(s).trim().replace(/\./g,'').replace(',', '.');
  const v = parseFloat(limpo);
  return isNaN(v) ? null : v;
}

// A regra de faturamento é sempre extrair "💰 TOTAL A COBRAR: R$ X" do texto da
// comanda — tem prioridade sobre a coluna "total", que pode ficar desatualizada
// em pedidos editados manualmente.
function extrairTotalCobrar(texto){
  if(!texto) return null;
  const m = texto.match(/TOTAL A COBRAR:\s*R\$\s*([\d.,]+)/i);
  if(!m) return null;
  return parseMoneyBRAdmin(m[1]);
}

// Usa o campo estruturado "itens" quando existir (pedidos novos, salvos a partir
// da Etapa 2). Pedidos antigos não têm esse campo — nesse caso, interpreta o
// texto da comanda (aproximado, mas cobre a maioria dos casos).
function extrairItensPedido(pedido){
  if(pedido.itens && Array.isArray(pedido.itens) && pedido.itens.length > 0) return pedido.itens;
  return interpretarTextoComanda(pedido.texto_comanda || '');
}

function interpretarTextoComanda(texto){
  const linhas = texto.split('\n');
  const itens = [];
  for(let i=0; i<linhas.length; i++){
    const linha = linhas[i].trim();
    let m;
    if((m = linha.match(/^🍕\s*(\d+)x\s*Pizza\s*(\w+)/))){
      const qty = parseInt(m[1],10);
      const sabores = [];
      let borda = null;
      let j = i+1;
      while(j < linhas.length && /^🔸/.test(linhas[j].trim())){
        const fm = linhas[j].trim().match(/^🔸(?:\[\d+\/\d+\]\s*)?(.+)/);
        if(fm) sabores.push(fm[1].trim());
        j++;
      }
      if(j < linhas.length && /^🧀 Borda Recheada:/.test(linhas[j].trim())){
        borda = linhas[j].trim().replace(/^🧀 Borda Recheada:\s*/,'').trim();
      }
      itens.push({ categoria:'pizza', nome:'Pizza', sabores, tamanho:m[2], borda, quantidade:qty });
      i = j - 1;
      continue;
    }
    if((m = linha.match(/^🥙\s*(\d+)x/))){
      const sabores = {};
      let j = i+1;
      while(j < linhas.length && /^🔸/.test(linhas[j].trim())){
        const fm = linhas[j].trim().match(/^🔸(\d+)x\s*(.+)/);
        if(fm) sabores[fm[2].trim()] = (sabores[fm[2].trim()] || 0) + parseInt(fm[1],10);
        j++;
      }
      const totalUnidades = Object.values(sabores).reduce((a,b)=>a+b,0);
      itens.push({ categoria:'esfiha', nome:'Combo de Esfihas', sabores, quantidade: totalUnidades || parseInt(m[1],10) });
      i = j - 1;
      continue;
    }
    if((m = linha.match(/^🥟\s*(\d+)x\s*Calzone\s*(.+)/))){
      itens.push({ categoria:'calzone', nome:'Calzone', sabor:m[2].trim(), quantidade:parseInt(m[1],10) });
      continue;
    }
    if((m = linha.match(/^🍩\s*(\d+)x\s*Brotinho Doce\s*-\s*(.+)/))){
      itens.push({ categoria:'brotinho', nome:'Brotinho Doce', sabor:m[2].trim(), quantidade:parseInt(m[1],10) });
      continue;
    }
    if((m = linha.match(/^🥤\s*(\d+)x\s*(.+)/))){
      itens.push({ categoria:'bebida', nome:m[2].trim(), quantidade:parseInt(m[1],10) });
      continue;
    }
    if((m = linha.match(/^🍽️\s*(\d+)x\s*(.+)/))){
      itens.push({ categoria:'combo', nome:m[2].trim(), quantidade:parseInt(m[1],10) });
      continue;
    }
  }
  return itens;
}

function dataDoPedidoNoPeriodo(createdAt, periodo){
  const d = new Date(createdAt);
  const agora = new Date();
  if(periodo === 'hoje') return d.toDateString() === agora.toDateString();
  if(periodo === 'semana'){
    const inicioSemana = new Date(agora);
    inicioSemana.setDate(agora.getDate() - agora.getDay());
    inicioSemana.setHours(0,0,0,0);
    return d >= inicioSemana;
  }
  if(periodo === 'mes') return d.getFullYear() === agora.getFullYear() && d.getMonth() === agora.getMonth();
  if(periodo === 'custom'){
    if(!statsDataIni || !statsDataFim) return true;
    const ini = new Date(statsDataIni + 'T00:00:00');
    const fim = new Date(statsDataFim + 'T23:59:59');
    return d >= ini && d <= fim;
  }
  return true; // 'tudo'
}

// Extrai informações extras do pedido a partir do texto da comanda: se é
// entrega ou retirada, qual foi a forma de pagamento, e se os itens vieram
// estruturados (exato) ou foram interpretados do texto (aproximado).
// Formas de pagamento chegam com nomes diferentes dependendo de quem fez o pedido
// (index.html usa PIX/Débito/Crédito, comandas.html usa Pix/Cartão de Débito/Cartão de Crédito).
// Padroniza pra um único rótulo, senão a análise conta como formas de pagamento distintas.
function normalizarPagamento(raw){
  if(!raw) return raw;
  const s = raw.trim().toLowerCase();
  if(s === 'pix') return 'Pix';
  if(s.includes('débito') || s.includes('debito')) return 'Cartão de Débito';
  if(s.includes('crédito') || s.includes('credito')) return 'Cartão de Crédito';
  if(s === 'dinheiro') return 'Dinheiro';
  return raw.trim();
}

// Nomes de sabor/produto (esfiha, pizza, bebida, calzone) variam de digitação
// (ex.: "carne de sol" vs "Carne de Sol") e isso fragmentava o ranking em
// entradas separadas. Padroniza em Título Caso antes de usar como chave.
function normalizarNomeProduto(raw){
  return (raw||'').replace(/\s+/g,' ').trim().toLowerCase()
    .replace(/(^|\s|-)\S/g, c => c.toUpperCase());
}

function extrairMetaPedido(pedido){
  const texto = pedido.texto_comanda || '';
  const exato = !!(pedido.itens && Array.isArray(pedido.itens) && pedido.itens.length > 0);
  let entrega = null;
  if(/RETIRADA NO BALC[ÃA]O/i.test(texto)) entrega = 'retirada';
  else if(/📍\s*Endereço:/.test(texto)) entrega = 'entrega';
  let pagamento = null;
  const mPag = texto.match(/💳\s*Pagamento:\s*(.+)/);
  if(mPag) pagamento = normalizarPagamento(mPag[1].trim());
  let cliente = null;
  const mCliente = texto.match(/👤\s*Cliente:\s*(.+)/);
  if(mCliente) cliente = mCliente[1].trim();
  let telefone = null;
  const mTelefone = texto.match(/📞\s*Telefone:\s*(.+)/);
  if(mTelefone) telefone = mTelefone[1].trim();
  const totalExtraido = extrairTotalCobrar(texto);
  let minutosPreparo = null;
  if(pedido.impresso_em && pedido.finalizado_em){
    let inicioPreparo = new Date(pedido.impresso_em);
    // Encomenda antecipada: o cliente pediu antes de abrir (ex.: 15h pra um funcionamento
    // que começa às 18h). A cozinha só pode começar a preparar na abertura, então o tempo
    // de preparo conta a partir da abertura do dia — não do horário em que o pedido chegou —
    // senão essa espera "de fora do horário" infla a média de tempo de preparo.
    if(/ENCOMENDA ANTECIPADA/i.test(texto)){
      const diaSemana = new Date(pedido.created_at).getDay();
      const horaAbertura = horarioDoDia(diaSemana).hora_abertura;
      if(horaAbertura){
        const [h, m] = horaAbertura.split(':').map(Number);
        const abertura = new Date(pedido.created_at);
        abertura.setHours(h, m || 0, 0, 0);
        if(abertura > inicioPreparo) inicioPreparo = abertura;
      }
    }
    minutosPreparo = (new Date(pedido.finalizado_em) - inicioPreparo) / 60000;
    if(minutosPreparo < 0) minutosPreparo = null; // dado inconsistente, ignora
  }
  return { exato, entrega, pagamento, cliente, telefone, minutosPreparo, total: totalExtraido !== null ? totalExtraido : (pedido.total || 0) };
}

function calcularEstatisticas(pedidosFiltrados){
  let faturamento = 0;
  let unidadesVendidas = 0;
  let pedidosExatos = 0;
  let pedidosAproximados = 0;
  const produtosRanking = {};       // ranking geral, com categoria no nome pra não confundir sabores repetidos
  const pizzaSabores = {};
  const pizzaTamanhos = {};
  const esfihaSabores = {};
  const bebidaRanking = {};
  const calzoneRanking = {};
  const entregaRanking = { entrega:0, retirada:0, 'não identificado':0 };
  const pagamentoContagem = {};     // forma de pagamento -> nº de pedidos
  const pagamentoValor = {};        // forma de pagamento -> R$ total
  const faturamentoPorDia = {};     // 'YYYY-MM-DD' -> valor
  const pedidosPorHora = {};        // 0..23 -> nº de pedidos
  const faturamentoPorDiaSemana = {};   // 'Domingo'..'Sábado' -> valor
  const pedidosPorDiaSemana = {};       // 'Domingo'..'Sábado' -> nº de pedidos
  const listaPedidos = []; // usada na tabela de pedidos do período
  const NOMES_DIA_SEMANA = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const clientesRanking = {}; // telefone -> { nome, pedidos, total }
  let somaMinutosPreparo = 0;
  let countComTempoPreparo = 0;

  let totalEntregaR$ = 0, countEntrega = 0, totalRetiradaR$ = 0, countRetirada = 0;

  pedidosFiltrados.forEach(p => {
    const meta = extrairMetaPedido(p);
    faturamento += meta.total;
    meta.exato ? pedidosExatos++ : pedidosAproximados++;

    entregaRanking[meta.entrega || 'não identificado']++;
    if(meta.entrega === 'entrega'){ totalEntregaR$ += meta.total; countEntrega++; }
    else if(meta.entrega === 'retirada'){ totalRetiradaR$ += meta.total; countRetirada++; }

    if(meta.pagamento){
      pagamentoContagem[meta.pagamento] = (pagamentoContagem[meta.pagamento]||0) + 1;
      pagamentoValor[meta.pagamento] = (pagamentoValor[meta.pagamento]||0) + meta.total;
    }

    const d = new Date(p.created_at);
    // Usa data local (mesmo fuso que d.getHours()/d.getDay() já usam abaixo) em vez de
    // d.toISOString(), que é UTC e jogava pedidos feitos a partir das 21h pro dia seguinte.
    const diaKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    faturamentoPorDia[diaKey] = (faturamentoPorDia[diaKey]||0) + meta.total;

    const hora = d.getHours();
    pedidosPorHora[hora] = (pedidosPorHora[hora]||0) + 1;

    const nomeDiaSemana = NOMES_DIA_SEMANA[d.getDay()];
    faturamentoPorDiaSemana[nomeDiaSemana] = (faturamentoPorDiaSemana[nomeDiaSemana]||0) + meta.total;
    pedidosPorDiaSemana[nomeDiaSemana] = (pedidosPorDiaSemana[nomeDiaSemana]||0) + 1;

    listaPedidos.push({
      created_at: p.created_at,
      total: meta.total,
      entrega: meta.entrega,
      pagamento: meta.pagamento,
      cliente: meta.cliente,
      telefone: meta.telefone,
      minutosPreparo: meta.minutosPreparo,
      exato: meta.exato
    });

    if(meta.minutosPreparo !== null){
      somaMinutosPreparo += meta.minutosPreparo;
      countComTempoPreparo++;
    }

    if(meta.telefone){
      if(!clientesRanking[meta.telefone]) clientesRanking[meta.telefone] = { nome: meta.cliente || meta.telefone, pedidos: 0, total: 0, nomesDistintos: new Set() };
      clientesRanking[meta.telefone].pedidos++;
      clientesRanking[meta.telefone].total += meta.total;
      if(meta.cliente){
        clientesRanking[meta.telefone].nome = meta.cliente; // usa o nome mais recente pra exibir
        clientesRanking[meta.telefone].nomesDistintos.add(meta.cliente);
      }
    }

    extrairItensPedido(p).forEach(item => {
      const qty = item.quantidade || 1;
      if(item.categoria === 'pizza'){
        unidadesVendidas += qty;
        (item.sabores || []).forEach(s => {
          const sNorm = normalizarNomeProduto(s);
          pizzaSabores[sNorm] = (pizzaSabores[sNorm]||0) + qty;
          produtosRanking[`${sNorm} (Pizza)`] = (produtosRanking[`${sNorm} (Pizza)`]||0) + qty;
        });
        if(item.tamanho) pizzaTamanhos[item.tamanho] = (pizzaTamanhos[item.tamanho]||0) + qty;
      } else if(item.categoria === 'esfiha'){
        const sabores = item.sabores || {};
        Object.keys(sabores).forEach(s => {
          const q = sabores[s];
          const sNorm = normalizarNomeProduto(s);
          esfihaSabores[sNorm] = (esfihaSabores[sNorm]||0) + q;
          produtosRanking[`${sNorm} (Esfiha)`] = (produtosRanking[`${sNorm} (Esfiha)`]||0) + q;
          unidadesVendidas += q;
        });
      } else if(item.categoria === 'bebida'){
        const nomeNorm = normalizarNomeProduto(item.nome);
        bebidaRanking[nomeNorm] = (bebidaRanking[nomeNorm]||0) + qty;
        produtosRanking[`${nomeNorm} (Bebida)`] = (produtosRanking[`${nomeNorm} (Bebida)`]||0) + qty;
        unidadesVendidas += qty;
      } else if(item.categoria === 'calzone'){
        const saborNorm = normalizarNomeProduto(item.sabor);
        calzoneRanking[saborNorm] = (calzoneRanking[saborNorm]||0) + qty;
        produtosRanking[`${saborNorm} (Calzone)`] = (produtosRanking[`${saborNorm} (Calzone)`]||0) + qty;
        unidadesVendidas += qty;
      } else {
        const nome = normalizarNomeProduto(item.nome || 'Item');
        const categoriaLabel = item.categoria ? ` (${item.categoria[0].toUpperCase()}${item.categoria.slice(1)})` : '';
        produtosRanking[`${nome}${categoriaLabel}`] = (produtosRanking[`${nome}${categoriaLabel}`]||0) + qty;
        unidadesVendidas += qty;
      }
    });
  });

  listaPedidos.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

  return {
    faturamento,
    numPedidos: pedidosFiltrados.length,
    pedidosExatos, pedidosAproximados,
    ticketMedio: pedidosFiltrados.length ? faturamento / pedidosFiltrados.length : 0,
    ticketMedioEntrega: countEntrega ? totalEntregaR$ / countEntrega : 0,
    ticketMedioRetirada: countRetirada ? totalRetiradaR$ / countRetirada : 0,
    tempoMedioPreparo: countComTempoPreparo ? somaMinutosPreparo / countComTempoPreparo : null,
    countComTempoPreparo,
    unidadesVendidas,
    produtosRanking, pizzaSabores, pizzaTamanhos, esfihaSabores, bebidaRanking, calzoneRanking,
    entregaRanking, pagamentoContagem, pagamentoValor, faturamentoPorDia, pedidosPorHora,
    faturamentoPorDiaSemana, pedidosPorDiaSemana, listaPedidos, clientesRanking
  };
}

function rankingHTML(obj, limite){
  limite = limite || 8;
  const entradas = Object.entries(obj).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]).slice(0, limite);
  if(entradas.length === 0) return '<p class="stat-empty">Sem dados nesse período.</p>';
  return '<ol class="stat-ranking-list">' + entradas.map(([nome,qty]) => `<li><span>${nome}</span><b>${qty}</b></li>`).join('') + '</ol>';
}

// Gráfico de barras simples (sem lib externa) do faturamento por dia, dentro do período filtrado.
function graficoFaturamentoPorDiaHTML(porDia){
  const dias = Object.keys(porDia).sort();
  if(dias.length === 0) return '<p class="stat-empty">Sem dados nesse período.</p>';
  const max = Math.max(...dias.map(d => porDia[d]), 1);
  const barras = dias.map(d => {
    const valor = porDia[d];
    const alturaPct = Math.max(4, Math.round((valor / max) * 100));
    const [ano,mes,dia] = d.split('-');
    return `
      <div class="stat-bar-col" title="${dia}/${mes}: ${brlAdmin(valor)}">
        <div class="stat-bar" style="height:${alturaPct}%"></div>
        <span class="stat-bar-label">${dia}/${mes}</span>
      </div>`;
  }).join('');
  return `<div class="stat-bar-chart">${barras}</div>`;
}

// Gráfico de barras por hora do dia (0h-23h), pra enxergar o horário de pico dos pedidos.
function graficoPorHoraHTML(porHora){
  const horasComPedido = Object.keys(porHora).map(Number);
  if(horasComPedido.length === 0) return '<p class="stat-empty">Sem dados nesse período.</p>';
  const max = Math.max(...horasComPedido.map(h => porHora[h]), 1);
  const barras = [];
  for(let h = 0; h < 24; h++){
    const valor = porHora[h] || 0;
    const alturaPct = valor > 0 ? Math.max(4, Math.round((valor / max) * 100)) : 2;
    barras.push(`
      <div class="stat-bar-col" title="${h}h: ${valor} pedido${valor===1?'':'s'}">
        <div class="stat-bar" style="height:${alturaPct}%; ${valor===0?'opacity:.25;':''}"></div>
        <span class="stat-bar-label">${h}h</span>
      </div>`);
  }
  return `<div class="stat-bar-chart">${barras.join('')}</div>`;
}

// Calcula os limites de data do período atualmente selecionado (pra poder buscar o
// período anterior equivalente). Retorna null pra "todo o período" — não faz
// sentido comparar "tudo" com um "período anterior".
function limitesPeriodoAtual(periodo){
  const agora = new Date();
  if(periodo === 'hoje'){
    const ini = new Date(agora); ini.setHours(0,0,0,0);
    const fim = new Date(agora); fim.setHours(23,59,59,999);
    return { ini, fim };
  }
  if(periodo === 'semana'){
    const ini = new Date(agora); ini.setDate(agora.getDate() - agora.getDay()); ini.setHours(0,0,0,0);
    const fim = new Date(ini); fim.setDate(ini.getDate() + 6); fim.setHours(23,59,59,999);
    return { ini, fim };
  }
  if(periodo === 'mes'){
    const ini = new Date(agora.getFullYear(), agora.getMonth(), 1, 0,0,0,0);
    const fim = new Date(agora.getFullYear(), agora.getMonth()+1, 0, 23,59,59,999);
    return { ini, fim };
  }
  if(periodo === 'custom' && statsDataIni && statsDataFim){
    return { ini: new Date(statsDataIni + 'T00:00:00'), fim: new Date(statsDataFim + 'T23:59:59') };
  }
  return null;
}
function limitesPeriodoAnterior(periodo){
  const atual = limitesPeriodoAtual(periodo);
  if(!atual) return null;
  const duracaoMs = atual.fim.getTime() - atual.ini.getTime() + 1;
  const fimAnterior = new Date(atual.ini.getTime() - 1);
  const iniAnterior = new Date(atual.ini.getTime() - duracaoMs);
  return { ini: iniAnterior, fim: fimAnterior };
}
function faturamentoNoIntervalo(pedidos, ini, fim){
  let total = 0;
  pedidos.forEach(p => {
    const d = new Date(p.created_at);
    if(d >= ini && d <= fim) total += extrairMetaPedido(p).total;
  });
  return total;
}
function comparativoFaturamentoHTML(todosOsPedidos, faturamentoAtual, periodo){
  const limitesAnt = limitesPeriodoAnterior(periodo);
  if(!limitesAnt) return '';
  const fatAnterior = faturamentoNoIntervalo(todosOsPedidos, limitesAnt.ini, limitesAnt.fim);
  if(fatAnterior === 0){
    return faturamentoAtual > 0 ? '<span class="stat-comparativo up">▲ sem vendas no período anterior pra comparar</span>' : '';
  }
  const variacao = ((faturamentoAtual - fatAnterior) / fatAnterior) * 100;
  const subiu = variacao >= 0;
  return `<span class="stat-comparativo ${subiu?'up':'down'}">${subiu?'▲':'▼'} ${Math.abs(variacao).toFixed(0)}% vs período anterior</span>`;
}

function formatarMinutos(min){
  if(min === null || min === undefined) return '—';
  const h = Math.floor(min / 60);
  const m = Math.round(min % 60);
  return h > 0 ? `${h}h${String(m).padStart(2,'0')}` : `${m} min`;
}

// Um telefone que aparece em MUITOS pedidos com nomes de cliente diferentes entre si
// não é "um cliente fiel" — é provavelmente o celular/computador do atendente sendo
// reutilizado pra digitar pedidos manuais de vários clientes diferentes (presenciais,
// por telefone, etc). Sinaliza isso separadamente pra não confundir fidelização de
// verdade com esse uso operacional do número.
const LIMITE_PEDIDOS_SUSPEITO = 8;
const LIMITE_NOMES_DISTINTOS_SUSPEITO = 3;

function ehTelefoneDeAtendente(c){
  return c.pedidos > LIMITE_PEDIDOS_SUSPEITO && c.nomesDistintos.size >= LIMITE_NOMES_DISTINTOS_SUSPEITO;
}

function clientesRankingHTML(clientes){
  const todos = Object.values(clientes);
  const fieis = todos.filter(c => !ehTelefoneDeAtendente(c)).sort((a,b) => b.total - a.total).slice(0, 10);
  const atendente = todos.filter(ehTelefoneDeAtendente).sort((a,b) => b.pedidos - a.pedidos);

  const tabelaFieis = fieis.length === 0
    ? '<p class="stat-empty">Nenhum telefone identificado no texto das comandas desse período.</p>'
    : `<div style="overflow-x:auto;">
        <table class="stat-tabela">
          <thead><tr><th>Cliente</th><th style="text-align:center;">Pedidos</th><th style="text-align:right;">Total gasto</th></tr></thead>
          <tbody>${fieis.map(c => `<tr><td>${c.nome}</td><td style="text-align:center;">${c.pedidos}</td><td style="text-align:right;">${brlAdmin(c.total)}</td></tr>`).join('')}</tbody>
        </table>
      </div>`;

  const tabelaAtendente = atendente.length === 0 ? '' : `
    <div style="margin-top:16px;">
      <p class="stat-sub" style="display:block; margin-bottom:6px;">📱 Esses telefones apareceram em mais de ${LIMITE_PEDIDOS_SUSPEITO} pedidos com ${LIMITE_NOMES_DISTINTOS_SUSPEITO}+ nomes de cliente diferentes — provavelmente é o celular/computador de quem atende, usado pra digitar pedido manual de vários clientes distintos (não é fidelização de verdade). Foram excluídos do ranking de clientes fiéis acima.</p>
      <div style="overflow-x:auto;">
        <table class="stat-tabela">
          <thead><tr><th>Telefone</th><th style="text-align:center;">Pedidos</th><th style="text-align:center;">Nomes diferentes usados</th><th style="text-align:right;">Total</th></tr></thead>
          <tbody>${atendente.map(c => `<tr><td>📱 ${Object.keys(clientes).find(k=>clientes[k]===c) || ''}</td><td style="text-align:center;">${c.pedidos}</td><td style="text-align:center;">${c.nomesDistintos.size}</td><td style="text-align:right;">${brlAdmin(c.total)}</td></tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`;

  return tabelaFieis + tabelaAtendente;
}

function tabelaPedidosHTML(lista){
  if(lista.length === 0) return '<p class="stat-empty">Sem pedidos nesse período.</p>';
  const LIMITE_LINHAS = 100;
  const mostrar = lista.slice(0, LIMITE_LINHAS);
  const linhas = mostrar.map(p => {
    const data = new Date(p.created_at);
    const dataStr = data.toLocaleDateString('pt-BR');
    const horaStr = data.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    const tipo = p.entrega === 'retirada' ? '🏠 Retirada' : p.entrega === 'entrega' ? '🛵 Entrega' : '—';
    const precisao = p.exato
      ? '<span class="stat-badge exato">🟢 Exato</span>'
      : '<span class="stat-badge aproximado">🟡 Aproximado</span>';
    return `<tr>
      <td>${dataStr} ${horaStr}</td>
      <td>${p.cliente || '—'}</td>
      <td>${tipo}</td>
      <td>${p.pagamento || '—'}</td>
      <td style="text-align:right;">${brlAdmin(p.total)}</td>
      <td style="text-align:center;">${formatarMinutos(p.minutosPreparo)}</td>
      <td>${precisao}</td>
    </tr>`;
  }).join('');
  const aviso = lista.length > LIMITE_LINHAS
    ? `<p class="stat-empty" style="margin-top:6px;">Mostrando os ${LIMITE_LINHAS} pedidos mais recentes de ${lista.length} no período.</p>`
    : '';
  return `
    <div style="overflow-x:auto;">
      <table class="stat-tabela">
        <thead><tr><th>Data/Hora</th><th>Cliente</th><th>Tipo</th><th>Pagamento</th><th style="text-align:right;">Total</th><th style="text-align:center;">Preparo</th><th>Dado</th></tr></thead>
        <tbody>${linhas}</tbody>
      </table>
    </div>
    ${aviso}
  `;
}

let avaliacoesCache = [];
let avalPeriodo = 'tudo';       // hoje | semana | mes | tudo | custom
let avalDataIni = '', avalDataFim = '';
let avalEstrela = 'todas';      // todas | 5 | 4 | 3 | 2 | 1
let avalComentario = 'todas';   // todas | com | sem
let avalOrdenar = 'recentes';   // recentes | maior | menor

function dataAvaliacaoNoPeriodo(dataStr, periodo){
  if(!dataStr) return periodo === 'tudo';
  const d = new Date(dataStr);
  const agora = new Date();
  if(periodo === 'hoje') return d.toDateString() === agora.toDateString();
  if(periodo === 'semana'){
    const inicioSemana = new Date(agora);
    inicioSemana.setDate(agora.getDate() - agora.getDay());
    inicioSemana.setHours(0,0,0,0);
    return d >= inicioSemana;
  }
  if(periodo === 'mes') return d.getFullYear() === agora.getFullYear() && d.getMonth() === agora.getMonth();
  if(periodo === 'custom'){
    if(!avalDataIni || !avalDataFim) return true;
    const ini = new Date(avalDataIni + 'T00:00:00');
    const fim = new Date(avalDataFim + 'T23:59:59');
    return d >= ini && d <= fim;
  }
  return true; // 'tudo'
}
function dataDaAvaliacao(a){ return a.created_at || a.criado_em || a.data || a.avaliado_em || null; }
