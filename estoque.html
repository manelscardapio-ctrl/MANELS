<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estoque — Manel's Pizzaria</title>
<style>
:root{--cream:#faf4e8;--forest:#1f4d3a;--rust:#b5452a;--gold:#c9962b;--ink:#2a2a26;--line:#e4d9c3}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--ink)}
header{background:var(--forest);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0}h2{margin:0 0 8px;font-size:18px}h3{margin:14px 0 6px;font-size:15px}
.badge{font-size:12px;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:99px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);padding:6px 12px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--gold);border-color:var(--gold);color:#1a1a1a;font-weight:600}
main{max-width:1100px;margin:16px auto;padding:0 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.row label{display:flex;flex-direction:column;font-size:12px;gap:3px;flex:1;min-width:140px}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:0}
button.p,button.s{font:inherit;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.p{background:var(--rust);color:#fff;font-weight:600}button.s{background:#efe6d2;color:var(--ink)}
.ln{display:grid;grid-template-columns:2fr 1fr 1.6fr 1.2fr auto;gap:8px;align-items:center;margin-bottom:8px}
.ln small{grid-column:1/5;color:#6b6b60;margin-top:-4px}.x{background:none;border:0;color:var(--rust);cursor:pointer;font-size:16px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:#6b6b60}td.n,th.n{text-align:right}tr.low td{background:#fdeae4}
td input,td select{width:100%}.muted{color:#6b6b60;font-size:13px}.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.kpi{background:#faf4e8;border-radius:10px;padding:8px 14px}.kpi b{display:block;font-size:18px}.tot{display:flex;gap:14px;align-items:center;justify-content:flex-end}
details{border-bottom:1px solid var(--line);padding:6px 0}summary{cursor:pointer;display:flex;gap:10px;justify-content:space-between}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:8px;display:none}
dialog{border:0;border-radius:12px}dialog form{display:flex;flex-direction:column;gap:8px;min-width:260px}.err{color:var(--rust);margin:0}
@media(max-width:700px){.ln{grid-template-columns:1fr 1fr}.ln small{grid-column:1/3}}
</style></head><body>

 async init(){
  if(SUPABASE_URL&&window.supabase){sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
   const{data:{session}}=await sb.auth.getSession();if(!session)await login();
   for(const t of T){const{data,error}=await sb.from(t).select('*').limit(20000);if(error)throw error;db[t]=data}
   db.est_ingredientes.forEach(i=>delete i.custo_unit);
  }else db=JSON.parse(localStorage[LS]||'null')||structuredClone(SEED)},
 async put(t,rows){rows=[].concat(rows);
  if(sb){const{error}=await sb.from(t).upsert(rows);if(error){toast('Erro: '+error.message);throw error}}
  for(const r of rows){const k=db[t].findIndex(x=>x.id===r.id);k<0?db[t].push(r):db[t][k]=r}
  if(!sb)localStorage[LS]=JSON.stringify(db)}
};
function login(){return new Promise(res=>{const d=$('#login');d.showModal();$('#lgf').onsubmit=async e=>{e.preventDefault();
 const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});
 if(error)$('#lger').textContent=error.message;else{d.close();res()}}})}

/* ===== Compra ===== */
let C={data:today(),local:'',obs:''},L=[];
const addLine=()=>{L.push({ing:null,q:'',u:'',v:''});drawLines()};
function baseQ(l){const i=ING(l.ing);if(!i||l.q==='')return 0;const o=unitOpts(i).find(o=>o[0]===l.u);return +l.q*(o?o[1]:1)}
function setIng(n,name){const i=db.est_ingredientes.find(x=>x.controla_estoque&&x.nome.toLowerCase()===name.trim().toLowerCase());
 if(!i){toast('Ingrediente não cadastrado — cadastre na aba Ingredientes');L[n].ing=null}else{L[n].ing=i.id;L[n].u=unitOpts(i)[0][0]}drawLines()}
function drawLines(){const el=$('#lines');if(!el)return;if(!L.length)L.push({ing:null,q:'',u:'',v:''});
 el.innerHTML=L.map((l,n)=>{const i=ING(l.ing);return `<div class="ln">
 <input list="dl" placeholder="Ingrediente" value="${i?esc(i.nome):''}" onchange="setIng(${n},this.value)">
 <input type="number" step="any" min="0" placeholder="Qtd" value="${l.q}" oninput="L[${n}].q=this.value;hint()">
 <select onchange="L[${n}].u=this.value;hint()">${i?optHtml(unitOpts(i),l.u):''}</select>
 <input type="number" step="0.01" min="0" placeholder="Valor total R$" value="${l.v}" oninput="L[${n}].v=this.value;hint()">
 <button class="x" title="Remover" onclick="L.splice(${n},1);drawLines()">✕</button><small id="h${n}"></small></div>`}).join('');hint()}
function hint(){let t=0;L.forEach((l,n)=>{const i=ING(l.ing),b=baseQ(l),e=$('#h'+n);t+=+l.v||0;
 if(e)e.textContent=b&&l.v!==''?`= ${fmtQ(b,i.unidade)} · ${brl(l.v/b*(i.unidade==='unid'?1:1000))}/${i.unidade==='unid'?'un':i.unidade==='g'?'kg':'L'}`:''});$('#tot').textContent=brl(t)}
async function saveCompra(){
 const ls=L.filter(l=>l.ing&&baseQ(l)>0&&l.v!=='');if(!ls.length)return toast('Adicione ao menos um item completo (ingrediente, qtd e valor)');
 const c={id:uid(),data:C.data||today(),local:C.local.trim(),obs:C.obs.trim(),total:ls.reduce((a,l)=>a+ +l.v,0)},now=new Date().toISOString();
 await store.put('est_compras',c);
 await store.put('est_compra_itens',ls.map(l=>({id:uid(),compra_id:c.id,ingrediente_id:l.ing,qtd_base:baseQ(l),valor:+l.v,qtd_digitada:+l.q,unidade_digitada:l.u})));
 await store.put('est_movimentos',ls.map(l=>({id:uid(),ingrediente_id:l.ing,tipo:'compra',qtd_base:baseQ(l),valor:+l.v,data:c.data,ref_tipo:'compra',ref_id:c.id,obs:c.local||null,criado_em:now})));
 if($('#cupd').checked)await store.put('est_ingredientes',ls.map(l=>{const i={...ING(l.ing)};i.preco_embalagem=+(l.v/baseQ(l)*i.qtd_embalagem).toFixed(4);return i}));
 L=[];C={data:today(),local:'',obs:''};toast('Compra registrada e estoque atualizado');render()}

/* ===== Baixa / contagem ===== */
let B={ing:null,q:'',u:'',m:'baixa_manual',o:''};
function setB(name){const i=db.est_ingredientes.find(x=>x.controla_estoque&&x.nome.toLowerCase()===name.trim().toLowerCase());B.ing=i?i.id:null;B.u=i?unitOpts(i)[0][0]:'';render()}
const goBaixa=id=>{B.ing=id;B.u=unitOpts(ING(id))[0][0];tab='baixa';render()};
async function saveBaixa(){const i=ING(B.ing),o=i&&unitOpts(i).find(o=>o[0]===B.u);
 if(!i||B.q==='')return toast('Escolha o ingrediente e a quantidade');
 const q=+B.q*o[1],s=saldos()[i.id]||0,d=B.m==='ajuste'?q-s:-q;if(!d)return toast('Nada a ajustar');
 if(d<0&&B.m!=='ajuste'&&q>s&&!confirm('Saldo insuficiente ('+fmtQ(s,i.unidade)+'). Deixar negativo?'))return;
 await store.put('est_movimentos',{id:uid(),ingrediente_id:i.id,tipo:B.m,qtd_base:d,valor:+(d*cu(i)).toFixed(4),data:today(),ref_tipo:null,ref_id:null,obs:B.o||null,criado_em:new Date().toISOString()});
 B.q='';B.o='';toast('Registrado');render()}

/* ===== Ingredientes ===== */
async function edit(id,f,v){const i={...ING(id)};i[f]=['nome','unidade','tipo','controla_estoque'].includes(f)?v:+v;await store.put('est_ingredientes',i);render()}
async function newIng(){const n=$('#nn').value.trim();if(!n)return toast('Informe o nome');
 await store.put('est_ingredientes',{id:n.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-')+'-'+Date.now().toString(36),nome:n.toUpperCase(),tipo:'insumo',unidade:$('#nu').value,qtd_embalagem:+$('#nq').value||1,preco_embalagem:+$('#np').value||0,estoque_minimo:0,controla_estoque:true});render()}

/* ===== Telas ===== */
const TIPO={compra:'Compra',baixa_manual:'Baixa (uso)',perda:'Perda',ajuste:'Contagem/ajuste',venda:'Venda'};
function rowsEstoque(){const s=saldos();return db.est_ingredientes.filter(i=>i.controla_estoque&&i.nome.toLowerCase().includes(Q.toLowerCase())).sort((a,b)=>a.nome.localeCompare(b.nome)).map(i=>{
 const q=s[i.id]||0,m=+i.estoque_minimo,low=(m>0&&q<=m)||q<0;
 return `<tr class="${low?'low':''}"><td>${esc(i.nome)}</td><td class="n"><b>${fmtQ(q,i.unidade)}</b></td><td class="n">${m>0?fmtQ(m,i.unidade):'—'}</td><td class="n">${fmtCusto(i)}</td><td class="n">${brl(Math.max(q,0)*cu(i))}</td><td><button class="s" onclick="goBaixa('${i.id}')">Dar baixa</button></td></tr>`}).join('')}
const views={
estoque(){const s=saldos(),on=db.est_ingredientes.filter(i=>i.controla_estoque),val=on.reduce((a,i)=>a+Math.max(s[i.id]||0,0)*cu(i),0),low=on.filter(i=>(+i.estoque_minimo>0&&(s[i.id]||0)<=+i.estoque_minimo)||(s[i.id]||0)<0).length;
 return `<section class="card"><h2>Estoque atual</h2><div class="kpis"><div class="kpi">Valor em estoque<b>${brl(val)}</b></div><div class="kpi">Abaixo do mínimo / negativos<b>${low}</b></div></div>
 <input placeholder="Buscar ingrediente…" value="${esc(Q)}" oninput="Q=this.value;$('#rows').innerHTML=rowsEstoque()" style="width:100%;margin-bottom:8px">
 <div class="wrap"><table><thead><tr><th>Ingrediente</th><th class="n">Saldo</th><th class="n">Mínimo</th><th class="n">Custo</th><th class="n">Valor</th><th></th></tr></thead><tbody id="rows">${rowsEstoque()}</tbody></table></div>
 <p class="muted">Estoque inicial: use “Baixa / contagem” → “Contagem” para informar o saldo real de cada item.</p></section>`},
compra(){const rc=db.est_compras.slice().sort((a,b)=>(b.data+b.id).localeCompare(a.data+a.id)).slice(0,8).map(c=>`<tr><td>${fd(c.data)}</td><td>${esc(c.local)||'—'}</td><td class="n">${db.est_compra_itens.filter(x=>x.compra_id===c.id).length} itens</td><td class="n">${brl(c.total)}</td></tr>`).join('');
 return `<section class="card"><h2>Registrar compra</h2><div class="row">
 <label>Data<input type="date" value="${C.data}" oninput="C.data=this.value"></label>
 <label>Mercado / fornecedor<input value="${esc(C.local)}" placeholder="Ex.: Atacadão" oninput="C.local=this.value"></label>
 <label>Observação<input value="${esc(C.obs)}" oninput="C.obs=this.value"></label></div>
 <div id="lines"></div><button class="s" onclick="addLine()">+ Adicionar item</button>
 <p><label><input type="checkbox" id="cupd" checked> Atualizar o preço de cada ingrediente com o valor desta compra</label></p>
 <div class="tot">Total: <b id="tot"></b><button class="p" onclick="saveCompra()">Salvar compra</button></div></section>
 <section class="card"><h3>Compras recentes</h3><div class="wrap"><table><tbody>${rc||'<tr><td class="muted">Nenhuma compra ainda</td></tr>'}</tbody></table></div></section>`},
baixa(){const i=ING(B.ing);return `<section class="card"><h2>Baixa / contagem</h2><div class="row">
 <label>Ingrediente<input list="dl" value="${i?esc(i.nome):''}" onchange="setB(this.value)"></label>
 <label>Quantidade<input type="number" step="any" min="0" value="${B.q}" oninput="B.q=this.value"></label>
 <label>Unidade<select onchange="B.u=this.value">${i?optHtml(unitOpts(i),B.u):''}</select></label>
 <label>Motivo<select onchange="B.m=this.value;render()">${optHtml([['baixa_manual',0,'Uso na cozinha'],['perda',0,'Perda / vencimento'],['ajuste',0,'Contagem (informe o saldo real)']],B.m)}</select></label>
 <label>Observação<input value="${esc(B.o)}" oninput="B.o=this.value"></label></div>
 <p>${i?`Saldo atual: <b>${fmtQ(saldos()[i.id]||0,i.unidade)}</b>`:''}</p><button class="p" onclick="saveBaixa()">Registrar</button></section>`},
ingredientes(){return `<section class="card"><h2>Ingredientes e preços</h2><p class="muted">Altere o preço da embalagem quando mudar: o custo por unidade e as fichas técnicas se recalculam. Mínimo em g, ml ou unidades.</p>
 <div class="row"><input id="nn" placeholder="Novo ingrediente"><select id="nu"><option>g</option><option>ml</option><option>unid</option></select><input id="nq" type="number" placeholder="Qtd na embalagem"><input id="np" type="number" step=".01" placeholder="Preço da emb. R$"><button class="s" onclick="newIng()">Adicionar</button></div>
 <div class="wrap"><table><thead><tr><th>Ingrediente</th><th>Unid.</th><th>Qtd emb.</th><th>Preço emb. (R$)</th><th class="n">Custo</th><th>Mínimo</th><th>Controla</th></tr></thead><tbody>${
 db.est_ingredientes.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(i=>`<tr><td><input value="${esc(i.nome)}" onchange="edit('${i.id}','nome',this.value)"></td>
 <td><select onchange="edit('${i.id}','unidade',this.value)">${['g','ml','unid'].map(u=>`<option ${u===i.unidade?'selected':''}>${u}</option>`).join('')}</select></td>
 <td><input type="number" step="any" value="${i.qtd_embalagem}" onchange="edit('${i.id}','qtd_embalagem',this.value)"></td>
 <td><input type="number" step="0.01" value="${i.preco_embalagem}" onchange="edit('${i.id}','preco_embalagem',this.value)"></td>
 <td class="n">${fmtCusto(i)}</td><td><input type="number" step="any" value="${i.estoque_minimo}" onchange="edit('${i.id}','estoque_minimo',this.value)"></td>
 <td><input type="checkbox" ${i.controla_estoque?'checked':''} onchange="edit('${i.id}','controla_estoque',this.checked)"></td></tr>`).join('')}</tbody></table></div></section>`},
fichas(){const cats=[...new Set(db.est_fichas.map(f=>f.categoria))];
 return `<section class="card"><h2>Fichas técnicas</h2><p class="muted">Custo calculado com os preços atuais. Estas fichas serão usadas na baixa automática das vendas.</p>`+cats.map(c=>`<h3>${c}</h3>`+db.est_fichas.filter(f=>f.categoria===c).map(f=>{
  const it=db.est_ficha_itens.filter(x=>x.ficha_id===f.id),cs=it.reduce((a,x)=>a+x.qtd*cu(ING(x.ingrediente_id)||{}),0)/(f.rendimento||1);
  return `<details><summary><span>${esc(f.nome)}</span><span>custo ${brl(cs)} · cardápio ${f.preco_cardapio?brl(f.preco_cardapio)+' · margem '+Math.round((1-cs/f.preco_cardapio)*100)+'%':'—'}</span></summary>
  <p class="muted">${it.map(x=>{const i=ING(x.ingrediente_id)||{nome:'?',unidade:''};return esc(i.nome)+' '+nf(x.qtd)+' '+i.unidade}).join(' · ')}</p></details>`}).join('')).join('')+'</section>'},
hist(){return `<section class="card"><h2>Histórico de movimentações</h2><input placeholder="Filtrar por ingrediente…" value="${esc(Q2)}" oninput="Q2=this.value;$('#hrows').innerHTML=rowsHist()" style="width:100%;margin-bottom:8px">
 <div class="wrap"><table><thead><tr><th>Data</th><th>Ingrediente</th><th>Tipo</th><th class="n">Qtd</th><th class="n">Valor</th><th>Obs.</th></tr></thead><tbody id="hrows">${rowsHist()}</tbody></table></div></section>`}};
function rowsHist(){return db.est_movimentos.slice().sort((a,b)=>(b.data+b.criado_em).localeCompare(a.data+a.criado_em)).filter(m=>(ING(m.ingrediente_id)?.nome||'').toLowerCase().includes(Q2.toLowerCase())).slice(0,300).map(m=>{const i=ING(m.ingrediente_id)||{nome:'?',unidade:'g'};
 return `<tr><td>${fd(m.data)}</td><td>${esc(i.nome)}</td><td>${TIPO[m.tipo]||m.tipo}</td><td class="n">${m.qtd_base>0?'+':''}${fmtQ(m.qtd_base,i.unidade)}</td><td class="n">${m.valor==null?'—':brl(m.valor)}</td><td>${esc(m.obs)||''}</td></tr>`}).join('')}
function render(){$('#nav').innerHTML=[['estoque','Estoque'],['compra','Nova compra'],['baixa','Baixa / contagem'],['ingredientes','Ingredientes e preços'],['fichas','Fichas técnicas'],['hist','Histórico']].map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');
 $('#dl').innerHTML=db.est_ingredientes.filter(i=>i.controla_estoque).map(i=>`<option value="${esc(i.nome)}">`).join('');
 $('#app').innerHTML=views[tab]();if(tab==='compra')drawLines()}
(async()=>{try{await store.init()}catch(e){document.body.innerHTML='<p style="padding:20px">Erro ao conectar: '+esc(e.message)+'</p>';return}
 $('#mode').textContent=sb?'● Supabase conectado':'● Modo local (teste)';render()})();
</script></body></html>
