<style>

  body{ font-family:'Work Sans', sans-serif; background:var(--dark-green); color:var(--beige); margin:0; padding:16px; min-height:100vh; }

  #status{ font-size:.8rem; padding:6px 12px; border-radius:20px; background:rgba(255,255,255,.1); }

  #resumo-dia{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .cartao-resumo{ background:rgba(255,255,255,.1); border-radius:10px; padding:10px 18px; min-width:120px; }
  .cartao-resumo .num{ font-size:1.5rem; font-weight:bold; }
  .cartao-resumo .lbl{ font-size:.72rem; opacity:.8; text-transform:uppercase; }

  .tabs{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .tab{ font-family:inherit; font-size:.9rem; padding:10px 18px; border:none; border-radius:20px; cursor:pointer; font-weight:bold; background:rgba(255,255,255,.12); color:var(--beige); }
  .tab.active{ background:var(--terracotta); color:#fff; }

  .banner-corrida{ background:#6a3ac0; color:#fff; border-radius:12px; padding:12px 16px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; font-weight:bold; }
  .banner-corrida button{ font-family:inherit; font-size:.85rem; padding:8px 14px; border:none; border-radius:20px; cursor:pointer; font-weight:bold; background:#fff; color:#6a3ac0; }

  .banner-loc{ border-radius:12px; padding:12px 16px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; font-weight:bold; }
  .banner-loc.ligado{ background:#3a72c0; color:#fff; }
  .banner-loc.desligado{ background:rgba(255,255,255,.1); color:var(--beige); }
  .banner-loc button{ font-family:inherit; font-size:.85rem; padding:8px 14px; border:none; border-radius:20px; cursor:pointer; font-weight:bold; }
  .banner-loc.ligado button{ background:#fff; color:#3a72c0; }
  .banner-loc.desligado button{ background:var(--terracotta); color:#fff; }

  .pasta.selecionavel{ cursor:pointer; }
  .pasta.selecionada{ outline:3px solid #6a3ac0; }
  .pasta.desabilitada{ opacity:.45; cursor:default; }
  .check-corrida{ width:26px; height:26px; flex-shrink:0; }

  .barra-selecao{ position:fixed; left:0; right:0; bottom:0; background:#6a3ac0; color:#fff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; z-index:800; }
  .barra-selecao button{ font-family:inherit; font-size:.9rem; padding:10px 16px; border:none; border-radius:20px; cursor:pointer; font-weight:bold; }
  .barra-selecao .btn-iniciar{ background:#fff; color:#6a3ac0; }
  .barra-selecao .btn-cancelar-sel{ background:rgba(255,255,255,.2); color:#fff; }

  .progresso-corrida{ text-align:center; font-weight:bold; color:#6a3ac0; margin-bottom:4px; }

  .barra-hist{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }

  .selo-status.em_andamento{ background:#dde9fb; color:#3a72c0; }
  .selo-status.rota_entrega{ background:#e0d6f5; color:#6a3ac0; }

  #modal-detalhe{ background:#fff; color:#222; max-width:480px; margin:0 auto; border-radius:16px; overflow:hidden; }

  .d-topo h2{ margin:0; font-size:1.15rem; }
  .d-topo button{ background:none; border:none; color:#fff; font-size:1.3rem; cursor:pointer; }

  .d-bloco p{ margin:0; }
  .d-rotulo{ font-size:.72rem; text-transform:uppercase; font-weight:bold; color:#888; margin-bottom:3px; }

  #btn-ver-comanda{ font-family:inherit; font-size:1rem; padding:14px; border:2px solid #222; border-radius:12px; background:#fff; color:#222; font-weight:bold; cursor:pointer; }
  #overlay-comanda{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:950; overflow:auto; padding:16px; }
  #modal-comanda{ background:#fff; color:#111; max-width:420px; margin:0 auto; border-radius:14px; overflow:hidden; }
  .comanda-topo{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#f0f0f0; font-size:1rem; }
  .comanda-topo button{ border:none; background:none; font-size:1.3rem; cursor:pointer; padding:4px 8px; }
  #comanda-texto{ margin:0; padding:14px 16px 20px; font-family:'Courier New','DejaVu Sans Mono','Segoe UI Symbol',monospace; font-size:.92rem; font-weight:700; line-height:1.4; white-space:pre-wrap; word-break:break-word; }
</style>
</head>

<script>
const SUPABASE_URL = "https://wzmiqubfzlmglimmtkoz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ockSNlwXiqu24_AaNX6tYQ_lQPQSv_7";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STATUS_LABELS = {
  novo: '🟠 Recebido',
  em_andamento: '🔵 Em preparo',
  rota_entrega: '🚚 Na rota',
  finalizado_pago: '🟢 Pago e finalizado',
  pendencia: '🟡 Pendente',
  cancelado: '⚫ Cancelado'
};
// Ordem de prioridade na lista: quem ainda precisa de ação do motoboy aparece primeiro.
const ORDEM_STATUS = ['rota_entrega','em_andamento','novo','pendencia','finalizado_pago','cancelado'];

const statusEl = document.getElementById('status');
let modoAtual = 'hoje';
let pedidosHoje = [];
let pedidosHistorico = [];
let pedidoSelecionadoId = null;

// ===== CORRIDA (agrupar vários pedidos numa mesma saída) =====
const STATUS_ELEGIVEIS_CORRIDA = ['novo', 'em_andamento', 'pendencia'];
let modoSelecaoCorrida = false;
let selecionadosCorrida = [];      // ids na ordem em que foram marcados
let corridaAtual = carregarCorridaSalva(); // { ids:[...], index:0 } ou null

function carregarCorridaSalva(){
  try{
    const bruto = localStorage.getItem('motoboy_corrida');
    return bruto ? JSON.parse(bruto) : null;
  } catch(e){ return null; }
}
function salvarCorrida(){
  try{
    if(corridaAtual) localStorage.setItem('motoboy_corrida', JSON.stringify(corridaAtual));
    else localStorage.removeItem('motoboy_corrida');
  } catch(e){}
}

// ===== LOGIN (mesma conta usada no painel de pedidos) =====
async function conferirSenha(){
  const email = document.getElementById('input-email').value.trim();
  const senha = document.getElementById('input-senha').value;
  const erroEl = document.getElementById('erro-senha');
  erroEl.textContent = '';
  if(!email || !senha){ erroEl.textContent = 'Preencha e-mail e senha.'; return; }
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
  if(error){
    erroEl.textContent = error.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : error.message;
    return;
  }
  document.getElementById('tela-senha').style.display = 'none';
  document.getElementById('conteudo').style.display = 'block';
  iniciar();
}
async function sairPainel(){
  await desligarCompartilhamento();
  await supabaseClient.auth.signOut();
  document.getElementById('conteudo').style.display = 'none';
  document.getElementById('tela-senha').style.display = 'flex';
  document.getElementById('input-senha').value = '';
}
document.getElementById('input-senha').addEventListener('keydown', e => { if(e.key === 'Enter') conferirSenha(); });
document.getElementById('input-email').addEventListener('keydown', e => { if(e.key === 'Enter') conferirSenha(); });
supabaseClient.auth.getSession().then(({ data: { session } }) => {
  if(session){
    document.getElementById('tela-senha').style.display = 'none';
    document.getElementById('conteudo').style.display = 'block';
    iniciar();
  }
});

function iniciar(){
  statusEl.textContent = '🟢 conectado';
  statusEl.className = 'ok';
  carregarHoje();
  renderizarBannerCorrida();
  renderizarBannerLocalizacao();
  if(localStorage.getItem('motoboy_compartilhando') === '1') ligarCompartilhamento(true);
}

// ===== COMPARTILHAMENTO DE LOCALIZAÇÃO (GPS) =====
// Manda a posição pro Supabase no máximo a cada 15s (evita gastar bateria/dados
// mandando a cada pequeníssimo movimento que o GPS detectar).
const INTERVALO_MIN_ENVIO_MS = 15000;
let watchId = null;
let ultimoEnvioLocalizacao = 0;
let compartilhandoLocalizacao = false;

function renderizarBannerLocalizacao(){
  const container = document.getElementById('localizacao-banner');
  if(compartilhandoLocalizacao){
    container.innerHTML = `
      <div class="banner-loc ligado">
        <span>📍 Compartilhando sua localização</span>
        <button onclick="desligarCompartilhamento()">Parar</button>
      </div>`;
  } else {
    container.innerHTML = `
      <div class="banner-loc desligado">
        <span>📍 Localização desligada</span>
        <button onclick="ligarCompartilhamento()">Compartilhar localização</button>
      </div>`;
  }
}

function ligarCompartilhamento(silencioso){
  if(!navigator.geolocation){
    if(!silencioso) alert('Esse navegador não suporta compartilhar localização.');
    return;
  }
  watchId = navigator.geolocation.watchPosition(
    async pos => {
      compartilhandoLocalizacao = true;
      localStorage.setItem('motoboy_compartilhando', '1');
      renderizarBannerLocalizacao();
      const agora = Date.now();
      if(agora - ultimoEnvioLocalizacao < INTERVALO_MIN_ENVIO_MS) return; // ainda dentro do intervalo mínimo
      ultimoEnvioLocalizacao = agora;
      await supabaseClient.from('localizacao_motoboy').update({
        latitude: pos.coords.latitude,
        longitude: pos.coords.longitude,
        atualizado_em: new Date().toISOString(),
        compartilhando: true
      }).eq('id', 1);
    },
    err => {
      console.error('Erro de geolocalização:', err);
      if(!silencioso) alert('Não foi possível acessar sua localização. Verifique se você deu permissão de GPS pro navegador.');
      desligarCompartilhamento();
    },
    { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }
  );
}

async function desligarCompartilhamento(){
  if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  compartilhandoLocalizacao = false;
  localStorage.removeItem('motoboy_compartilhando');
  renderizarBannerLocalizacao();
  try{ await supabaseClient.from('localizacao_motoboy').update({ compartilhando: false }).eq('id', 1); }catch(e){}
}

function renderizarBannerCorrida(){
  const container = document.getElementById('banner-corrida-container');
  const tabCorrida = document.getElementById('tab-corrida');
  if(!corridaAtual){ container.innerHTML = ''; tabCorrida.style.display = 'none'; return; }

  const pedidosDaCorrida = corridaAtual.ids.map(id => encontrarPedido(id)).filter(Boolean);
  const restantes = pedidosDaCorrida.filter(p => p.status !== 'finalizado_pago' && p.status !== 'cancelado').length;
  tabCorrida.style.display = 'inline-block';
  tabCorrida.textContent = `🛵 Corrida (${restantes})`;

  if(pedidosDaCorrida.length === 0){
    // ainda não recarregou os pedidos de hoje — evita mostrar "concluída" à toa
    container.innerHTML = `<div class="banner-corrida"><span>🛵 Corrida em andamento</span><button onclick="mudarAba('corrida')">Ver corrida</button></div>`;
    return;
  }
  if(restantes === 0){
    container.innerHTML = `
      <div class="banner-corrida">
        <span>🎉 Corrida concluída — todos os pedidos foram entregues!</span>
        <button onclick="encerrarCorrida()">Encerrar corrida</button>
      </div>`;
    return;
  }
  container.innerHTML = `
    <div class="banner-corrida">
      <span>🛵 Corrida em andamento — ${restantes} pedido(s) restante(s)</span>
      <button onclick="mudarAba('corrida')">Ver corrida — você escolhe a ordem</button>
    </div>
  `;
}

function encerrarCorrida(){
  corridaAtual = null;
  salvarCorrida();
  renderizarBannerCorrida();
  if(modoAtual === 'corrida') mudarAba('hoje');
}

// ===== EXTRAÇÃO DE INFORMAÇÕES DE DENTRO DO TEXTO DA COMANDA =====
// (não existem colunas separadas no banco pra nome/telefone/endereço — tudo
// vem embutido no texto_comanda, então extraímos daqui pra exibir de forma
// mais legível pro motoboy do que o texto corrido da comanda.)
function extrairCampo(texto, regex){ const m = (texto||'').match(regex); return m ? m[1].trim() : ''; }
function extrairNomeCliente(texto){ return extrairCampo(texto, /👤 Cliente:\s*([^\n]+)/); }
function extrairTelefone(texto){ return extrairCampo(texto, /📞 Telefone:\s*([^\n]+)/); }
function extrairPagamento(texto){ return extrairCampo(texto, /💳 Pagamento:\s*([^\n]+)/); }
function extrairMapa(texto){ return extrairCampo(texto, /🗺️ Mapa:\s*(\S+)/); }
function extrairReferencia(texto){
  // a comanda quebra linhas em 32 colunas (impressora térmica): junta as linhas de continuação
  const linhas = (texto || '').split('\n');
  const idx = linhas.findIndex(l => l.trim().startsWith('📌 Referência:'));
  if(idx === -1) return '';
  let r = linhas[idx].replace('📌 Referência:', '').trim();
  for(let i = idx + 1; i < linhas.length; i++){
    const l = linhas[i].trim();
    if(!l || /^(🗺️|📍|⚠️|🛵|💳|💵|💰|=|-)/.test(l)) break;
    r += ' ' + l;
  }
  return r.trim();
}
function extrairInfoGps(texto){ return extrairCampo(texto, /🗺️ Mapa:\s*\S+\s*\(([^)]*)\)/); }
function extrairCoordenadas(link){
  const m = (link || '').match(/[?&](?:q|destination|query)=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  return m ? { lat: m[1], lng: m[2] } : null;
}
// Cidade da loja: a busca por texto (quando o pedido não tem GPS) sempre inclui a cidade,
// senão o Google procura a rua em qualquer cidade e mostra "não encontrado" ou o lugar errado.
const CIDADE_ENTREGA = 'Altaneira, CE, Brasil';
function extrairTrocoLinha(texto){ return extrairCampo(texto, /💵 ([^\n]+)/); }
function ehRetirada(texto){ return (texto||'').includes('RETIRADA NO BALCÃO'); }

function extrairEndereco(texto){
  const linhas = (texto||'').split('\n');
  const idx = linhas.findIndex(l => l.trim().startsWith('📍 Endereço:'));
  if(idx === -1) return '';
  let resultado = linhas[idx].replace('📍 Endereço:', '').trim();
  for(let i = idx + 1; i < linhas.length; i++){
    const l = linhas[i].trim();
    if(!l || /^(🗺️|📌|⚠️|🛵|💳|💵|💰|=)/.test(l)) break;
    resultado += ' ' + l;
  }
  return resultado.trim();
}

function extrairItens(texto){
  const linhas = (texto||'').split('\n');
  const inicio = linhas.findIndex(l => l.includes('PARA O PIZZAIOLO'));
  const fim = linhas.findIndex(l => l.includes('PARA O MOTOBOY'));
  if(inicio === -1 || fim === -1) return '(itens não encontrados na comanda)';
  const bloco = linhas.slice(inicio + 1, fim).filter(l => l.trim() && !/^=+$/.test(l.trim()));
  return bloco.join('\n') || '(sem itens)';
}

function extrairTotal(texto){
  const m = (texto||'').match(/TOTAL A COBRAR:\s*R\$\s*([\d.,]+)/i);
  if(!m) return null;
  const num = parseFloat(m[1].replace(/\./g,'').replace(',', '.'));
  return isNaN(num) ? null : num;
}

function soDigitos(s){ return (s||'').replace(/\D/g,''); }

function formatarHora(iso){ return new Date(iso).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); }
function formatarDataLonga(iso){ return new Date(iso).toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'long'}); }
function chaveDia(iso){ return new Date(iso).toDateString(); }

// ===== CARREGAR PEDIDOS =====
async function carregarHoje(){
  const hojeStr = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Fortaleza' }); // YYYY-MM-DD
  const inicio = `${hojeStr}T00:00:00-03:00`;
  const [ano, mes, dia] = hojeStr.split('-').map(Number);
  const proximoDia = new Date(Date.UTC(ano, mes - 1, dia + 1));
  const fim = `${proximoDia.toISOString().slice(0,10)}T00:00:00-03:00`;
  const { data, error } = await supabaseClient.from('pedidos').select('*')
    .gte('created_at', inicio).lt('created_at', fim)
    .order('created_at', { ascending: true });
  if(error){ statusEl.textContent = 'erro ao carregar'; statusEl.className = 'erro'; console.error(error); return; }
  pedidosHoje = data || [];
  const cardResumo = pedidosHoje.filter(p => p.status !== 'cancelado' && p.status !== 'finalizado_pago').length;
  document.getElementById('resumo-dia').innerHTML = `
    <div class="cartao-resumo"><div class="num">${cardResumo}</div><div class="lbl">Ainda por entregar/retirar</div></div>
    <div class="cartao-resumo"><div class="num">${pedidosHoje.length}</div><div class="lbl">Pedidos hoje</div></div>
  `;
  if(modoAtual === 'hoje' || modoAtual === 'corrida') renderizar();
  renderizarBannerCorrida();
}

async function buscarHistoricoPorDia(){
  const valor = document.getElementById('hist-data').value;
  const histStatusEl = document.getElementById('hist-status');
  if(!valor){ histStatusEl.textContent = 'Escolha uma data primeiro.'; return; }
  histStatusEl.textContent = 'Buscando...';
  const inicio = `${valor}T00:00:00-03:00`;
  const [ano, mes, dia] = valor.split('-').map(Number);
  const proximoDia = new Date(Date.UTC(ano, mes - 1, dia + 1));
  const fim = `${proximoDia.toISOString().slice(0,10)}T00:00:00-03:00`;
  const { data, error } = await supabaseClient.from('pedidos').select('*')
    .gte('created_at', inicio).lt('created_at', fim)
    .order('created_at', { ascending: true });
  if(error){ console.error(error); histStatusEl.textContent = 'Erro ao buscar.'; return; }
  pedidosHistorico = data || [];
  const [y,m,d] = valor.split('-');
  histStatusEl.textContent = `${pedidosHistorico.length} pedido(s) em ${d}/${m}/${y}.`;
  renderizar();
}

function mudarAba(aba){

  document.getElementById('tab-historico').classList.toggle('active', aba === 'historico');

// ===== RENDERIZAR AS "PASTAS" =====
function renderizar(){
  const lista = modoAtual === 'hoje' ? pedidosHoje
    : modoAtual === 'corrida' ? pedidosHoje.filter(p => corridaAtual && corridaAtual.ids.map(String).includes(String(p.id)))
    : pedidosHistorico;
  const listaEl = document.getElementById('lista-container');
  const vazioEl = document.getElementById('vazio');
  listaEl.innerHTML = '';

  if(lista.length === 0){
    vazioEl.style.display = 'block';
    vazioEl.textContent = modoAtual === 'hoje' ? 'Nenhum pedido hoje ainda.'
      : modoAtual === 'corrida' ? 'Nenhum pedido nessa corrida.'
      : 'Nenhum pedido encontrado.';
    return;
  }
  vazioEl.style.display = 'none';

  const ordenada = [...lista].sort((a,b) => {
    const dif = ORDEM_STATUS.indexOf(a.status) - ORDEM_STATUS.indexOf(b.status);
    if(dif !== 0) return dif;
    return new Date(a.created_at) - new Date(b.created_at);
  });

  const grade = document.createElement('div');
  grade.className = 'lista-pastas';

  ordenada.forEach(p => {
    const nome = extrairNomeCliente(p.texto_comanda) || 'Cliente sem nome';
    const retirada = ehRetirada(p.texto_comanda);
    const total = p.total || extrairTotal(p.texto_comanda) || 0;
    const elegivel = STATUS_ELEGIVEIS_CORRIDA.includes(p.status);
    const idStr = String(p.id);
    const selecionado = selecionadosCorrida.includes(idStr);
    const pasta = document.createElement('div');
    pasta.className = 'pasta status-' + p.status;

    if(modoSelecaoCorrida){
      pasta.classList.add(elegivel ? 'selecionavel' : 'desabilitada');
      if(selecionado) pasta.classList.add('selecionada');
      pasta.onclick = elegivel ? () => alternarSelecaoPedido(idStr) : null;
    } else {
      pasta.onclick = () => abrirDetalhe(p.id);
    }

    const checkbox = modoSelecaoCorrida && elegivel
      ? `<input type="checkbox" class="check-corrida" ${selecionado ? 'checked' : ''} onclick="event.stopPropagation(); alternarSelecaoPedido('${idStr}')">`
      : '';

    pasta.innerHTML = `
      ${checkbox}
      <div class="pasta-info">
        <div class="pasta-nome">${nome}</div>
        <div class="pasta-meta">
          <span class="selo ${retirada ? 'selo-retirada' : 'selo-entrega'}">${retirada ? '🏠 Retirada' : '🛵 Entrega'}</span>
          <span class="selo selo-status ${p.status}">${STATUS_LABELS[p.status] || p.status}</span>
          <span>🕒 ${formatarHora(p.created_at)}</span>
        </div>
      </div>
      <div class="pasta-total">R$ ${total.toFixed(2).replace('.',',')}</div>
    `;
    grade.appendChild(pasta);
  });

  listaEl.appendChild(grade);
}

// ===== SELEÇÃO DE PEDIDOS PRA UMA CORRIDA =====
function alternarModoSelecao(){
  modoSelecaoCorrida = !modoSelecaoCorrida;
  selecionadosCorrida = [];
  document.getElementById('btn-toggle-selecao').classList.toggle('active', modoSelecaoCorrida);
  document.getElementById('barra-selecao').style.display = modoSelecaoCorrida ? 'flex' : 'none';
  if(modoSelecaoCorrida && modoAtual !== 'hoje') mudarAba('hoje');
  atualizarContagemSelecao();
  renderizar();
}
function alternarSelecaoPedido(id){
  const idx = selecionadosCorrida.indexOf(id);
  if(idx === -1) selecionadosCorrida.push(id); else selecionadosCorrida.splice(idx, 1);
  atualizarContagemSelecao();
  renderizar();
}
function atualizarContagemSelecao(){
  document.getElementById('contagem-selecao').textContent = `${selecionadosCorrida.length} selecionado(s)`;
  document.getElementById('btn-iniciar-corrida').disabled = selecionadosCorrida.length === 0;
}

async function iniciarCorrida(){
  if(selecionadosCorrida.length === 0) return;
  const botao = document.getElementById('btn-iniciar-corrida');
  botao.disabled = true;
  botao.textContent = 'Iniciando...';

  const ids = [...selecionadosCorrida];
  const { error } = await supabaseClient.from('pedidos').update({ status: 'rota_entrega' }).in('id', ids);
  botao.textContent = '🛵 Iniciar corrida';

  if(error){
    alert('Não foi possível colocar os pedidos em rota.\n\nErro: ' + (error.message || JSON.stringify(error)));
    botao.disabled = false;
    return;
  }

  ids.forEach(id => {
    const p = encontrarPedido(id);
    if(p) p.status = 'rota_entrega';
  });

  corridaAtual = { ids };
  salvarCorrida();
  modoSelecaoCorrida = false;
  selecionadosCorrida = [];
  document.getElementById('btn-toggle-selecao').classList.remove('active');
  document.getElementById('barra-selecao').style.display = 'none';
  renderizarBannerCorrida();
  await carregarHoje();
  mudarAba('corrida');
}

// ===== DETALHE DO PEDIDO =====
function encontrarPedido(id){
  return pedidosHoje.find(p => String(p.id) === String(id)) || pedidosHistorico.find(p => String(p.id) === String(id));
}

function abrirDetalhe(id){
  const p = encontrarPedido(id);
  if(!p) return;
  pedidoSelecionadoId = id;
  const texto = p.texto_comanda;
  const retirada = ehRetirada(texto);
  const telefone = extrairTelefone(texto);
  const digitos = soDigitos(telefone);

  document.getElementById('d-nome').textContent = extrairNomeCliente(texto) || 'Pedido';
  document.getElementById('d-telefone').textContent = telefone || '—';

  const linksContato = document.getElementById('d-links-contato');
  linksContato.innerHTML = '';
  if(digitos){
    linksContato.innerHTML = `
      <a href="tel:${digitos}">📞 Ligar</a>
      <a href="https://wa.me/55${digitos}" target="_blank" rel="noopener">💬 WhatsApp</a>
    `;
  }

  document.getElementById('d-rotulo-destino').textContent = retirada ? 'Retirada' : 'Endereço';
  const linksMapa = document.getElementById('d-links-mapa');
  linksMapa.innerHTML = '';
  if(retirada){
    document.getElementById('d-endereco').textContent = '🏠 Cliente vai retirar no balcão — não precisa de entrega.';
    document.getElementById('d-referencia').style.display = 'none';
    document.getElementById('d-aviso-mapa').style.display = 'none';
  } else {
    const endereco = extrairEndereco(texto);
    const referencia = extrairReferencia(texto);
    document.getElementById('d-endereco').textContent = endereco || '—';
    const refEl = document.getElementById('d-referencia');
    refEl.textContent = referencia ? '📌 Referência: ' + referencia : '';
    refEl.style.display = referencia ? 'block' : 'none';

    const mapaGps = extrairMapa(texto);
    const coords = extrairCoordenadas(mapaGps);
    const avisoEl = document.getElementById('d-aviso-mapa');
    let aviso = '';
    if(coords){
      // Pedido com GPS: o pino é a fonte mais confiável (não depende de o Google "achar" a rua).
      linksMapa.innerHTML =
        `<a href="${mapaGps}" target="_blank" rel="noopener">🗺️ Abrir pino do GPS</a>` +
        `<a href="https://www.google.com/maps/dir/?api=1&destination=${coords.lat},${coords.lng}" target="_blank" rel="noopener">🧭 Traçar rota</a>`;
      const infoGps = extrairInfoGps(texto);
      aviso = infoGps ? '📍 ' + infoGps : '';
    } else if(mapaGps){
      linksMapa.innerHTML = `<a href="${mapaGps}" target="_blank" rel="noopener">🗺️ Abrir no mapa</a>`;
    } else if(endereco){
      // Sem GPS: busca pelo texto, sempre com a cidade e sem a referência.
      const busca = `${endereco}, ${CIDADE_ENTREGA}`;
      linksMapa.innerHTML = `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(busca)}" target="_blank" rel="noopener">🗺️ Buscar endereço no mapa</a>`;
      aviso = '⚠️ Este pedido não tem GPS. Confirme o endereço com o cliente antes de sair.';
    }
    avisoEl.textContent = aviso;
    avisoEl.style.display = aviso ? 'block' : 'none';
  }

  document.getElementById('d-itens').textContent = extrairItens(texto);

  const pagamento = extrairPagamento(texto);
  const trocoLinha = extrairTrocoLinha(texto);
  const pagEl = document.getElementById('d-pagamento');
  if(pagamento.includes(' + ') && /R\$/.test(pagamento)){
    // pagamento dividido: cada forma numa linha, com o valor de cada uma
    pagEl.style.whiteSpace = 'pre-line';
    pagEl.textContent = '✂️ Pagamento dividido:\n' + pagamento.split(' + ').join('\n') + (trocoLinha ? '\n↳ ' + trocoLinha.replace(/^Dinheiro R\$ [\d.,]+ — /, '') : '');
  } else {
    pagEl.style.whiteSpace = '';
    pagEl.textContent = pagamento + (trocoLinha ? ' — ' + trocoLinha : '');
  }

  const total = p.total || extrairTotal(texto) || 0;
  document.getElementById('d-total').textContent = 'R$ ' + total.toFixed(2).replace('.',',');

  document.getElementById('d-status-atual').textContent = 'Status atual: ' + (STATUS_LABELS[p.status] || p.status);

  const progressoEl = document.getElementById('progresso-corrida');
  const fazParteDaCorrida = corridaAtual && corridaAtual.ids.map(String).includes(String(id));
  if(fazParteDaCorrida){
    progressoEl.style.display = 'block';
    progressoEl.textContent = '🛵 Esse pedido faz parte da corrida em andamento';
  } else {
    progressoEl.style.display = 'none';
  }

  const jaFinalizado = p.status === 'finalizado_pago' || p.status === 'cancelado';
  document.getElementById('btn-finalizar').style.display = jaFinalizado ? 'none' : 'block';
  document.getElementById('btn-finalizar').textContent = fazParteDaCorrida && !jaFinalizado ? '✅ Finalizado — voltar pra corrida' : '✅ Finalizado e pago';
  document.getElementById('ja-finalizado').style.display = jaFinalizado ? 'block' : 'none';

  document.getElementById('overlay-detalhe').style.display = 'block';
}

function fecharDetalhe(){
  document.getElementById('overlay-detalhe').style.display = 'none';
  pedidoSelecionadoId = null;
}

async function finalizarPedidoAtual(){
  if(!pedidoSelecionadoId) return;
  const idFinalizado = pedidoSelecionadoId;
  const p = encontrarPedido(idFinalizado);
  const botao = document.getElementById('btn-finalizar');
  botao.disabled = true;
  botao.textContent = 'Atualizando...';

  const payload = { status: 'finalizado_pago' };
  if(p && !p.finalizado_em) payload.finalizado_em = new Date().toISOString();

  const { data, error } = await supabaseClient.from('pedidos').update(payload).eq('id', idFinalizado).select();
  botao.disabled = false;

  if(error){
    alert('Não foi possível atualizar o pedido.\n\nErro: ' + (error.message || JSON.stringify(error)));
    console.error(error);
    return;
  }
  if(!data || data.length === 0){
    alert('O status não foi alterado. Tente sair e entrar de novo no painel.');
    return;
  }
  if(p) Object.assign(p, payload);
  fecharDetalhe();
  renderizar();
  renderizarBannerCorrida();
  carregarHoje();
}
// ==================== COMANDA PARA O PAPEL ====================
// Reorganiza o texto guardado do pedido num layout mais claro (blocos separados, uma informação
// por linha) e troca os emojis coloridos por símbolos de uma cor só, que saem bem na impressora
// térmica. O texto guardado do pedido (e a mensagem do WhatsApp) NÃO mudam — só o que vai pro papel.
// Se o texto não tiver o formato esperado, cai numa conversão simples (só troca os símbolos).
function trocarSimbolosSimples(texto){
  let t = String(texto || '');
  t = t.replace(/\*?🍕 PARA O PIZZAIOLO\*?/g, '★ PARA O PIZZAIOLO ★')
       .replace(/\*?🛵 PARA O MOTOBOY\*?/g, '➤ PARA O MOTOBOY ➤')
       .replace(/Bom apetite! 🍕🔥/g, '✿ Bom apetite! ✿');
  const MAPA = {
    '🧾':'№', '📅':'▦', '🕒':'◷', '📞':'✆', '👤':'☻', '📍':'⌂', '📌':'☞', '🗺':'⊕', '🛵':'»', '🏠':'⌂',
    '💳':'¤', '💵':'$', '💰':'◆', '🏷':'%', '⚠':'(!)', '🔸':'▸', '🔹':'▹', '🧀':'◎', '📝':'✎', '❗':'⚑',
    '🍕':'◔', '🥟':'◖', '🍩':'✿', '🥙':'▲', '🥤':'∪', '🍽':'◆', '🎁':'★', '🔥':'✿', '✂':'÷'
  };
  const re = new RegExp('(' + Object.keys(MAPA).join('|') + ')[\uFE0E\uFE0F]? ?', 'g');
  t = t.replace(re, (_, e) => MAPA[e] + ' ');
  t = t.replace(/\*([^*\n]+)\*/g, '$1');                  // tira os asteriscos de "negrito" do WhatsApp
  t = t.replace(/[\u{1F000}-\u{1FAFF}]\uFE0F?/gu, '•');    // qualquer emoji que sobrou vira um marcador simples
  return t;
}

function converterParaImpressao(texto){
  const bruto = String(texto || '').replace(/\uFE0F/g, '').replace(/\r/g, '');
  if(!/PARA O PIZZAIOLO/.test(bruto) || !/PARA O MOTOBOY/.test(bruto) || !/TOTAL A COBRAR/.test(bruto)){
    return trocarSimbolosSimples(bruto);
  }
  try{
    return montarLayoutPapel(bruto);
  } catch(e){
    console.error('Layout da comanda: usando conversão simples.', e);
    return trocarSimbolosSimples(bruto);
  }
}

function montarLayoutPapel(bruto){
  const W = 32;
  const SEP = '='.repeat(W);
  const DIV = '-'.repeat(W);
  const linhas = bruto.split('\n').map(l => l.replace(/\s+$/, ''));
  const ehSep = l => /^=+$/.test(l.trim()) || /^-{5,}$/.test(l.trim());

  const idxP = linhas.findIndex(l => /PARA O PIZZAIOLO/.test(l));
  const idxM = linhas.findIndex(l => /PARA O MOTOBOY/.test(l));
  const idxT = linhas.findIndex((l, i) => i > idxM && /TOTAL A COBRAR/.test(l));
  if(idxP < 0 || idxM < idxP || idxT < idxM) throw new Error('estrutura da comanda');

  const cab = linhas.slice(0, idxP);
  const piz = linhas.slice(idxP + 1, idxM).filter(l => !ehSep(l) && l.trim() !== '');
  const mot = linhas.slice(idxM + 1, idxT).filter(l => !ehSep(l) && l.trim() !== '');
  const rod = linhas.slice(idxT).filter(l => !ehSep(l) && l.trim() !== '');

  // quebra de linha com "recuo": prefixo na 1ª linha, recuoDemais nas seguintes
  const quebrar = (prefixo, texto, recuoDemais) => {
    const palavras = String(texto || '').split(/\s+/).filter(Boolean);
    const out = [];
    let atual = prefixo, primeiro = true;
    palavras.forEach(p => {
      const cand = primeiro ? atual + p : atual + ' ' + p;
      if(cand.length > W && !primeiro){ out.push(atual); atual = recuoDemais + p; }
      else atual = cand;
      primeiro = false;
    });
    out.push(atual);
    return out;
  };
  const simb = s => trocarSimbolosSimples(s).replace(/\s+$/, '');
  const pontilhado = (rotulo, valor) => {
    const pontos = '.'.repeat(Math.max(2, W - 2 - rotulo.length - valor.length - 2));
    return `  ${rotulo} ${pontos} ${valor}`;
  };
  const centro = t => ' '.repeat(Math.max(0, Math.floor((W - t.length) / 2))) + t;

  const out = [];

  // ---------- cabeçalho ----------
  const textoCab = cab.join('\n');
  const num = (textoCab.match(/Pedido #(\d+)/) || [])[1];
  const data = (textoCab.match(/📅\s*(\S+)/) || [])[1];
  const hora = (textoCab.match(/🕒\s*(\S+)/) || [])[1];
  out.push(SEP, centro("MANEL'S PIZZARIA"), SEP);
  if(num || hora){
    const esq = num ? `№ ${num}` : '';
    const dir = hora ? `◷ ${hora}` : '';
    out.push(esq + ' '.repeat(Math.max(1, W - esq.length - dir.length)) + dir);
  }
  if(data){
    const dir2 = `▦ ${data}`;
    out.push(' '.repeat(Math.max(0, W - dir2.length)) + dir2);
  }
  // linhas extras do cabeçalho (ex.: pedidos antigos marcados como encomenda)
  cab.filter(l => !ehSep(l) && l.trim() !== '' && !/MANEL'S PIZZARIA/.test(l) && !/^\s*📞\s*\d/.test(l)
                  && !/Pedido #/.test(l) && !/^📅/.test(l))
     .forEach(l => out.push(simb(l.trim())));
  out.push(SEP);

  // ---------- PARA O PIZZAIOLO ----------
  out.push('', '★ PARA O PIZZAIOLO ★', DIV);
  const ITEM = /^(🍕|🥟|🍩|🥙|🥤|🍽|🎁|•) (\d+)x (.+)$/u;
  const SIM_ITEM = { '🍕':'◔', '🥟':'◖', '🍩':'✿', '🥙':'▲', '🥤':'∪', '🍽':'◆', '🎁':'★', '•':'•' };
  const blocos = [];
  const complementos = [];
  const obs = { txt: '' };
  let atual = null;     // item em montagem
  let alvo = null;      // último texto que pode receber uma linha de continuação (linhas quebradas a 32 colunas)
  piz.forEach(l => {
    let m;
    if((m = l.match(ITEM))){ atual = { emoji: m[1], qty: m[2], label: m[3], subs: [] }; blocos.push(atual); alvo = null; return; }
    if(/^\s*🔸/.test(l)){
      const t = l.replace(/^\s*🔸\s*/, '');
      const mm = t.match(/^\[(\d+)\/(\d+)\]\s*(.*)$/);
      const sub = { simbolo: '▸', txt: mm ? `${mm[1]}/${mm[2]} ${mm[3]}` : t };
      if(atual) atual.subs.push(sub); else blocos.push({ emoji: '•', qty: '', label: '', subs: [sub] });
      alvo = sub; return;
    }
    if(/^🧀 Borda Recheada:/.test(l)){
      const sub = { simbolo: '◎', txt: 'Borda: ' + l.replace(/^🧀 Borda Recheada:\s*/, '') };
      if(atual) atual.subs.push(sub); alvo = sub; return;
    }
    if(/^\s*📝 Observação:/.test(l)){
      const sub = { simbolo: '✎', txt: l.replace(/^\s*📝 Observação:\s*/, '') };
      if(atual) atual.subs.push(sub); alvo = sub; return;
    }
    if(/^🔹/.test(l)){
      complementos.push(l.replace(/^🔹\s*/, '').replace(/\s*\([^)]*\)\s*$/, '')); // tira "(1ª grátis, + R$ 1,00)"
      alvo = null; return;
    }
    if((m = l.match(/^❗\s*\*?OBS:\*?\s*(.*)$/))){ obs.txt = m[1]; alvo = obs; return; }
    if(alvo) alvo.txt += ' ' + l.trim();
    else complementos.push(l.trim());
  });

  blocos.forEach(b => {
    out.push('');
    if(b.label){
      let rotulo = b.label.toUpperCase();
      const nSab = b.subs.filter(x => /^\d+\/\d+ /.test(x.txt)).length;
      rotulo = rotulo.replace(/\(FRACIONADA\)/, nSab > 1 ? `(${nSab} SABORES)` : '(1 SABOR)');
      quebrar(`${SIM_ITEM[b.emoji] || '•'} ${b.qty}x `, simb(rotulo), '   ').forEach(x => out.push(x));
    }
    b.subs.forEach(sb => quebrar(`   ${sb.simbolo} `, simb(sb.txt), '     ').forEach(x => out.push(x)));
  });
  if(complementos.length || obs.txt){
    out.push('', DIV);
    complementos.forEach(c => out.push('▹ ' + simb(c)));
    if(obs.txt) quebrar('⚑ OBS: ', simb(obs.txt), '  ').forEach(x => out.push(x));
  }

  // ---------- PARA O MOTOBOY ----------
  out.push('', SEP, '➤ PARA O MOTOBOY ➤', SEP, '');
  const c = { nome: '', tel: '', end: [], ref: [], mapa: '', semGps: [], taxa: '', pag: '', cash: [], cupom: null, pontos: '', retirada: false, outros: [] };
  alvo = null;
  mot.forEach(l => {
    let m;
    if((m = l.match(/^👤 Cliente:\s*(.*)$/))){ c.nome = m[1]; alvo = null; return; }
    if((m = l.match(/^📞 Telefone:\s*(.*)$/))){ c.tel = m[1]; alvo = null; return; }
    if((m = l.match(/^📍 Endereço:\s*(.*)$/))){ c.end = [m[1]]; alvo = c.end; return; }
    if((m = l.match(/^📌 Referência:\s*(.*)$/))){ c.ref = [m[1]]; alvo = c.ref; return; }
    if(/^🗺 Mapa:/.test(l)){ c.mapa = l; alvo = null; return; }
    if(/^⚠ Cliente sem GPS/.test(l)){ c.semGps = [l]; alvo = c.semGps; return; }
    if(/RETIRADA NO BALC/.test(l)){ c.retirada = true; alvo = null; return; }
    if((m = l.match(/^🛵 Taxa de entrega:\s*(.*)$/))){ c.taxa = m[1]; alvo = null; return; }
    if((m = l.match(/^💳 Pagamento:\s*(.*)$/))){ c.pag = m[1]; alvo = null; return; }
    if(/^💵 /.test(l)){ c.cash.push(l.replace(/^💵\s*/, '')); alvo = null; return; }
    if((m = l.match(/^🏷 Cupom (.+?):\s*(-?\s*R\$.*)$/))){ c.cupom = { cod: m[1], val: m[2] }; alvo = null; return; }
    if((m = l.match(/^🎁 Desconto[^:]*:\s*(-?\s*R\$.*)$/))){ c.pontos = m[1]; alvo = null; return; }
    if(alvo){ alvo.push(l.trim()); return; }
    c.outros.push(l);
  });

  if(c.nome) quebrar('☻ ', c.nome, '  ').forEach(x => out.push(x));
  if(c.tel) out.push('✆ ' + c.tel);
  out.push('');
  if(c.retirada){
    out.push('⌂ RETIRADA NO BALCÃO');
  } else {
    out.push('⌂ ENTREGA');
    const end = c.end.join(' ').trim();
    if(end) quebrar('  ', end, '  ').forEach(x => out.push(x));
    const ref = c.ref.join(' ').trim();
    if(ref) quebrar('  ☞ ', ref, '    ').forEach(x => out.push(x));
    if(c.mapa){
      const prec = (c.mapa.match(/±\s*(\d+)\s*m/) || [])[1];
      out.push('  ⊕ GPS localizado' + (prec ? ` (±${prec} m)` : ''));
    } else if(c.semGps.length){
      quebrar('  (!) ', 'Sem GPS: confirmar o endereço', '      ').forEach(x => out.push(x));
    }
  }

  out.push('', DIV, '¤ PAGAMENTO');
  const partes = c.pag.split(' + ').map(s => s.trim());
  if(partes.length >= 2 && partes.every(p => /\S\s+R\$\s*[\d.,]+$/.test(p))){
    partes.forEach(p => {
      const mm = p.match(/^(.+?)\s+(R\$\s*[\d.,]+)$/);
      out.push(pontilhado(mm[1], mm[2].replace(/\s+/g, ' ')));
    });
  } else if(c.pag){
    out.push('  ' + c.pag);
  }
  c.cash.forEach(x => {
    let mm;
    if((mm = x.match(/pagará com:?\s*(R\$\s*[\d.,]+)\s*→\s*Troco:\s*(R\$\s*[\d.,]+)/i))){
      out.push(`  $ Pagar com ${mm[1].replace(/\s+/g, ' ')}`);
      out.push(`    Troco: ${mm[2].replace(/\s+/g, ' ')}`);
    } else if(/NÃO precisa/i.test(x)){
      out.push('  $ Sem troco (valor exato)');
    } else {
      quebrar('  $ ', simb(x.replace(/^Dinheiro[^—]*—\s*/, '')), '    ').forEach(y => out.push(y));
    }
  });

  const extras = [];
  if(c.taxa) extras.push(['Taxa de entrega', c.taxa.replace(/\s+/g, ' ')]);
  if(c.cupom) extras.push([`% Cupom ${c.cupom.cod}`, c.cupom.val.replace(/\s+/g, ' ')]);
  if(c.pontos) extras.push(['★ Desconto pontos', c.pontos.replace(/\s+/g, ' ')]);
  if(extras.length){
    out.push('', DIV);
    extras.forEach(([r, v]) => out.push(pontilhado(r, v)));
  }
  if(c.outros.length){
    out.push('');
    c.outros.forEach(l => out.push(simb(l)));
  }

  // ---------- total ----------
  const mTot = (rod[0] || '').match(/TOTAL A COBRAR:\s*\*?\s*(R\$\s*[\d.,]+)/);
  out.push('', SEP, mTot ? `◆ TOTAL A COBRAR: ${mTot[1].replace(/\s+/g, ' ')}` : simb(rod[0] || ''), SEP);
  if(rod.some(l => /Bom apetite/.test(l))) out.push(centro('✿ Bom apetite! ✿'), SEP);

  return out.join('\n').replace(/[\u{1F000}-\u{1FAFF}]\uFE0F?/gu, '•');
}

function abrirComandaCompleta(){
  const p = encontrarPedido(pedidoSelecionadoId);
  if(!p) return;
  const texto = p.texto_comanda || '';
  const nome = (texto.match(/Cliente:\s*(.+)/) || [])[1];
  document.getElementById('comanda-titulo').textContent = nome ? ('Comanda — ' + nome.trim()) : 'Comanda';
  document.getElementById('comanda-texto').textContent = converterParaImpressao(texto);
  document.getElementById('overlay-comanda').style.display = 'block';
}
function fecharComandaCompleta(){
  document.getElementById('overlay-comanda').style.display = 'none';
}
